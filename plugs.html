<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HF Pools · Smart plugs</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#EEF3F3;--surface:#fff;--surface-2:#F6F9F9;--line:#C7D6D6;--line-soft:#DCE6E6;--ink:#0A1417;--ink-2:#33474D;--ink-3:#5B7378;
--accent:#00676F;--accent-soft:#DCEEEE;--ok:#256B4C;--ok-soft:#DDEEE5;--warn:#8A590D;--warn-soft:#F6EAD4;--urgent:#B23A2E;--urgent-soft:#F8DEDA}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font:700 26px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
h1 small{font-size:15px;color:var(--accent);margin-left:6px}
h2{font:700 15px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:0 0 10px;display:flex;gap:8px;align-items:center}
h2 small{margin-left:auto;font:400 12px "IBM Plex Sans";text-transform:none;letter-spacing:0;color:var(--ink-3)}
.me{margin-left:auto;font-size:13px;color:var(--ink-3)}
.link,.me button{border:0;background:none;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.note{font-size:13px;color:var(--ink-3)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 11px;font-size:13.5px;margin-bottom:10px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:9px 11px;font-size:13.5px;margin-bottom:10px}
.okbox .note,.okbox .why{color:var(--ink-2)}
.errbox{background:var(--urgent-soft);color:var(--urgent);border-radius:8px;padding:9px 11px;font-size:13.5px;margin-bottom:10px}
.plug{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.plug-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:#2FA35A;box-shadow:0 0 0 4px #2FA35A33}
.dot.off{background:#9AA9AC}
.dot.offline{background:var(--urgent)}
.pname{font-weight:600;font-size:17px}
.pmeta{font-size:12.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.state{margin-left:auto;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:6px}
.state.on{background:var(--ok-soft);color:var(--ok)}
.state.off{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.state.offline{background:var(--urgent-soft);color:var(--urgent)}
.btns{display:flex;gap:8px;margin-top:10px}
.b{flex:1;padding:12px;border-radius:10px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font:600 15px "IBM Plex Sans";cursor:pointer}
.b.main{background:var(--accent);color:#fff}
.b:disabled{opacity:.45;cursor:default}
.b.sm{flex:none;padding:7px 11px;font-size:13px;border-width:1px}
.rule{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--surface-2);font-size:13.5px}
.rule b.on{color:var(--ok)} .rule b.off{color:var(--ink-2)}
.rule .why{color:var(--ink-3)}
.fc{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2)}
form.row,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-width:0}
.rules{font-size:14px;margin:0;padding-left:18px}.rules li{margin:4px 0}
.rgrid{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;font-size:14px}
.rgrid input{width:70px;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips label{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13px}
.dtab{border-collapse:collapse;font-size:13px;margin-top:6px;width:100%}.dtab td{padding:4px 6px;border-top:1px solid var(--line-soft)}.dtab td:first-child{width:46px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.log{font-size:13px}
.log div{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line-soft)}
.log div:first-child{border-top:0}
.log .t{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);flex:none;width:88px}
.login{max-width:380px;margin:12vh auto 0}
.login input{width:100%;margin-top:4px}
.login label{display:block;font-size:13px;color:var(--ink-3);margin-top:12px}
.msg{font-size:13px;margin-top:10px;min-height:18px}.msg.err{color:var(--urgent)}.msg.ok{color:var(--ok)}
</style></head><body>
<div class="wrap" id="app"><p class="note">Loading…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* HF Pools — smart plug test page (Kay, 1 Oct 2026).
 * Test the Shelly plugs before they go on the salt chlorinators: see each plug's state, switch it
 * ON/OFF, and see what the automatic rule WOULD do right now from the pool's real water tests.
 * Automatic switching (1 Oct 2026): the plugs Apps Script (plugs.gs autoRun, every 10 min) applies the same
 * rules when dosing_config/plugs.auto is true and writes autoState; keep ruleFor() here = ruleFor_() there.
 * The Shelly key never touches this page: switching goes through Kay's Apps Script (plugs.gs),
 * which checks the sign-in and keeps the key in its Script Properties.
 * Plug list + relay address: Firestore dosing_config/plugs. Switch log: plug_log. */
firebase.initializeApp({
  apiKey: "AIzaSyANFCZbvRGO9aMRtG9MF_qONO3FL85CzSo", authDomain: "maintenance-board-f931a.firebaseapp.com",
  projectId: "maintenance-board-f931a", storageBucket: "maintenance-board-f931a.firebasestorage.app",
  messagingSenderId: "169864970579", appId: "1:169864970579:web:bfb7490d0aebcfed17e1a6"
});
const auth = firebase.auth(), db = firebase.firestore();
const HISTORY_API = "https://script.google.com/macros/s/AKfycbwYJLfkw5lwKnjwqmEtuRiREzbahnf2l63YhmX_7jMR9uqM9MpeqoxeVTTVw5rc76eZ6g/exec";
const SALT_POOLS = ["BK","Lentor","Tengah","TPY","DR","HS","WWW"];
/* Rules agreed 27 Sep 2026 (claude/salt-chlorinator-alert.md). One place to change them. */
const DEFAULT_RULES = {
  onBelow: 1.5,          // morning FC below this -> ON
  offAtOrAbove: 1.5,     // an afternoon test at/above this -> OFF
  dosingOffHour: 17,     // night-dosing day: OFF by 5 pm
  eveningOffHour: 19.5,  // no dosing tonight: pools that don't run overnight go OFF at 7:30 pm
  noTestHour: 11,        // no morning test by 11 am -> OFF + tell Kay
  weekendOnHour: 8,      // Sat/Sun: ON from 8 am (not straight after the Fri/Sat night dosing)
  // overnight pools on a no-dosing night keep the afternoon test's decision all night (no night test is done)
  overnightPools: ["Tengah","HS","WWW"],
  // Night dosing schedule (salt branches only). 0 = Sun.
  dosing: {0:SALT_POOLS, 1:["Tengah","BK","Lentor"], 2:["WWW","BK","Lentor"], 3:["TPY","Tengah"], 4:["HS","DR"], 5:SALT_POOLS, 6:SALT_POOLS}
};
/* Kay can change the numbers + overnight pools on the page (saved in dosing_config/plugs.rules).
 * The night dosing schedule stays the team's fixed schedule. */
const RULE_NUMS = [
  {k:"onBelow", l:"Morning FC below this → ON", min:0, max:5, step:0.5, unit:"ppm"},
  {k:"offAtOrAbove", l:"Afternoon FC at or above this → OFF", min:0, max:5, step:0.5, unit:"ppm"},
  {k:"noTestHour", l:"No morning test by → OFF + tell Kay", min:9, max:14, step:1, unit:"h"},
  {k:"dosingOffHour", l:"Night dosing day → OFF from", min:12, max:19.5, step:0.5, unit:"h"},
  {k:"eveningOffHour", l:"No dosing tonight → other pools OFF from", min:12, max:19.5, step:0.5, unit:"h"},
  {k:"weekendOnHour", l:"Weekend → ON from", min:8, max:12, step:1, unit:"h"}];
let RULES = mergeRules(null);
function mergeRules(saved){
  const r = JSON.parse(JSON.stringify(DEFAULT_RULES));
  if(saved && typeof saved === "object"){
    RULE_NUMS.forEach(f => { const v = Number(saved[f.k]); if(saved[f.k] !== undefined && isFinite(v) && v >= f.min && v <= f.max) r[f.k] = v; });
    if(Array.isArray(saved.overnightPools)) r.overnightPools = saved.overnightPools.filter(p => SALT_POOLS.includes(p));
  }
  return r;
}
const hr = h => { const x = Math.floor(h), m = Math.round((h - x) * 60), ap = x >= 12 ? "pm" : "am", h12 = x % 12 || 12; return h12 + (m ? ":" + String(m).padStart(2, "0") : "") + " " + ap; };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const sgNow = () => new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Singapore"}));
const dayKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hhmm = iso => { const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const S = {user:null, cfg:{plugs:[], apiUrl:""}, status:{}, fc:{}, log:[], busy:{}, err:"", note:""};

/* ---------- the rule, worked out from today's tests ---------- */
function ruleFor(pool){
  if(!pool) return null;
  const now = sgNow(), h = now.getHours() + now.getMinutes() / 60, dow = now.getDay(), weekend = dow === 0 || dow === 6;
  if(S.fc[pool] && S.fc[pool].err) return {on:null, why:"couldn't read the water tests yet — wait a minute or press Refresh"};
  const t = S.fc[pool] || {}, dosingTonight = (RULES.dosing[dow] || []).includes(pool);
  const m = t.morning, a = t.afternoon;
  if(dosingTonight && h >= RULES.dosingOffHour) return {on:false, why:`night dosing at ${pool} tonight — OFF from ${hr(RULES.dosingOffHour)}`};
  if(!dosingTonight && h >= RULES.eveningOffHour && !RULES.overnightPools.includes(pool)) return {on:false, why:`${pool} doesn't run overnight — OFF from ${hr(RULES.eveningOffHour)}`};
  if(weekend) return h >= RULES.weekendOnHour ? {on:true, why:`weekend — ON from ${hr(RULES.weekendOnHour)} until ${hr(RULES.dosingOffHour)}`}
    : {on:null, why:`weekend — ON from ${hr(RULES.weekendOnHour)}`};
  if(a !== null && a !== undefined) return a >= RULES.offAtOrAbove ? {on:false, why:`afternoon FC ${a} is ${RULES.offAtOrAbove} or more`} : {on:true, why:`afternoon FC ${a} is still below ${RULES.offAtOrAbove}`};
  if(m !== null && m !== undefined) return m < RULES.onBelow ? {on:true, why:`morning FC ${m} is below ${RULES.onBelow}`} : {on:false, why:`morning FC ${m} is ${RULES.onBelow} or more`};
  if(h >= RULES.noTestHour) return {on:false, why:`no morning water test by ${hr(RULES.noTestHour)}`, alert:true};
  return {on:null, why:"waiting for the morning water test"};
}
async function loadFc(pools){
  const today = dayKey(sgNow());
  await Promise.all([...new Set(pools.filter(Boolean))].map(async p => {
    try{
      const j = await fetch(HISTORY_API + "?pool=" + encodeURIComponent(p) + "&_=" + Date.now()).then(r => r.json());
      const row = (j[p] || []).find(x => x.date === today) || {};
      const n = v => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? null : Number(v);
      S.fc[p] = {morning:n(row.fc && row.fc.morning), afternoon:n(row.fc && row.fc.afternoon), night:n(row.fc && row.fc.night)};
    }catch(e){ if(!S.fc[p] || S.fc[p].err) S.fc[p] = {err:true}; }   // keep the last good reading if one read fails
  }));
  bgRender();
}

/* ---------- talking to the relay ---------- */
async function relay(payload){
  if(!S.cfg.apiUrl) throw new Error("Add the Apps Script web app address in Settings first.");
  const idToken = await auth.currentUser.getIdToken();
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 30000);
  try{
    const r = await fetch(S.cfg.apiUrl, {method:"POST", signal:ac.signal, headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(Object.assign({idToken}, payload))});
    const j = await r.json().catch(() => null);
    if(!j) throw new Error("The relay sent something unexpected (HTTP " + r.status + ").");
    if(!j.ok) throw new Error(j.error || "refused");
    return j;
  }catch(e){ throw new Error(e.name === "AbortError" ? "No answer from the relay in 30 s." : e.message); }
  finally{ clearTimeout(timer); }
}
async function refreshStatus(retry){
  const ids = S.cfg.plugs.map(p => p.id).filter(Boolean);
  if(!ids.length || !S.cfg.apiUrl) return;
  S.loading = true; bgRender();
  try{ const j = await relay({action:"status", ids}); S.status = {}; (j.devices || []).forEach(d => S.status[d.id] = d); S.err = ""; S.checkedAt = new Date().toISOString(); }
  catch(e){ if(!retry){ S.loading = false; setTimeout(() => refreshStatus(true), 3000); return; } S.err = "Couldn't reach the plugs: " + e.message + " — press Refresh."; }   // one quiet retry first
  S.loading = false; bgRender();
}
async function switchPlug(p, on, reason){
  S.busy[p.id] = true; S.err = ""; render();
  try{
    await relay({action:"switch", id:p.id, on});
    S.status[p.id] = Object.assign({}, S.status[p.id] || {}, {on, online:true});
    const entry = {at:new Date().toISOString(), by:S.user.email, id:p.id, name:p.name, pool:p.pool || null, on, reason:reason || "manual"};
    S.log.unshift(entry);
    db.collection("plug_log").add(entry).catch(() => {});
    setTimeout(refreshStatus, 2500);   // Shelly allows 1 request a second
  }catch(e){ S.err = p.name + ": " + e.message; }
  S.busy[p.id] = false; render();
}

/* ---------- screens ---------- */
function plugHtml(p){
  const st = S.status[p.id], cls = !st ? "" : !st.online ? "offline" : st.on ? "on" : "off";
  const label = !st ? (S.loading ? "checking…" : "—") : !st.online ? "Offline" : st.on ? "ON" : "OFF";
  const rule = ruleFor(p.pool), t = p.pool ? S.fc[p.pool] : null;
  const fcLine = !p.pool ? "" : !t ? `<span class="fc">${esc(p.pool)} · reading tests…</span>`
    : t.err ? `<span class="fc">${esc(p.pool)} · couldn't read the water tests</span>`
    : `<span class="fc">${esc(p.pool)} today · morning FC ${t.morning ?? "–"} · afternoon ${t.afternoon ?? "–"} · night ${t.night ?? "–"}${t.src === "timer" ? ` <span class="note">(sheet read by the timer ${hhmm(t.at)})</span>` : ""}</span>`;
  const differs = rule && rule.on !== null && st && st.online && st.on !== rule.on;
  return `<div class="plug">
    <div class="plug-top"><span class="dot ${cls}"></span>
      <div><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(p.id)}${st && st.watts !== null && st.watts !== undefined ? ` · ${st.watts} W` : ""}${st && st.volts ? ` · ${st.volts} V` : ""}</div></div>
      <span class="state ${cls}">${label}</span></div>
    <div class="btns"><button class="b ${st && !st.on ? "main" : ""}" data-sw="${esc(p.id)}" data-on="1" ${S.busy[p.id] ? "disabled" : ""}>Switch ON</button>
      <button class="b ${st && st.on ? "main" : ""}" data-sw="${esc(p.id)}" data-on="0" ${S.busy[p.id] ? "disabled" : ""}>Switch OFF</button></div>
    ${p.pool ? `<div class="rule">${fcLine}<br>Rule says now: ${rule.on === null ? "<b>wait</b>" : `<b class="${rule.on ? "on" : "off"}">${rule.on ? "ON" : "OFF"}</b>`} <span class="why">— ${esc(rule.why)}</span>
      ${differs ? `<div style="margin-top:6px"><button class="b sm main" data-apply="${esc(p.id)}">Apply: switch ${rule.on ? "ON" : "OFF"}</button></div>` : ""}</div>` : `<div class="note" style="margin-top:8px">Not linked to a pool — manual only.</div>`}
  </div>`;
}
function ago(iso){ if(!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago"; }
function autoCard(){
  const on = S.cfg.auto === true, a = S.cfg.autoState || {}, last = a.lastRun, night = a.note === "night";
  const win = {start: 8, end: 20};   // same as DAY_START / DAY_END in plugs.gs
  const stale = !last || (!night && Date.now() - new Date(last) > 20 * 60000);
  const plugs = (S.cfg.plugs || []).filter(p => p.pool);
  const rows = plugs.map(p => { const x = (a.plugs || {})[p.id]; if(!x) return "";
    return `<div><b>${esc(p.name)}</b>: ${x.want === true ? "ON" : x.want === false ? "OFF" : "—"}${x.why ? ` · <span class="why">${esc(x.why)}</span>` : ""}${x.err ? ` · <span style="color:var(--urgent)">${esc(x.err)}</span>` : ""}${x.at ? ` <span class="note">(${hhmm(x.at)})</span>` : ""}</div>`; }).join("");
  return `<div class="${on ? "okbox" : "warnbox"}" id="autobox">
    <div class="row"><span>${on ? `🤖 <b>Automatic switching is ON.</b> Every ${a.every === 1 ? "minute" : "5 minutes"} from ${hr(win.start)} to ${hr(win.end)} the timer reads the water test sheet and switches the plugs that follow a pool. It sleeps at night.${a.every === 1 && a.testUntil ? ` <b>Test mode</b> until ${hhmm(a.testUntil)}, then back to every 5 minutes.` : ""}` : "✋ <b>Automatic switching is OFF.</b> Nothing switches by itself — \"Rule says\" shows what it <i>would</i> do; press Apply to do it by hand."}</span>
    <button class="b sm ${on ? "" : "main"}" id="autotgl" style="margin-left:auto">${on ? "Turn OFF" : "Turn ON"}</button></div>
    <div class="note" style="margin-top:6px">${last ? (night ? `Timer is asleep for the night — next check at ${hr(win.start)}.` : `Timer last checked ${ago(last)}${stale ? ` — <b style="color:var(--urgent)">the timer doesn't seem to be running</b>` : ""}.`) : "The timer hasn't run yet (run setupTimer in the Apps Script once)."}${a.tg && a.tg !== "ok" ? ` · Telegram: ${esc(a.tg)}` : ""}
    It only switches when the rule's answer changes, so if you switch a plug by hand it stays until the next new water test or time (5 pm, 7:30 pm…). This page updates by itself.</div>
    ${on && rows ? `<div style="margin-top:6px;font-size:13px">${rows}</div>` : ""}</div>`;
}
function rulesCard(){
  const R = RULES, days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], order = [1,2,3,4,5,6,0], today = sgNow().getDay();
  const changed = RULE_NUMS.some(f => R[f.k] !== DEFAULT_RULES[f.k]) || R.overnightPools.join() !== DEFAULT_RULES.overnightPools.join();
  const stay = SALT_POOLS.filter(p => !R.overnightPools.includes(p));
  const sched = `<table class="dtab">${order.map(d => `<tr${d === today ? ' style="font-weight:600"' : ""}><td>${days[d]}</td><td>${(R.dosing[d] || []).length === SALT_POOLS.length ? "All salt pools" : esc((R.dosing[d] || []).join(", "))}</td></tr>`).join("")}</table>`;
  if(S.editRules) return `<div class="card"><h2>Edit the rules</h2>
    <form id="rulef"><div class="rgrid">${RULE_NUMS.map(f => `<label for="r-${f.k}">${f.l}</label><span><input id="r-${f.k}" type="number" min="${f.min}" max="${f.max}" step="${f.step}" value="${R[f.k]}" required> <span class="note">${f.unit === "h" ? "h" : f.unit}</span></span>`).join("")}</div>
    <div style="margin:12px 0 6px;font-size:14px">Can run overnight on nights with no dosing (if the afternoon test is still low):</div>
    <div class="chips">${SALT_POOLS.map(p => `<label><input type="checkbox" value="${p}" ${R.overnightPools.includes(p) ? "checked" : ""}> ${p}</label>`).join("")}</div>
    <div class="note" style="margin-top:8px">Hours use the 24-hour clock (17 = 5 pm, 19.5 = 7:30 pm). The timer works 8 am – 8 pm, so times must be inside that. The night dosing days follow the team schedule and aren't changed here.</div>
    <div class="row" style="margin-top:12px"><button class="b sm main">Save rules</button><button type="button" class="b sm" id="r-cancel">Cancel</button>${changed ? `<button type="button" class="link" id="r-reset" style="margin-left:auto">Back to the original rules</button>` : ""}</div></form></div>`;
  return `<div class="card"><h2>The rules <small>${changed ? "changed by you · " : ""}<button class="link" id="r-edit">Edit</button></small></h2>
    <ol class="rules">
      <li><b>Weekday morning test:</b> FC below ${R.onBelow} → <b>ON</b>. ${R.onBelow} or more → <b>OFF</b>.</li>
      <li><b>Afternoon test:</b> FC ${R.offAtOrAbove} or more → <b>OFF</b>. Still below ${R.offAtOrAbove} → stays <b>ON</b>.</li>
      <li><b>No morning test by ${hr(R.noTestHour)}:</b> <b>OFF</b>, and Kay is told — no guessing.</li>
      <li><b>Weekend (Sat, Sun):</b> <b>ON</b> from ${hr(R.weekendOnHour)} until ${hr(R.dosingOffHour)} — the water tests don't change it.</li>
      <li><b>Night dosing day:</b> <b>OFF</b> from ${hr(R.dosingOffHour)}, so the chlorinator is off before dosing.</li>
      <li><b>No dosing tonight:</b> ${R.overnightPools.length ? esc(R.overnightPools.join(", ")) + ` keep what the afternoon test decided, all night (FC still below ${R.offAtOrAbove} → stays <b>ON</b> overnight)` : "no pool runs overnight"}${stay.length ? `; ${esc(stay.join(", "))} go <b>OFF</b> from ${hr(R.eveningOffHour)}` : ""}. Next morning the morning test decides again.</li>
    </ol>
    <div style="margin-top:10px;font-size:13px;color:var(--ink-2)">Night dosing days (salt pools)</div>${sched}
    <div class="note" style="margin-top:8px">Checked from the top: evening rules first, then weekend, then the afternoon test, then the morning test. The night water test is not used.</div></div>`;
}
function render(){
  if(!S.user) return;
  const plugs = S.cfg.plugs || [];
  $("#app").innerHTML = `
  <header><h1>HF Pools <small>Smart plugs</small></h1><span class="me">${esc(S.user.email)} · <button id="out">Sign out</button></span></header>
  ${autoCard()}
  ${S.err ? `<div class="errbox">${esc(S.err)}</div>` : ""}
  <div class="card"><h2>Plugs <small>${S.checkedAt ? "checked " + hhmm(S.checkedAt) : ""} · <button class="link" id="refresh">Refresh</button></small></h2>
    ${plugs.length ? plugs.map(plugHtml).join("") : `<div class="note">No plugs yet — add one below.</div>`}</div>
  ${(() => { const ed = S.editId ? plugs.find(p => p.id === S.editId) : null; return `<div class="card"><h2>${ed ? "Edit " + esc(ed.name) : "Add a plug"}</h2>
    <form class="row" id="addf"><input id="a-name" placeholder="Name (e.g. Test HS)" required style="flex:1 1 150px" value="${ed ? esc(ed.name) : ""}">
      <input id="a-id" placeholder="Device ID (e.g. e4b063a1b2c3)" required style="flex:1 1 170px" autocomplete="off" value="${ed ? esc(ed.id) : ""}" ${ed ? "readonly" : ""}>
      <select id="a-pool"><option value="">Follow pool…</option>${SALT_POOLS.map(p => `<option ${ed && ed.pool === p ? "selected" : ""}>${p}</option>`).join("")}</select>
      <button class="b sm main">${ed ? "Save" : "Add"}</button>${ed ? ` <button type="button" class="b sm" id="a-cancel">Cancel</button>` : ""}</form>`; })()}
    ${plugs.length ? `<div class="note" style="margin-top:10px">${plugs.map(p => `${esc(p.name)} → ${esc(p.pool || "manual")} <button class="link" data-edit="${esc(p.id)}">edit</button> <button class="link" data-del="${esc(p.id)}">remove</button>`).join(" · ")}</div>` : ""}
    <div class="note" style="margin-top:8px">Device ID: Shelly app → the plug → Settings → Device information.</div></div>
  ${rulesCard()}
  <div class="card"><h2>Recent switches</h2><div class="log">${S.log.length ? S.log.slice(0, 20).map(l => `<div><span class="t">${new Date(l.at).toLocaleString("en-SG", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", hour12:false})}</span><span><b>${esc(l.name)}</b> ${l.on ? "ON" : "OFF"} · ${esc(l.reason)} · ${esc(String(l.by || "").split("@")[0])}</span></div>`).join("") : `<span class="note">Nothing switched yet.</span>`}</div></div>
  <div class="card"><h2>Settings</h2>
    <form class="row" id="apif"><input id="api" placeholder="Apps Script web app URL (…/exec)" value="${esc(S.cfg.apiUrl || "")}" style="flex:1 1 300px" autocomplete="off"><button class="b sm main">Save</button></form>
    <div class="note" style="margin-top:6px">The Shelly key is NOT entered here — it stays in the Apps Script's Script Properties.</div></div>`;
  $("#out").onclick = () => auth.signOut();
  $("#refresh").onclick = async () => { try{ const d = await db.doc("dosing_config/plugs").get(); if(d.exists){ S.cfg = Object.assign({plugs:[], apiUrl:""}, d.data()); RULES = mergeRules(S.cfg.rules); } }catch(e){} render(); refreshStatus(); loadFcNeeded(); };
  document.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => { const p = plugs.find(x => x.id === b.dataset.sw); if(p) switchPlug(p, b.dataset.on === "1", "manual"); });
  document.querySelectorAll("[data-apply]").forEach(b => b.onclick = () => { const p = plugs.find(x => x.id === b.dataset.apply); const r = p && ruleFor(p.pool); if(p && r && r.on !== null) switchPlug(p, r.on, "rule: " + r.why); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if(!confirm("Remove this plug from the page? (It stays in your Shelly app.)")) return; saveCfg({plugs: plugs.filter(p => p.id !== b.dataset.del)}); });
  $("#addf").onsubmit = e => { e.preventDefault();
    const id = $("#a-id").value.trim().replace(/^shelly[\w-]*-/i, "").toLowerCase(), name = $("#a-name").value.trim(), pool = $("#a-pool").value;
    if(!/^[0-9a-f]{6,16}$/.test(id)){ S.err = "Device ID should look like e4b063a1b2c3 (letters a–f and numbers)."; render(); return; }
    if(S.editId){ const eid = S.editId; S.editId = null; saveCfg({plugs: plugs.map(p => p.id === eid ? Object.assign({}, p, {name, pool}) : p)}); return; }
    if(plugs.some(p => p.id === id)){ S.err = "That plug is already on the list."; render(); return; }
    saveCfg({plugs: plugs.concat([{id, name, pool}])}); };
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { S.editId = b.dataset.edit; render(); const n = $("#a-name"); n.focus(); n.select(); });
  if($("#a-cancel")) $("#a-cancel").onclick = () => { S.editId = null; render(); };
  $("#autotgl").onclick = () => { const on = S.cfg.auto === true;
    if(!confirm(on ? "Turn OFF automatic switching? The plugs stay as they are now." : "Turn ON automatic switching? The timer will switch the plugs that follow a pool (" + plugs.filter(p => p.pool).map(p => p.name).join(", ") + ") by the rules, starting within 5 minutes (day time).")) return;
    saveCfg({auto: !on, autoBy: S.user.email, autoAt: new Date().toISOString()}); };
  if($("#r-edit")) $("#r-edit").onclick = () => { S.editRules = true; render(); };
  if($("#r-cancel")) $("#r-cancel").onclick = () => { S.editRules = false; render(); };
  if($("#r-reset")) $("#r-reset").onclick = () => { if(!confirm("Go back to the original rules?")) return; S.editRules = false; RULES = mergeRules(null); saveCfg({rules: firebase.firestore.FieldValue.delete()}); };
  if($("#rulef")) $("#rulef").onsubmit = e => { e.preventDefault();
    const out = {}; for(const f of RULE_NUMS){ const v = Number($("#r-" + f.k).value); if(!isFinite(v) || v < f.min || v > f.max){ S.err = f.l + ": use a number from " + f.min + " to " + f.max + "."; render(); return; } out[f.k] = v; }
    out.overnightPools = [...document.querySelectorAll("#rulef .chips input:checked")].map(x => x.value);
    out.changedBy = S.user.email; out.changedAt = new Date().toISOString();
    S.editRules = false; RULES = mergeRules(out); saveCfg({rules: out}); };
  $("#apif").onsubmit = e => { e.preventDefault(); const u = $("#api").value.trim();
    if(u && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){ S.err = "That doesn't look like an Apps Script web app address (…/exec)."; render(); return; }
    saveCfg({apiUrl:u}); };
}
async function loadLog(){ try{ const q = await db.collection("plug_log").orderBy("at", "desc").limit(20).get(); S.log = []; q.forEach(x => S.log.push(x.data())); }catch(e){} }
/* Every minute while the page is open: re-read the config (1 small read). If the timer has switched a plug
 * since the page last asked the plugs, ask them again and reload the switch list. */
/* Live updates while the page is open:
 *  - the config doc is watched (onSnapshot): the timer writes it every run, so a switch it makes shows within seconds;
 *    when its per-plug record changes, the plugs, the switch list and the water tests are read again;
 *  - every minute the rule text follows the clock; every 3 minutes the water tests are re-read. */
function editing(){ const a = document.activeElement; return S.editRules || S.editId || (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && $("#app").contains(a)); }
function bgRender(){ if(!editing()) render(); }
/* The timer reads the sheet every run and leaves today's numbers in autoState.tests. When those are fresh the page
 * uses them (same numbers the timer acted on) and only reads the sheet itself for pools the timer isn't covering. */
function timerTests(){
  const a = S.cfg.autoState || {}, T = a.tests || {}, today = dayKey(sgNow()), fresh = a.lastRun && Date.now() - new Date(a.lastRun) < 20 * 60000;
  const covered = new Set();
  if(S.cfg.auto === true && fresh) Object.keys(T).forEach(pool => { const x = T[pool]; if(x && x.date === today){ S.fc[pool] = {morning:x.morning, afternoon:x.afternoon, night:x.night ?? null, src:"timer", at:x.at}; covered.add(pool); } });
  return covered;
}
function loadFcNeeded(){ const c = timerTests(); const need = (S.cfg.plugs || []).map(p => p.pool).filter(p => p && !c.has(p)); if(need.length) return loadFc(need); bgRender(); }
let autoSig = null, fcAt = 0;
function autoSigOf(){ const pl = (S.cfg.autoState || {}).plugs || {}; return JSON.stringify(Object.keys(pl).sort().map(k => [k, pl[k] && pl[k].at, pl[k] && pl[k].done, pl[k] && pl[k].err])); }
function watchCfg(){
  db.doc("dosing_config/plugs").onSnapshot(d => {
    if(!d.exists) return;
    S.cfg = Object.assign({plugs:[], apiUrl:""}, d.data()); RULES = mergeRules(S.cfg.rules);
    const sig = autoSigOf(), changed = autoSig !== null && sig !== autoSig; autoSig = sig;
    timerTests();
    if(changed && !document.hidden){ loadLog().then(bgRender); setTimeout(refreshStatus, 1200); loadFcNeeded(); fcAt = Date.now(); }
    bgRender();
  }, () => {});
}
function liveTick(){
  if(document.hidden || !S.user) return;
  if(Date.now() - fcAt > 3 * 60000){ fcAt = Date.now(); loadFcNeeded(); }
  bgRender();
}
async function saveCfg(patch){
  Object.keys(patch).forEach(k => { if(k === "rules" && !(patch.rules && patch.rules.onBelow !== undefined)) delete S.cfg.rules; else S.cfg[k] = patch[k]; }); S.err = ""; render();
  try{ await db.doc("dosing_config/plugs").set(patch, {merge:true}); }catch(e){ S.err = "Couldn't save: " + e.message; render(); }
  refreshStatus(); loadFcNeeded();
}
function loginView(msg){
  $("#app").innerHTML = `<div class="card login"><h1 style="font-size:24px">HF Pools <small>Smart plugs</small></h1>
    <form id="lf"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
    <button class="b main" style="width:100%;margin-top:16px">Sign in</button></form><div class="msg err">${esc(msg || "")}</div></div>`;
  $("#lf").onsubmit = async e => { e.preventDefault(); try{ await auth.signInWithEmailAndPassword($("#em").value.trim(), $("#pw").value); }catch(err){ loginView("Email or password is not right."); } };
}
auth.onAuthStateChanged(async u => {
  S.user = u; if(!u){ loginView(); return; }
  render();
  try{ const d = await db.doc("dosing_config/plugs").get(); if(d.exists) S.cfg = Object.assign({plugs:[], apiUrl:""}, d.data()); RULES = mergeRules(S.cfg.rules); }catch(e){}
  await loadLog();
  render(); refreshStatus(); loadFcNeeded(); fcAt = Date.now();
  autoSig = autoSigOf(); watchCfg();
  setInterval(liveTick, 60000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden && S.user){ refreshStatus(); loadLog().then(bgRender); fcAt = 0; liveTick(); } });
});
</script>
<script src="https://hfpools.com/nav.js" defer></script>
