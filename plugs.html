  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 30000);
  try{
    const r = await fetch(S.cfg.apiUrl, {method:"POST", signal:ac.signal, headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(Object.assign({idToken}, payload))});
    const j = await r.json().catch(() => null);
    if(!j) throw new Error("The relay sent something unexpected (HTTP " + r.status + ").");
    if(!j.ok) throw new Error(j.error || "refused");
    return j;
  }catch(e){ throw new Error(e.name === "AbortError" ? "No answer from the relay in 30 s." : e.message); }
  finally{ clearTimeout(timer); }
}
async function refreshStatus(retry){
  const ids = S.cfg.plugs.map(p => p.id).filter(Boolean);

  S.loading = true; bgRender();
  try{ const j = await relay({action:"status", ids}); S.status = {}; (j.devices || []).forEach(d => S.status[d.id] = d); S.err = ""; S.checkedAt = new Date().toISOString(); }
  catch(e){ if(!retry){ S.loading = false; setTimeout(() => refreshStatus(true), 3000); return; } S.err = "Couldn't reach the plugs: " + e.message + " — press Refresh."; }   // one quiet retry first
  S.loading = false; bgRender();
}
async function switchPlug(p, on, reason){
  S.busy[p.id] = true; S.err = ""; render();
  try{
    await relay({action:"switch", id:p.id, on});
    S.status[p.id] = Object.assign({}, S.status[p.id] || {}, {on, online:true});
    const entry = {at:new Date().toISOString(), by:S.user.email, id:p.id, name:p.name, pool:p.pool || null, on, reason:reason || "manual"};
    S.log.unshift(entry);
    db.collection("plug_log").add(entry).catch(() => {});
    setTimeout(refreshStatus, 2500);   // Shelly allows 1 request a second
  }catch(e){ S.err = p.name + ": " + e.message; }
  S.busy[p.id] = false; render();
}

  if($("#r-cancel")) $("#r-cancel").onclick = () => { S.editRules = false; render(); };
  if($("#r-reset")) $("#r-reset").onclick = () => { if(!confirm("Put the default rules back to the original numbers? Each outlet's own settings are kept.")) return;
    S.editRules = false; const keep = RULES.pools || {}; RULES = mergeRules({pools: keep}); savePools(keep, true); };
  document.querySelectorAll("[data-pedit]").forEach(b => b.onclick = () => { S.editPool = b.dataset.pedit; render(); const f = $("#poolf"); if(f) f.scrollIntoView({block:"center"}); });
  if($("#p-cancel")) $("#p-cancel").onclick = () => { S.editPool = null; render(); };
  if($("#p-std")) $("#p-std").onclick = () => { const pool = S.editPool; if(!confirm("Remove " + pool + "'s schedule? It will only be switched by hand (the night-dosing lock still applies).")) return;
    const pools = Object.assign({}, RULES.pools || {}); delete pools[pool]; S.editPool = null; RULES = mergeRules(Object.assign({}, S.cfg.rules || {}, {pools})); savePools(pools); };
  if($("#poolf")) $("#poolf").onsubmit = e => { e.preventDefault(); const pool = S.editPool, c = {};
    const nt = Number($("#p-noTestHour").value); if(!isFinite(nt) || nt < 9 || nt > 14){ S.err = pool + " — no morning test by: use 9 to 14."; render(); return; }
    if(nt !== DEFAULT_RULES.noTestHour) c.noTestHour = nt;
    const v = id => $(id).value.trim(), w = [];
    for(const i of [0,1,2,3,4,5,6]) w[i] = $(`#w${i}-off`).checked ? {off:true} : Object.fromEntries([["below", v(`#w${i}-below`)], ["closeAt", v(`#w${i}-close`)], ["onFrom", v(`#w${i}-from`)], ["nightFrom", v(`#w${i}-nf`)], ["nightTo", v(`#w${i}-nt`)]].filter(x => x[1] !== "").map(x => [x[0], Number(x[1])]));
    const wk = cleanWeek(w);
    if(!wk){ S.err = pool + " weekly schedule: each day needs 'ON if FC below' (0–5) and 'OFF at' (8–24), unless it is OFF all day."; render(); return; }
    c.week = wk; c.changedBy = S.user.email; c.changedAt = new Date().toISOString();
    const pools = Object.assign({}, RULES.pools || {}); pools[pool] = c;
    S.editPool = null; RULES = mergeRules(Object.assign({}, S.cfg.rules || {}, {pools})); savePools(pools); };
  if($("#rulef")) $("#rulef").onsubmit = e => { e.preventDefault();
    const out = {}; for(const f of RULE_NUMS){ const v = Number($("#r-" + f.k).value); if(!isFinite(v) || v < f.min || v > f.max){ S.err = f.l + ": use a number from " + f.min + " to " + f.max + "."; render(); return; } out[f.k] = v; }
    out.overnightPools = [...document.querySelectorAll("#rulef .chips input:checked")].map(x => x.value);
    out.changedBy = S.user.email; out.changedAt = new Date().toISOString();
    out.pools = RULES.pools || {};
    S.editRules = false; RULES = mergeRules(out); saveCfg({rules: out}); };
  $("#apif").onsubmit = e => { e.preventDefault(); const u = $("#api").value.trim();
    if(u && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){ S.err = "That doesn't look like an Apps Script web app address (…/exec)."; render(); return; }
    saveCfg({apiUrl:u}); };
}
async function loadLog(){ try{ const q = await db.collection("plug_log").orderBy("at", "desc").limit(20).get(); S.log = []; q.forEach(x => S.log.push(x.data())); }catch(e){} }
/* Every minute while the page is open: re-read the config (1 small read). If the timer has switched a plug
 * since the page last asked the plugs, ask them again and reload the switch list. */
/* Live updates while the page is open:
 *  - the config doc is watched (onSnapshot): the timer writes it every run, so a switch it makes shows within seconds;
 *    when its per-plug record changes, the plugs, the switch list and the water tests are read again;
 *  - every minute the rule text follows the clock; every 3 minutes the water tests are re-read. */
function editing(){ const a = document.activeElement; return S.editRules || S.editPool || S.editId || (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && $("#app").contains(a)); }
function bgRender(){ if(!editing()) render(); }
/* The timer reads the sheet every run and leaves today's numbers in autoState.tests. When those are fresh the page
 * uses them (same numbers the timer acted on) and only reads the sheet itself for pools the timer isn't covering. */
function timerTests(){
  const a = S.cfg.autoState || {}, T = a.tests || {}, today = dayKey(sgNow()), fresh = a.lastRun && Date.now() - new Date(a.lastRun) < 20 * 60000;
  const covered = new Set();
  if(S.cfg.auto === true && fresh) Object.keys(T).forEach(pool => { const x = T[pool]; if(x && x.date === today){ S.fc[pool] = {morning:x.morning, afternoon:x.afternoon, night:x.night ?? null, src:"timer", at:x.at}; covered.add(pool); } });
  return covered;
}
function loadFcNeeded(){ const c = timerTests(); const need = (S.cfg.plugs || []).map(p => p.pool).filter(p => p && !c.has(p)); if(need.length) return loadFc(need); bgRender(); }
let autoSig = null, fcAt = 0;
function autoSigOf(){ const pl = (S.cfg.autoState || {}).plugs || {}; return JSON.stringify(Object.keys(pl).sort().map(k => [k, pl[k] && pl[k].at, pl[k] && pl[k].done, pl[k] && pl[k].err])); }
function watchCfg(){
  db.doc("dosing_config/plugs").onSnapshot(d => {
    if(!d.exists) return;
    S.cfg = Object.assign({plugs:[], apiUrl:""}, d.data()); RULES = mergeRules(S.cfg.rules);
    const sig = autoSigOf(), changed = autoSig !== null && sig !== autoSig; autoSig = sig;
    timerTests();
    if(changed && !document.hidden){ loadLog().then(bgRender); setTimeout(refreshStatus, 1200); loadFcNeeded(); fcAt = Date.now(); }
    bgRender();
  }, () => {});
}
function liveTick(){
  if(document.hidden || !S.user) return;
  if(Date.now() - fcAt > 3 * 60000){ fcAt = Date.now(); loadFcNeeded(); }
  bgRender();
}
async function savePools(pools, resetStandard){
  const cur = Object.assign({}, S.cfg.rules || {});
  const next = resetStandard ? {pools} : Object.assign(cur, {pools});
  S.cfg.rules = next; S.err = ""; render();
  try{ await db.doc("dosing_config/plugs").update({rules: next}); }catch(e){ S.err = "Couldn't save: " + e.message; render(); }
  refreshStatus(); loadFcNeeded();
}
async function saveCfg(patch){
  Object.keys(patch).forEach(k => { if(k === "rules" && !(patch.rules && (patch.rules.onBelow !== undefined || patch.rules.pools))) delete S.cfg.rules; else S.cfg[k] = patch[k]; }); S.err = ""; render();
  try{ await db.doc("dosing_config/plugs").set(patch, {merge:true}); }catch(e){ S.err = "Couldn't save: " + e.message; render(); }
  refreshStatus(); loadFcNeeded();
}
function loginView(msg){
  $("#app").innerHTML = `<div class="card login"><h1 style="font-size:24px">HF Pools <small>Smart plugs</small></h1>
    <form id="lf"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
    <button class="b main" style="width:100%;margin-top:16px">Sign in</button></form><div class="msg err">${esc(msg || "")}</div></div>`;
  $("#lf").onsubmit = async e => { e.preventDefault(); try{ await auth.signInWithEmailAndPassword($("#em").value.trim(), $("#pw").value); }catch(err){ loginView("Email or password is not right."); } };
}
auth.onAuthStateChanged(async u => {
  S.user = u; if(!u){ loginView(); return; }
  render();
  try{ const d = await db.doc("dosing_config/plugs").get(); if(d.exists) S.cfg = Object.assign({plugs:[], apiUrl:""}, d.data()); RULES = mergeRules(S.cfg.rules); }catch(e){}
  await loadLog();
  render(); refreshStatus(); loadFcNeeded(); fcAt = Date.now();
  autoSig = autoSigOf(); watchCfg();
  setInterval(liveTick, 60000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden && S.user){ refreshStatus(); loadLog().then(bgRender); fcAt = 0; liveTick(); } });
});
</script>
<script src="https://hfpools.com/nav.js" defer></script>
