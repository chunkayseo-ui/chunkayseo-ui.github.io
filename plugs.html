/* ---------- talking to the relay ---------- */
async function relay(payload){
  if(!S.cfg.apiUrl) throw new Error("Add the Apps Script web app address in Settings first.");
  const idToken = await auth.currentUser.getIdToken();
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 30000);
  try{
    const r = await fetch(S.cfg.apiUrl, {method:"POST", signal:ac.signal, headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(Object.assign({idToken}, payload))});
    const j = await r.json().catch(() => null);
    if(!j) throw new Error("The relay sent something unexpected (HTTP " + r.status + ").");
    if(!j.ok) throw new Error(j.error || "refused");
    return j;
  }catch(e){ throw new Error(e.name === "AbortError" ? "No answer from the relay in 30 s." : e.message); }
  finally{ clearTimeout(timer); }
}
async function refreshStatus(retry){

  catch(e){ if(!retry){ S.loading = false; setTimeout(() => refreshStatus(true), 3000); return; } S.err = "Couldn't reach the plugs: " + e.message + " — press Refresh."; }   // one quiet retry first

}
async function switchPlug(p, on, reason){

    S.log.unshift(entry);

  <header><h1>HF Pools <small>Smart plugs</small></h1><span class="me">${esc(S.user.email)} · <button id="out">Sign out</button></span></header>
  ${stripHtml()}
  ${S.err ? `<div class="errbox">${esc(S.err)}</div>` : ""}
  ${boardHtml()}
  ${S.openPool ? `<div class="card open-card" id="opencard"><h2>${esc(S.openPool)} · switches &amp; details <button class="link" id="closepool">close</button></h2>
    ${openPlugs.length ? openPlugs.map(plugHtml).join("") : `<div class="note">No plug at ${esc(S.openPool)} yet.</div>`}</div>` : `<div class="note" style="margin:-4px 0 14px">Tap an outlet to switch its plug by hand or see today's rule. FC = morning / afternoon / night test. 🔒 = Switch ON is locked (night dosing done, or no water test yet).</div>`}
  ${unlinked.length ? `<div class="card"><h2>Plugs not linked to a pool</h2>${unlinked.map(plugHtml).join("")}</div>` : ""}
  <div class="folds-h">More — tap to open</div>
  ${fold("runtime", "⚡ Run time — last 7 days", rtWeekCard(), false)}
  ${fold("timer", "🤖 Timer &amp; what it did today", autoCard(), false)}
  ${guardCard()}
  ${fold("rules", "📅 Rules &amp; weekly schedules", rulesCard().replace(/^<div class="card"><h2>Rules<\/h2>/, "<div>"), !!(S.editPool || S.editRules))}
  ${fold("plugs", "🔌 Add or edit plugs", plugsAdmin, !!S.editId)}
  ${fold("log", "🕘 Recent switches", logHtml(plugs), false)}
  ${fold("settings", "⚙️ Settings", `<form class="row" id="apif"><input id="api" placeholder="Apps Script web app URL (…/exec)" value="${esc(S.cfg.apiUrl || "")}" style="flex:1 1 300px" autocomplete="off"><button class="b sm main">Save</button></form>
    <div class="note" style="margin-top:6px">The Shelly key is NOT entered here — it stays in the Apps Script's Script Properties.</div>`, false)}`;
  document.querySelectorAll("[data-tile]").forEach(b => b.onclick = () => { S.openPool = S.openPool === b.dataset.tile ? null : b.dataset.tile; render(); const c = $("#opencard"); if(c && S.openPool) c.scrollIntoView({block:"nearest", behavior:"smooth"}); });
  if($("#closepool")) $("#closepool").onclick = () => { S.openPool = null; render(); };
  document.querySelectorAll("[data-ovset]").forEach(b => b.onclick = async () => { const id = b.dataset.ovset, on = $(`[data-ovon="${id}"]`).value === "1", until = Number($(`[data-ovuntil="${id}"]`).value);
    const p = plugs.find(x => x.id === id); if(!p || !isFinite(until)) return;
    if(!confirm(`${p.name}: switch ${on ? "ON" : "OFF"} now and keep it ${on ? "ON" : "OFF"} until ${hr(until)} today, whatever the schedule says?`)) return;
    const overrides = Object.assign({}, S.cfg.overrides || {}); overrides[id] = {date: dayKey(sgNow()), on, until, by: S.user.email, at: new Date().toISOString()};
    await saveCfg({overrides}); await applyRuleNow(p); });
  document.querySelectorAll("[data-ovon]").forEach(s => s.onchange = () => { const b = $(`[data-ovset="${s.dataset.ovon}"]`); if(b) b.textContent = "Set & switch " + (s.value === "1" ? "ON" : "OFF"); });
  document.querySelectorAll("[data-ovclear]").forEach(b => b.onclick = async () => { const id = b.dataset.ovclear; const pp = plugs.find(x => x.id === id);
    if(!confirm(`${pp ? pp.name : id}: cancel the Today-only and go back to the schedule now? The plug switches straight away if the schedule says so.`)) return;
    const overrides = Object.assign({}, S.cfg.overrides || {}); delete overrides[id]; S.cfg.overrides = overrides; S.err = ""; render();
    try{ await db.doc("dosing_config/plugs").update({["overrides." + id]: firebase.firestore.FieldValue.delete()}); }catch(e){ S.err = "Couldn't cancel: " + e.message; render(); }   // merge:true would keep the key, so delete it properly
    applyRuleNow(plugs.find(x => x.id === id)); });
  document.querySelectorAll("details.fold").forEach(d => d.addEventListener("toggle", () => { S.folds[d.dataset.fold] = d.open; try{ localStorage.setItem("hf-folds", JSON.stringify(S.folds)); }catch(e){} const c = d.querySelector(".chev"); if(c) c.textContent = d.open ? "hide" : "show"; }));
  { const sp = $("[data-logplug]"); if(sp) sp.onchange = () => { S.logPlug = sp.value; try{ localStorage.setItem("hf-log-plug", S.logPlug); }catch(e){} render(); };
    const sd = $("[data-logdays]"); if(sd) sd.onchange = () => { S.logDays = Number(sd.value) || 0; try{ localStorage.setItem("hf-log-days", String(S.logDays)); }catch(e){} S.folds.log = true; render(); loadLog().then(render); }; }
  $("#out").onclick = () => auth.signOut();
  { const g = $("#guard"); if(g) g.addEventListener("toggle", () => { S.guardOpen = g.open; try{ localStorage.setItem("hf-guard-open2", g.open ? "1" : "0"); }catch(e){} const c = g.querySelector(".chev"); if(c) c.textContent = g.open ? "hide" : "show"; }); }
  $("#refresh").onclick = async () => { try{ const d = await db.doc("dosing_config/plugs").get(); if(d.exists){ S.cfg = Object.assign({plugs:[], apiUrl:""}, d.data()); RULES = mergeRules(S.cfg.rules); } }catch(e){} render(); refreshStatus(); loadFcNeeded(); };
  document.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => { const p = plugs.find(x => x.id === b.dataset.sw); if(!p) return; if(b.dataset.on === "1"){ const r = ruleFor(p.pool, p.week, p.id); if(r && r.lock){ S.err = p.name + ": " + r.why + "."; render(); return; } } switchPlug(p, b.dataset.on === "1", "manual"); });
  document.querySelectorAll("[data-apply]").forEach(b => b.onclick = () => { const p = plugs.find(x => x.id === b.dataset.apply); const r = p && ruleFor(p.pool, p.week, p.id); if(p && r && r.on !== null) switchPlug(p, r.on, "rule: " + r.why); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if(!confirm("Remove this plug from the page? (It stays in your Shelly app.)")) return; saveCfg({plugs: plugs.filter(p => p.id !== b.dataset.del)}); });
  $("#addf").onsubmit = e => { e.preventDefault();
    const id = $("#a-id").value.trim().replace(/^shelly[\w-]*-/i, "").toLowerCase(), name = $("#a-name").value.trim(), pool = $("#a-pool").value;
    if(!/^[0-9a-f]{6,16}$/.test(id)){ S.err = "Device ID should look like e4b063a1b2c3 (letters a–f and numbers)."; render(); return; }
    if(S.editId){ const eid = S.editId; S.editId = null; saveCfg({plugs: plugs.map(p => p.id === eid ? Object.assign({}, p, {name, pool}) : p)}); return; }
    if(plugs.some(p => p.id === id)){ S.err = "That plug is already on the list."; render(); return; }
    saveCfg({plugs: plugs.concat([{id, name, pool}])}); };
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { S.editId = b.dataset.edit; render(); const n = $("#a-name"); n.focus(); n.select(); });
  if($("#a-cancel")) $("#a-cancel").onclick = () => { S.editId = null; render(); };
  $("#autotgl").onclick = () => { const on = S.cfg.auto === true;
    if(!confirm(on ? "Turn OFF automatic switching? The plugs stay as they are now." : "Turn ON automatic switching? The timer will switch the plugs that follow a pool (" + plugs.filter(p => p.pool).map(p => p.name).join(", ") + ") by the rules, starting within 5 minutes (day time).")) return;
    saveCfg({auto: !on, autoBy: S.user.email, autoAt: new Date().toISOString()}); };
  if($("#r-edit")) $("#r-edit").onclick = () => { S.editRules = true; render(); };
  if($("#r-show")) $("#r-show").onclick = () => { S.showStd = !S.showStd; render(); };
  if($("#r-cancel")) $("#r-cancel").onclick = () => { S.editRules = false; render(); };
  if($("#r-reset")) $("#r-reset").onclick = () => { if(!confirm("Put the default rules back to the original numbers? Each outlet's own settings are kept.")) return;
    S.editRules = false; const keep = RULES.pools || {}; RULES = mergeRules({pools: keep}); savePools(keep, true); };
  document.querySelectorAll("[data-pedit]").forEach(b => b.onclick = () => { S.editPool = b.dataset.pedit; render(); const f = $("#poolf"); if(f) f.scrollIntoView({block:"center"}); });
  if($("#p-cancel")) $("#p-cancel").onclick = () => { S.editPool = null; render(); };
  if($("#p-std")) $("#p-std").onclick = () => { const pool = S.editPool; if(!confirm("Remove " + pool + "'s schedule? It will only be switched by hand (the night-dosing lock still applies).")) return;
    const pools = Object.assign({}, RULES.pools || {}); delete pools[pool]; S.editPool = null; RULES = mergeRules(Object.assign({}, S.cfg.rules || {}, {pools})); savePools(pools); };
  if($("#poolf")) $("#poolf").onsubmit = e => { e.preventDefault(); const pool = S.editPool, c = {};
    const nt = Number($("#p-noTestHour").value); if(!isFinite(nt) || nt < 9 || nt > 14){ S.err = pool + " — no morning test by: use 9 to 14."; render(); return; }
    if(nt !== DEFAULT_RULES.noTestHour) c.noTestHour = nt;
    const v = id => $(id).value.trim(), w = [];
    for(const i of [0,1,2,3,4,5,6]) w[i] = $(`#w${i}-off`).checked ? {off:true} : Object.fromEntries([["below", v(`#w${i}-below`)], ["closeAt", v(`#w${i}-close`)], ["onFrom", v(`#w${i}-from`)], ["nightFrom", v(`#w${i}-nf`)], ["nightTo", v(`#w${i}-nt`)], ["mornFrom", v(`#w${i}-mf`)], ["mornTo", v(`#w${i}-mt`)]].filter(x => x[1] !== "").map(x => [x[0], Number(x[1])]));
    const wk = cleanWeek(w);
    if(!wk){ S.err = pool + " weekly schedule: each day needs 'ON if FC below' (0–5) and 'OFF at' (8–24), unless it is OFF all day."; render(); return; }
    c.week = wk; c.changedBy = S.user.email; c.changedAt = new Date().toISOString();
    const pools = Object.assign({}, RULES.pools || {}); pools[pool] = c;
    S.editPool = null; RULES = mergeRules(Object.assign({}, S.cfg.rules || {}, {pools})); savePools(pools); };
  if($("#rulef")) $("#rulef").onsubmit = e => { e.preventDefault();
    const out = {}; for(const f of RULE_NUMS){ const v = Number($("#r-" + f.k).value); if(!isFinite(v) || v < f.min || v > f.max){ S.err = f.l + ": use a number from " + f.min + " to " + f.max + "."; render(); return; } out[f.k] = v; }
    out.overnightPools = [...document.querySelectorAll("#rulef .chips input:checked")].map(x => x.value);
    out.changedBy = S.user.email; out.changedAt = new Date().toISOString();
    out.pools = RULES.pools || {};
    S.editRules = false; RULES = mergeRules(out); saveCfg({rules: out}); };
  $("#apif").onsubmit = e => { e.preventDefault(); const u = $("#api").value.trim();
    if(u && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){ S.err = "That doesn't look like an Apps Script web app address (…/exec)."; render(); return; }
    saveCfg({apiUrl:u}); };
}
async function loadLog(){
  try{
    let q = db.collection("plug_log").orderBy("at", "desc");
    if(S.logDays){ const from = new Date(Date.now() - S.logDays * 86400000).toISOString(); q = q.where("at", ">=", from).limit(1500); }   // `at` is an ISO string, so the range works as text
    else q = q.limit(20);
    const r = await q.get(); S.log = []; r.forEach(x => S.log.push(x.data()));
  }catch(e){}
}
/* Every minute while the page is open: re-read the config (1 small read). If the timer has switched a plug
 * since the page last asked the plugs, ask them again and reload the switch list. */
/* Live updates while the page is open:
 *  - the config doc is watched (onSnapshot): the timer writes it every run, so a switch it makes shows within seconds;
 *    when its per-plug record changes, the plugs, the switch list and the water tests are read again;
 *  - every minute the rule text follows the clock; every 3 minutes the water tests are re-read. */
function editing(){ const a = document.activeElement; return S.editRules || S.editPool || S.editId || (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && $("#app").contains(a)); }
function bgRender(){ if(!editing()) render(); }
/* The timer reads the sheet every run and leaves today's numbers in autoState.tests. When those are fresh the page
 * uses them (same numbers the timer acted on) and only reads the sheet itself for pools the timer isn't covering. */
function timerTests(){
  const a = S.cfg.autoState || {}, T = a.tests || {}, today = dayKey(sgNow()), fresh = a.lastRun && Date.now() - new Date(a.lastRun) < 20 * 60000;
  const covered = new Set();
  if(S.cfg.auto === true && fresh) Object.keys(T).forEach(pool => { const x = T[pool]; if(x && x.date === today){ S.fc[pool] = {morning:x.morning, afternoon:x.afternoon, night:x.night ?? null, src:"timer", at:x.at}; covered.add(pool); } });
  return covered;
}
function loadFcNeeded(){ const c = timerTests(); const need = (S.cfg.plugs || []).map(p => p.pool).filter(p => p && !c.has(p)); if(need.length) return loadFc(need); bgRender(); }
let autoSig = null, fcAt = 0;
function autoSigOf(){ const pl = (S.cfg.autoState || {}).plugs || {}; return JSON.stringify(Object.keys(pl).sort().map(k => [k, pl[k] && pl[k].at, pl[k] && pl[k].done, pl[k] && pl[k].err])); }
function watchCfg(){
  db.doc("dosing_config/plugs").onSnapshot(d => {
    if(!d.exists) return;
    S.cfg = Object.assign({plugs:[], apiUrl:""}, d.data()); RULES = mergeRules(S.cfg.rules);
    const sig = autoSigOf(), changed = autoSig !== null && sig !== autoSig; autoSig = sig;
    timerTests();
    if(changed && !document.hidden){ loadLog().then(bgRender); setTimeout(refreshStatus, 1200); loadFcNeeded(); fcAt = Date.now(); }
    bgRender();
  }, () => {});
}
function liveTick(){
  if(document.hidden || !S.user) return;
  if(Date.now() - fcAt > 3 * 60000){ fcAt = Date.now(); loadFcNeeded(); }
  bgRender();
}
async function savePools(pools, resetStandard){
  const cur = Object.assign({}, S.cfg.rules || {});
  const next = resetStandard ? {pools} : Object.assign(cur, {pools});
  S.cfg.rules = next; S.err = ""; render();
  try{ await db.doc("dosing_config/plugs").update({rules: next}); }catch(e){ S.err = "Couldn't save: " + e.message; render(); }
  refreshStatus(); loadFcNeeded();
}
async function saveCfg(patch){
  Object.keys(patch).forEach(k => { if(k === "rules" && !(patch.rules && (patch.rules.onBelow !== undefined || patch.rules.pools))) delete S.cfg.rules; else S.cfg[k] = patch[k]; }); S.err = ""; render();
  try{ await db.doc("dosing_config/plugs").set(patch, {merge:true}); }catch(e){ S.err = "Couldn't save: " + e.message; render(); }
  refreshStatus(); loadFcNeeded();
}
function loginView(msg){
  $("#app").innerHTML = `<div class="card login"><h1 style="font-size:24px">HF Pools <small>Smart plugs</small></h1>
    <form id="lf"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
    <button class="b main" style="width:100%;margin-top:16px">Sign in</button></form><div class="msg err">${esc(msg || "")}</div></div>`;
  $("#lf").onsubmit = async e => { e.preventDefault(); try{ await auth.signInWithEmailAndPassword($("#em").value.trim(), $("#pw").value); }catch(err){ loginView("Email or password is not right."); } };
}
auth.onAuthStateChanged(async u => {
  S.user = u; if(!u){ loginView(); return; }
  render();
  try{ const d = await db.doc("dosing_config/plugs").get(); if(d.exists) S.cfg = Object.assign({plugs:[], apiUrl:""}, d.data()); RULES = mergeRules(S.cfg.rules); }catch(e){}
  await loadLog();
  render(); refreshStatus(); loadFcNeeded(); fcAt = Date.now();
  autoSig = autoSigOf(); watchCfg();
  setInterval(liveTick, 60000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden && S.user){ refreshStatus(); loadLog().then(bgRender); fcAt = 0; liveTick(); } });
});
</script>
