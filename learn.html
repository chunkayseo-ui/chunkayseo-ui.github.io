<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HF Pools · Learn</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#EEF3F3;--surface:#fff;--surface-2:#F6F9F9;--line:#C7D6D6;--line-soft:#DCE6E6;--ink:#0A1417;--ink-2:#33474D;--ink-3:#5B7378;
--accent:#00676F;--accent-soft:#DCEEEE;--ok:#256B4C;--ok-soft:#DDEEE5;--warn:#8A590D;--warn-soft:#F6EAD4;--urgent:#B23A2E;--urgent-soft:#F8DEDA;--water:#2F7FB8;--water-soft:#D9ECF7}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.5 "IBM Plex Sans","Noto Sans Tamil",system-ui,sans-serif}
body.ta{font-family:"Noto Sans Tamil","IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font:700 26px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
h1 small{font-size:15px;color:var(--accent);margin-left:6px}
.me{margin-left:auto;font-size:13px;color:var(--ink-3)}
.me button,.btnlink{border:0;background:none;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.langs{display:flex;gap:6px;margin:0 0 14px}
.langs button{flex:1;padding:10px 6px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font:600 16px "IBM Plex Sans","Noto Sans Tamil",sans-serif;color:var(--ink-2);cursor:pointer}
.langs button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.hello{margin-bottom:12px}
.hello b{font-size:20px}
.progress{height:10px;background:var(--line-soft);border-radius:6px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--ok)}
.list{display:grid;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.lesson:hover{border-color:var(--accent)}
.lesson .ic{font-size:34px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--water-soft);border-radius:12px;flex:none}
.lesson .tt{font-weight:600;font-size:17px;line-height:1.3}
.lesson .sub{font-size:13.5px;color:var(--ink-3)}
.lesson .st{margin-left:auto;flex:none;font:700 13px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:6px 9px;border-radius:6px}
.st.pass{background:var(--ok-soft);color:var(--ok)}
.st.try{background:var(--warn-soft);color:var(--warn)}
.st.new{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.num{font:700 13px "Barlow Condensed",sans-serif;color:var(--ink-3);letter-spacing:.05em}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .back{font-size:15px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.done{background:var(--ok)}
.slide{text-align:center}
.pic{min-height:150px;display:flex;align-items:center;justify-content:center;font-size:84px;line-height:1;margin:6px 0 14px}
.pic svg{width:100%;max-width:440px;height:auto}
.say{font-size:20px;line-height:1.55;text-align:left;margin:0}
body.ta .say{font-size:18px}
.nav{display:flex;gap:10px;margin-top:18px}
.b{flex:1;padding:15px 10px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font:600 17px "IBM Plex Sans","Noto Sans Tamil",sans-serif;cursor:pointer}
.b.main{background:var(--accent);color:#fff}
.b:disabled{opacity:.4}
.listen{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:9px 14px;border-radius:30px;border:1px solid var(--line);background:var(--surface-2);font:600 15px "IBM Plex Sans","Noto Sans Tamil",sans-serif;color:var(--ink-2);cursor:pointer}
.listen.on{background:var(--water-soft);border-color:var(--water);color:var(--water)}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.q{font-size:21px;font-weight:600;line-height:1.4;margin:4px 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:15px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font:500 17px "IBM Plex Sans","Noto Sans Tamil",sans-serif;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ink-3)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--urgent);background:var(--urgent-soft)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:16px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--urgent-soft);color:var(--urgent)}
.result{text-align:center;padding:10px 0}
.result .big{font-size:80px;line-height:1}
.result .score{font:700 44px/1 "Barlow Condensed",sans-serif;margin:10px 0}
.login{max-width:380px;margin:10vh auto 0}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:16px "IBM Plex Sans";margin-top:4px}
.login label{display:block;font-size:14px;color:var(--ink-3);margin-top:12px}
.msg{font-size:14px;margin-top:10px;min-height:18px}
.msg.err{color:var(--urgent)}.msg.ok{color:var(--ok)}
.muted{color:var(--ink-3)}
.team{margin-top:18px}
.team h2{font:700 16px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:0 0 10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line-soft);text-align:center;white-space:nowrap}
th{font:600 12px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
td:first-child,th:first-child{text-align:left;font-weight:600}
td .p{color:var(--ok);font-weight:700}
td .f{color:var(--warn);font-weight:600}
td .n{color:var(--line)}
</style></head><body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* HF Pools Learn -- lesson content. Three languages: en (simple English), ms (Bahasa Melayu), ta (Tamil).
 * Keep sentences short. Numbers stay as digits in every language.
 * pic: an emoji, or "svg:<name>" for a drawing from PICS. */
const LESSONS = [
/* ---------------- 1. Chlorine ---------------- */
{ id:"chlorine", icon:"🦠", mins:4,
  title:{en:"Chlorine kills germs", ms:"Klorin membunuh kuman", ta:"குளோரின் கிருமிகளை அழிக்கிறது"},
  cards:[
  {pic:"🏊", t:{
    en:"Swimmers bring germs into the pool: sweat, pee, poop, skin and dirt. Some germs make people sick — stomach pain, diarrhoea, eye and ear infections.",
    ms:"Perenang membawa kuman ke dalam kolam: peluh, air kencing, najis, kulit dan kotoran. Sesetengah kuman membuat orang sakit — sakit perut, cirit-birit, jangkitan mata dan telinga.",
    ta:"நீச்சல் அடிப்பவர்கள் குளத்திற்குள் கிருமிகளைக் கொண்டு வருகிறார்கள்: வியர்வை, சிறுநீர், மலம், தோல், அழுக்கு. சில கிருமிகள் நோயை உண்டாக்கும் — வயிற்று வலி, வயிற்றுப்போக்கு, கண் மற்றும் காது தொற்று."}},
  {pic:"svg:germ", t:{
    en:"Chlorine breaks the germ's outer wall. The germ dies. Most bacteria die in less than 1 minute.",
    ms:"Klorin memecahkan dinding luar kuman. Kuman mati. Kebanyakan bakteria mati dalam masa kurang daripada 1 minit.",
    ta:"குளோரின் கிருமியின் வெளிச் சுவரை உடைக்கிறது. கிருமி இறக்கிறது. பெரும்பாலான பாக்டீரியாக்கள் 1 நிமிடத்திற்குள் இறக்கின்றன."}},
  {pic:"📉", t:{
    en:"Free chlorine (FC) = chlorine still ready to fight. Every germ, every swimmer and the sun use it up. So FC goes down during the day.",
    ms:"Klorin bebas (FC) = klorin yang masih sedia untuk melawan. Setiap kuman, setiap perenang dan matahari menghabiskannya. Jadi FC turun sepanjang hari.",
    ta:"கட்டற்ற குளோரின் (Free Chlorine – FC) = இன்னும் போராடத் தயாராக இருக்கும் குளோரின். ஒவ்வொரு கிருமியும், ஒவ்வொரு நீச்சல்காரரும், சூரியனும் அதைச் செலவழிக்கின்றன. அதனால் பகலில் FC குறைகிறது."}},
  {pic:"🌙", t:{
    en:"That is why we dose every night. The pump mixes the chlorine overnight, so the pool is strong in the morning. Target next morning: FC 2.5 – 3.5 ppm.",
    ms:"Sebab itu kita masukkan klorin setiap malam. Pam mencampurkan klorin sepanjang malam, jadi klorin dalam kolam cukup kuat pada waktu pagi. Sasaran pagi esok: FC 2.5 – 3.5 ppm.",
    ta:"அதனால்தான் ஒவ்வொரு இரவும் டோஸ் செய்கிறோம். இரவு முழுவதும் பம்ப் குளோரினைக் கலக்கிறது, காலையில் குளம் வலுவாக இருக்கும். மறுநாள் காலை இலக்கு: FC 2.5 – 3.5 ppm."}},
  {pic:"🪣", t:{
    en:"Our chlorine is a powder (calcium hypochlorite). Weigh it. Put WATER in the bucket first, then add the powder. Stir well until most of it dissolves. Pour it around the pool as the route shows.",
    ms:"Klorin kita ialah serbuk (kalsium hipoklorit). Timbang dahulu. Masukkan AIR ke dalam baldi dahulu, kemudian serbuk. Kacau sehingga kebanyakannya larut. Tuang di sekeliling kolam mengikut laluan.",
    ta:"நம் குளோரின் ஒரு பொடி (கால்சியம் ஹைப்போகுளோரைட்). முதலில் எடை போடுங்கள். வாளியில் முதலில் தண்ணீர் ஊற்றுங்கள், பிறகு பொடியைப் போடுங்கள். பெரும்பாலானது கரையும் வரை நன்றாகக் கலக்குங்கள். வழிப்படத்தில் காட்டியபடி குளத்தைச் சுற்றி ஊற்றுங்கள்."}},
  {pic:"⚠️", t:{
    en:"FC 0 = no protection. Germs grow and the water turns cloudy, then green. If the morning FC is 1 or below, tell the supervisor.",
    ms:"FC 0 = tiada perlindungan. Kuman membiak dan air menjadi keruh, kemudian hijau. Jika FC pagi 1 atau kurang, beritahu penyelia.",
    ta:"FC 0 = பாதுகாப்பு இல்லை. கிருமிகள் பெருகும், தண்ணீர் கலங்கலாகி, பின் பச்சையாகும். காலை FC 1 அல்லது அதற்குக் குறைவாக இருந்தால், மேற்பார்வையாளரிடம் சொல்லுங்கள்."}},
  ],
  quiz:[
  {q:{en:"What does chlorine do?", ms:"Apa fungsi klorin?", ta:"குளோரின் என்ன செய்கிறது?"},
   o:[{en:"Kills germs", ms:"Membunuh kuman", ta:"கிருமிகளை அழிக்கிறது"},
      {en:"Makes the water warm", ms:"Memanaskan air", ta:"தண்ணீரைச் சூடாக்குகிறது"},
      {en:"Makes the water blue", ms:"Membirukan air", ta:"தண்ணீரை நீலமாக்குகிறது"}], a:0},
  {q:{en:"Why does FC go down during the day?", ms:"Kenapa FC turun sepanjang hari?", ta:"பகலில் FC ஏன் குறைகிறது?"},
   o:[{en:"The pump eats it", ms:"Pam memakannya", ta:"பம்ப் அதைச் சாப்பிடுகிறது"},
      {en:"Swimmers, germs and the sun use it up", ms:"Perenang, kuman dan matahari menghabiskannya", ta:"நீச்சல்காரர்கள், கிருமிகள், சூரியன் அதைச் செலவழிக்கின்றன"},
      {en:"It sinks to the floor", ms:"Ia tenggelam ke lantai", ta:"அது தரையில் மூழ்குகிறது"}], a:1},
  {q:{en:"What FC do we want the next morning?", ms:"FC berapa yang kita mahu pagi esok?", ta:"மறுநாள் காலை எவ்வளவு FC வேண்டும்?"},
   o:[{en:"0 – 1 ppm", ms:"0 – 1 ppm", ta:"0 – 1 ppm"},
      {en:"2.5 – 3.5 ppm", ms:"2.5 – 3.5 ppm", ta:"2.5 – 3.5 ppm"},
      {en:"8 – 10 ppm", ms:"8 – 10 ppm", ta:"8 – 10 ppm"}], a:1},
  {q:{en:"Mixing chlorine powder in the bucket — what goes in first?", ms:"Bancuh serbuk klorin dalam baldi — apa dimasukkan dahulu?", ta:"வாளியில் குளோரின் பொடி கலக்கும்போது — முதலில் எது?"},
   o:[{en:"Water first, then powder", ms:"Air dahulu, kemudian serbuk", ta:"முதலில் தண்ணீர், பிறகு பொடி"},
      {en:"Powder first, then water", ms:"Serbuk dahulu, kemudian air", ta:"முதலில் பொடி, பிறகு தண்ணீர்"}], a:0},
  ]},

/* ---------------- 2. pH & acid ---------------- */
{ id:"ph", icon:"🧪", mins:4,
  title:{en:"pH and acid", ms:"pH dan asid", ta:"pH மற்றும் அமிலம்"},
  cards:[
  {pic:"svg:phscale", t:{
    en:"pH tells us if water is acid or not. The scale is 0 to 14. 7 is the middle. Our pools: pH 7.2 – 7.6. (NEA allows 7.2 – 7.8.)",
    ms:"pH memberitahu sama ada air berasid atau tidak. Skala 0 hingga 14. 7 ialah tengah. Kolam kita: pH 7.2 – 7.6. (NEA benarkan 7.2 – 7.8.)",
    ta:"தண்ணீர் அமிலமா இல்லையா என்பதை pH சொல்கிறது. அளவு 0 முதல் 14 வரை. 7 நடுவில். நம் குளங்கள்: pH 7.2 – 7.6. (NEA 7.2 – 7.8 வரை அனுமதிக்கிறது.)"}},
  {pic:"svg:strength", t:{
    en:"pH changes how strong chlorine is. pH 7.0: about 3 of 4 parts are strong. pH 7.5: about half. pH 8.0: only 1 of 5. High pH = weak chlorine, even when the FC number looks OK.",
    ms:"pH mengubah kekuatan klorin. pH 7.0: kira-kira 3 daripada 4 bahagian kuat. pH 7.5: kira-kira separuh. pH 8.0: hanya 1 daripada 5. pH tinggi = klorin lemah, walaupun nombor FC nampak OK.",
    ta:"pH குளோரினின் வலிமையை மாற்றுகிறது. pH 7.0: சுமார் 4-இல் 3 பங்கு வலுவானது. pH 7.5: சுமார் பாதி. pH 8.0: 5-இல் 1 பங்கு மட்டுமே. அதிக pH = பலவீனமான குளோரின், FC எண் சரியாகத் தெரிந்தாலும் கூட."}},
  {pic:"😣", t:{
    en:"pH too low (below 7.2): eyes sting, skin itches, and metal ladders and pump parts rust.",
    ms:"pH terlalu rendah (bawah 7.2): mata pedih, kulit gatal, tangga logam dan bahagian pam berkarat.",
    ta:"pH மிகக் குறைவு (7.2-க்குக் கீழ்): கண் எரியும், தோல் அரிக்கும், உலோக ஏணிகளும் பம்ப் பாகங்களும் துருப்பிடிக்கும்."}},
  {pic:"📈", t:{
    en:"In our pools pH usually goes UP. Chlorine powder and the salt chlorinator both push it up. So we add acid to bring it down.",
    ms:"Di kolam kita pH biasanya NAIK. Serbuk klorin dan klorinator garam kedua-duanya menaikkannya. Jadi kita tambah asid untuk menurunkannya.",
    ta:"நம் குளங்களில் pH பொதுவாக உயரும். குளோரின் பொடியும் உப்பு குளோரினேட்டரும் அதை உயர்த்துகின்றன. அதனால் அதைக் குறைக்க அமிலம் சேர்க்கிறோம்."}},
  {pic:"🧴", t:{
    en:"Acid: follow the dosing table for your pH reading. Pour slowly in front of the return jets, away from swimmers. Chlorine and acid: different places, never at the same time, never in the same bucket.",
    ms:"Asid: ikut jadual dos mengikut bacaan pH anda. Tuang perlahan di hadapan jet pulangan, jauh dari perenang. Klorin dan asid: tempat berbeza, jangan pada masa yang sama, jangan dalam baldi yang sama.",
    ta:"அமிலம்: உங்கள் pH அளவுக்கான டோசிங் அட்டவணையைப் பின்பற்றுங்கள். திரும்பும் ஜெட் முன் மெதுவாக ஊற்றுங்கள், நீச்சல்காரர்களிடமிருந்து தள்ளி. குளோரினும் அமிலமும்: வெவ்வேறு இடங்களில், ஒரே நேரத்தில் இல்லை, ஒரே வாளியில் இல்லை."}},
  ],
  quiz:[
  {q:{en:"What pH do we want in our pools?", ms:"pH berapa yang kita mahu di kolam?", ta:"நம் குளங்களில் எவ்வளவு pH வேண்டும்?"},
   o:[{en:"6.0 – 6.5", ms:"6.0 – 6.5", ta:"6.0 – 6.5"},{en:"7.2 – 7.6", ms:"7.2 – 7.6", ta:"7.2 – 7.6"},{en:"8.5 – 9.0", ms:"8.5 – 9.0", ta:"8.5 – 9.0"}], a:1},
  {q:{en:"pH is 8.0. What happens to the chlorine?", ms:"pH ialah 8.0. Apa jadi pada klorin?", ta:"pH 8.0. குளோரினுக்கு என்ன ஆகும்?"},

      {en:"Water turns warm", ms:"Air menjadi panas", ta:"தண்ணீர் சூடாகும்"},

/* ---------------- 3. Bicarb ---------------- */
{ id:"bicarb", icon:"🛡️", mins:3,
  title:{en:"Bicarb keeps pH steady", ms:"Bikarbonat menstabilkan pH", ta:"பைகார்ப் pH-ஐ நிலையாக வைக்கிறது"},
  cards:[
  {pic:"🛡️", t:{
    en:"Alkalinity is like a shock absorber for pH. It stops the pH from jumping up and down.",
    ms:"Kealkalian seperti penyerap hentakan untuk pH. Ia menghalang pH daripada naik turun dengan cepat.",
    ta:"காரத்தன்மை (அல்கலினிட்டி) pH-க்கு ஒரு அதிர்ச்சி தாங்கி (ஷாக் அப்சார்பர்) போன்றது. pH மேலும் கீழும் குதிப்பதைத் தடுக்கிறது."}},
  {pic:"🎢", t:{
    en:"Low alkalinity: pH swings every day — high one day, very low after acid. Hard to control, and because pH keeps changing, the chlorine does not work well.",
    ms:"Kealkalian rendah: pH berubah-ubah setiap hari — tinggi satu hari, sangat rendah selepas asid. Susah dikawal, dan kerana pH sentiasa berubah, klorin tidak berfungsi dengan baik.",
    ta:"குறைந்த காரத்தன்மை: pH தினமும் மாறும் — ஒரு நாள் அதிகம், அமிலம் போட்ட பின் மிகக் குறைவு. கட்டுப்படுத்துவது கடினம், pH மாறிக்கொண்டே இருப்பதால் குளோரினும் நன்றாக வேலை செய்யாது."}},
  {pic:"🥄", t:{
    en:"Bicarb (sodium bicarbonate — like baking soda) raises alkalinity. It also pushes pH up a little.",
    ms:"Bikarbonat (natrium bikarbonat — seperti soda penaik) menaikkan kealkalian. Ia juga menaikkan pH sedikit.",
    ta:"பைகார்ப் (சோடியம் பைகார்பனேட் — சமையல் சோடா போல) காரத்தன்மையை உயர்த்துகிறது. pH-ஐயும் கொஞ்சம் உயர்த்துகிறது."}},
  {pic:"🌊", t:{
    en:"Add bicarb only when the table or the supervisor says. Measure with the scoop. Spread it wide across the pool while the pump runs.",
    ms:"Tambah bikarbonat hanya apabila jadual atau penyelia suruh. Sukat dengan sudu penyukat. Tabur luas ke seluruh kolam semasa pam berjalan.",
    ta:"அட்டவணை அல்லது மேற்பார்வையாளர் சொன்னால் மட்டுமே பைகார்ப் சேர்க்கவும். ஸ்கூப்பால் அளக்கவும். பம்ப் ஓடும்போது குளம் முழுவதும் பரவலாகத் தூவுங்கள்."}},
  {pic:"⏱️", t:{
    en:"Do not add acid and bicarb at the same time — they cancel each other. Keep them a few hours apart.",
    ms:"Jangan tambah asid dan bikarbonat pada masa yang sama — ia membatalkan satu sama lain. Jarakkan beberapa jam.",
    ta:"அமிலமும் பைகார்பும் ஒரே நேரத்தில் சேர்க்க வேண்டாம் — ஒன்றையொன்று ரத்து செய்யும். சில மணி நேர இடைவெளி வையுங்கள்."}},
  ],
  quiz:[
  {q:{en:"What does alkalinity do?", ms:"Apa fungsi kealkalian?", ta:"காரத்தன்மை என்ன செய்கிறது?"},
   o:[{en:"Keeps pH steady", ms:"Menstabilkan pH", ta:"pH-ஐ நிலையாக வைக்கிறது"},{en:"Kills germs", ms:"Membunuh kuman", ta:"கிருமிகளை அழிக்கிறது"},{en:"Cleans the floor", ms:"Membersihkan lantai", ta:"தரையைச் சுத்தம் செய்கிறது"}], a:0},
  {q:{en:"Bicarb raises…", ms:"Bikarbonat menaikkan…", ta:"பைகார்ப் உயர்த்துவது…"},
   o:[{en:"Chlorine", ms:"Klorin", ta:"குளோரின்"},{en:"Alkalinity", ms:"Kealkalian", ta:"காரத்தன்மை"},{en:"Water level", ms:"Paras air", ta:"நீர் மட்டம்"}], a:1},
  {q:{en:"How do we add bicarb?", ms:"Bagaimana tambah bikarbonat?", ta:"பைகார்ப் எப்படிச் சேர்ப்பது?"},
   o:[{en:"Spread wide, pump running", ms:"Tabur luas, pam berjalan", ta:"பரவலாகத் தூவுதல், பம்ப் ஓடும்போது"},
      {en:"All in one corner, pump off", ms:"Semua di satu sudut, pam tutup", ta:"ஒரே மூலையில், பம்ப் நிறுத்தி"},
      {en:"Mixed with chlorine powder", ms:"Campur dengan serbuk klorin", ta:"குளோரின் பொடியுடன் கலந்து"}], a:0},
  {q:{en:"Acid and bicarb together at the same time?", ms:"Asid dan bikarbonat pada masa yang sama?", ta:"அமிலமும் பைகார்பும் ஒரே நேரத்திலா?"},
   o:[{en:"Yes, it saves time", ms:"Ya, jimat masa", ta:"ஆம், நேரம் மிச்சம்"},{en:"No — a few hours apart", ms:"Tidak — jarak beberapa jam", ta:"இல்லை — சில மணி நேர இடைவெளி"}], a:1},
  ]},

/* ---------------- 4. Water test ---------------- */
{ id:"test", icon:"🔬", mins:4,
  title:{en:"Doing the FC test right", ms:"Ujian FC yang betul", ta:"FC சோதனையைச் சரியாகச் செய்வது"},
  cards:[
  {pic:"🎯", t:{
    en:"A wrong test = a wrong dose. Test the same way every time.",
    ms:"Ujian salah = dos salah. Uji dengan cara yang sama setiap kali.",
    ta:"தவறான சோதனை = தவறான டோஸ். ஒவ்வொரு முறையும் ஒரே மாதிரி சோதியுங்கள்."}},
  {pic:"💪", t:{
    en:"Take the water from elbow deep (30 – 40 cm under the surface), away from the return jets and the skimmer.",
    ms:"Ambil air sedalam siku (30 – 40 cm bawah permukaan), jauh dari jet pulangan dan skimmer.",
    ta:"முழங்கை ஆழத்திலிருந்து (மேற்பரப்புக்குக் கீழ் 30 – 40 cm) தண்ணீர் எடுங்கள், திரும்பும் ஜெட் மற்றும் ஸ்கிம்மரிலிருந்து தள்ளி."}},
  {pic:"svg:tube", t:{
    en:"Stand the tube on the counter — don't hold it in your hand. Fill to the 10 mL line. Add 2 scoops of R-0870 powder. Swirl until pink. Start the R-0871 drops straight away. No pink at all = FC 0 — tell the supervisor.",
    ms:"Letak tiub tegak di atas kaunter — jangan pegang di tangan. Isi hingga garisan 10 mL. Masukkan 2 sudu penyukat serbuk R-0870. Pusingkan tiub perlahan-lahan sehingga merah jambu. Terus mula titiskan R-0871. Tiada warna merah jambu langsung = FC 0 — beritahu penyelia.",
    ta:"சோதனைக் குழாயைக் கவுண்டரில் நேராக நிறுத்துங்கள் — கையில் பிடிக்க வேண்டாம். 10 mL கோடு வரை நிரப்புங்கள். R-0870 பொடி 2 ஸ்கூப் போடுங்கள். இளஞ்சிவப்பாகும் வரை சுழற்றுங்கள். உடனே R-0871 சொட்டுகளைத் தொடங்குங்கள். இளஞ்சிவப்பே வரவில்லை = FC 0 — மேற்பார்வையாளரிடம் சொல்லுங்கள்."}},
  {pic:"svg:bottle", t:{
    en:"Hold the R-0871 bottle straight down (90°). A tilted bottle makes small drops — more drops — a wrong, high reading.",
    ms:"Pegang botol R-0871 tegak ke bawah (90°). Botol senget buat titisan kecil — lebih banyak titisan — bacaan salah dan tinggi.",
    ta:"R-0871 பாட்டிலை நேராகக் கீழ்நோக்கிப் (90°) பிடியுங்கள். சாய்த்தால் சொட்டுகள் சிறியதாகும் — அதிக சொட்டுகள் தேவைப்படும் — தவறான, அதிக அளவு காட்டும்."}},
  {pic:"🚫☝️", t:{
    en:"Never cover the tube with your finger. Use the cap.",
    ms:"Jangan tutup tiub dengan jari. Guna penutup.",
    ta:"சோதனைக் குழாயை விரலால் மூட வேண்டாம். மூடியைப் பயன்படுத்துங்கள்."}},
  {pic:"✖️", t:{
    en:"Add 1 drop at a time and swirl after each drop. Count until the pink is gone. FC = drops × 0.5. Example: 6 drops = 3 ppm. Never × 1.",
    ms:"Titiskan 1 titis setiap kali dan pusingkan tiub selepas setiap titis. Kira sehingga warna merah jambu hilang. FC = titisan × 0.5. Contoh: 6 titis = 3 ppm. Jangan × 1.",
    ta:"ஒரு நேரத்தில் 1 சொட்டு விட்டு, ஒவ்வொரு சொட்டுக்கும் பின் சுழற்றுங்கள். இளஞ்சிவப்பு மறையும் வரை எண்ணுங்கள். FC = சொட்டுகள் × 0.5. உதாரணம்: 6 சொட்டு = 3 ppm. ஒருபோதும் × 1 செய்ய வேண்டாம்."}},
  {pic:"📲", t:{
    en:"First job at every outlet: water test and night report. Send the report first, then dose.",
    ms:"Kerja pertama di setiap cawangan: ujian air dan laporan malam. Hantar laporan dahulu, kemudian dos.",
    ta:"ஒவ்வொரு கிளையிலும் முதல் வேலை: நீர் சோதனை மற்றும் இரவு அறிக்கை. முதலில் அறிக்கை அனுப்புங்கள், பிறகு டோஸ்."}},
  ],
  quiz:[
  {q:{en:"10 drops of R-0871. What is the FC?", ms:"10 titis R-0871. Berapa FC?", ta:"R-0871 10 சொட்டுகள். FC எவ்வளவு?"},
   o:[{en:"5 ppm", ms:"5 ppm", ta:"5 ppm"},{en:"10 ppm", ms:"10 ppm", ta:"10 ppm"},{en:"20 ppm", ms:"20 ppm", ta:"20 ppm"}], a:0},
  {q:{en:"How do you hold the R-0871 bottle?", ms:"Bagaimana pegang botol R-0871?", ta:"R-0871 பாட்டிலை எப்படிப் பிடிப்பது?"},
   o:[{en:"Tilted a little", ms:"Senget sedikit", ta:"கொஞ்சம் சாய்த்து"},{en:"Straight down", ms:"Tegak ke bawah", ta:"நேராகக் கீழ்நோக்கி"}], a:1},
  {q:{en:"The sample turned pink. What now?", ms:"Sampel sudah merah jambu. Apa seterusnya?", ta:"மாதிரி இளஞ்சிவப்பானது. இப்போது?"},
   o:[{en:"Start the drops straight away", ms:"Terus mula titis", ta:"உடனே சொட்டுகளைத் தொடங்கு"},{en:"Wait 5 minutes", ms:"Tunggu 5 minit", ta:"5 நிமிடம் காத்திரு"}], a:0},
  {q:{en:"What do you cover the tube with?", ms:"Tiub ditutup dengan apa?", ta:"சோதனைக் குழாயை எதனால் மூடுவது?"},
   o:[{en:"My finger", ms:"Jari saya", ta:"என் விரல்"},{en:"The cap", ms:"Penutup", ta:"மூடி"}], a:1},
  {q:{en:"First job when you reach an outlet at night?", ms:"Kerja pertama bila sampai di cawangan waktu malam?", ta:"இரவில் கிளைக்குச் சென்றதும் முதல் வேலை?"},
   o:[{en:"Dose chlorine", ms:"Dos klorin", ta:"குளோரின் டோஸ்"},{en:"Water test and night report", ms:"Ujian air dan laporan malam", ta:"நீர் சோதனை மற்றும் இரவு அறிக்கை"}], a:1},
  ]},

/* ---------------- 5. Chemical safety ---------------- */
{ id:"safety", icon:"🧤", mins:3,
  title:{en:"Chemical safety", ms:"Keselamatan bahan kimia", ta:"ரசாயனப் பாதுகாப்பு"},
  cards:[
  {pic:"svg:nomix", t:{
    en:"Chlorine + acid = poison gas. It can burn your lungs and can kill. NEVER mix them, not even a little.",
    ms:"Klorin + asid = gas beracun. Ia boleh merosakkan paru-paru dan boleh membunuh. JANGAN campur, walaupun sedikit.",
    ta:"குளோரின் + அமிலம் = விஷ வாயு. நுரையீரலை எரிக்கும், உயிரிழப்பு ஏற்படலாம். ஒருபோதும் கலக்க வேண்டாம், கொஞ்சம் கூட."}},
  {pic:"🪣🪣", t:{
    en:"Each chemical has its own bucket and scoop. Keep them labelled. Never put a wet or dirty scoop into the chlorine drum — it can start a fire or gas.",
    ms:"Setiap bahan kimia ada baldi dan sudu penyukat sendiri. Labelkan. Jangan masukkan sudu penyukat basah atau kotor ke dalam dram klorin — boleh menyebabkan api atau gas.",
    ta:"ஒவ்வொரு ரசாயனத்துக்கும் தனி வாளியும் ஸ்கூப்பும். லேபிள் ஒட்டுங்கள். ஈரமான அல்லது அழுக்கான ஸ்கூப்பைக் குளோரின் டிரம்மில் போட வேண்டாம் — தீ அல்லது வாயு உண்டாகலாம்."}},
  {pic:"💧➡️🧂", t:{
    en:"Always water first, then chemical. Never pour water onto chemical powder or into acid.",
    ms:"Sentiasa air dahulu, kemudian bahan kimia. Jangan tuang air ke atas serbuk kimia atau ke dalam asid.",
    ta:"எப்போதும் முதலில் தண்ணீர், பிறகு ரசாயனம். ரசாயனப் பொடி மீதோ அமிலத்துக்குள்ளோ தண்ணீர் ஊற்ற வேண்டாம்."}},
  {pic:"🧤🥽", t:{
    en:"Wear gloves and safety glasses. Keep your face away. Don't breathe the dust.",
    ms:"Pakai sarung tangan dan cermin mata keselamatan. Jauhkan muka. Jangan sedut habuk.",
    ta:"கையுறையும் பாதுகாப்புக் கண்ணாடியும் அணியுங்கள். முகத்தைத் தள்ளி வையுங்கள். தூசியை சுவாசிக்க வேண்டாம்."}},
  {pic:"📦", t:{
    en:"Storage: lid closed, dry, cool, out of the sun, off the floor. Chlorine and acid kept apart — never acid above chlorine.",
    ms:"Simpanan: penutup rapat, kering, sejuk, tidak kena matahari, tidak di atas lantai. Klorin dan asid diasingkan — jangan letak asid di atas klorin.",
    ta:"சேமிப்பு: மூடி மூடியிருக்க வேண்டும், உலர்வாக, குளிர்ச்சியாக, வெயில் படாமல், தரையிலிருந்து மேலே. குளோரினும் அமிலமும் தனித்தனியாக — குளோரினுக்கு மேல் அமிலத்தை வைக்க வேண்டாம்."}},
  {pic:"🚿", t:{
    en:"Splash on skin or in eyes: wash with lots of running water for 15 minutes; for eyes, see a doctor after. Smell of gas: walk away to fresh air, keep people away, call the supervisor. Serious: call 995.",
    ms:"Terpercik ke kulit atau mata: basuh dengan banyak air mengalir selama 15 minit; untuk mata, jumpa doktor selepas itu. Bau gas: pergi ke udara segar, jauhkan orang, hubungi penyelia. Serius: telefon 995.",

{ id:"scrub", icon:"🧽", mins:3,

  cards:[

    ta:"கிருமிகளும் பாசியும் சுவர், தரை, படிகளில் மெல்லிய வழுவழுப்பான அடுக்கை உருவாக்குகின்றன. அந்த அடுக்கிற்குள் குளோரின் எளிதில் நுழைய முடியாது."}},
  {pic:"🧽", t:{
    en:"Scrubbing breaks the slime so the chlorine can kill what is inside. It also stops algae before you can see it.",

  {pic:"📅", t:{
    en:"Why every week? Slime and algae come back in a few days. Each pool's weekly maintenance day keeps it clean before the busy weekend.",
    ms:"Kenapa setiap minggu? Lendir dan alga kembali dalam beberapa hari. Hari penyelenggaraan mingguan setiap kolam memastikan ia bersih sebelum hujung minggu yang sibuk.",
    ta:"ஏன் ஒவ்வொரு வாரமும்? வழுவழுப்பும் பாசியும் சில நாட்களில் திரும்ப வரும். ஒவ்வொரு குளத்தின் வாராந்திரப் பராமரிப்பு நாள், பரபரப்பான வார இறுதிக்கு முன் அதைச் சுத்தமாக வைக்கிறது."}},
  {pic:"🔍", t:{
    en:"Scrub hardest where the water doesn't move much: the waterline, corners, steps, behind ladders, around lights and return jets.",
    ms:"Sental kuat di tempat air kurang bergerak: garisan air, sudut, tangga, belakang tangga besi, sekeliling lampu dan jet pulangan.",
    ta:"தண்ணீர் அதிகம் நகராத இடங்களில் நன்றாகத் தேயுங்கள்: நீர் மட்டக் கோடு, மூலைகள், படிகள், ஏணிகளுக்குப் பின்னால், விளக்குகள் மற்றும் திரும்பும் ஜெட்டுகளைச் சுற்றி."}},
  {pic:"➡️", t:{
    en:"Brush in one direction, towards where you will vacuum. Overlap each stroke. Don't skip corners. Then let the dirt settle and vacuum after.",
    ms:"Berus ke satu arah, ke arah tempat anda akan vakum. Tindihkan setiap sapuan sedikit. Jangan tinggalkan sudut. Biarkan kotoran mendap, kemudian vakum.",
    ta:"ஒரே திசையில், நீங்கள் வாக்யூம் செய்யும் பக்கம் நோக்கித் தேயுங்கள். ஒவ்வொரு தேய்ப்பும் முந்தையதின் மேல் கொஞ்சம் படும்படி தேயுங்கள். மூலைகளை விட வேண்டாம். அழுக்கு அடியில் படிய விட்டு, பிறகு வாக்யூம் செய்யுங்கள்."}},

/* ---------------- 7. Manual vacuum ---------------- */
{ id:"vacuum", icon:"🧹", mins:5,
  title:{en:"Manual vacuum", ms:"Vakum manual", ta:"கைமுறை வாக்யூம்"},
  cards:[
  {pic:"🍂", t:{
    en:"Dirt on the floor feeds algae, uses up chlorine, and customers see it. The vacuum pulls it out through the filter.",
    ms:"Kotoran di lantai menjadi makanan alga, menghabiskan klorin, dan pelanggan nampak. Vakum menariknya keluar melalui penapis.",
    ta:"தரையில் உள்ள அழுக்கு பாசிக்கு உணவாகிறது, குளோரினைச் செலவழிக்கிறது, வாடிக்கையாளர்களும் பார்க்கிறார்கள். வாக்யூம் அதை வடிகட்டி வழியாக வெளியே இழுக்கிறது."}},
  {pic:"svg:vacsetup", t:{
    en:"Before you start: open the vacuum port, open the vacuum valve, set the skimmer control valve as your route card shows — usually half open (more suction at the vacuum port). Take a photo of each.",
    ms:"Sebelum mula: buka port vakum, buka injap vakum, laraskan injap kawalan skimmer seperti dalam kad laluan — biasanya separuh terbuka (sedutan lebih kuat di port vakum). Ambil gambar setiap satu.",
    ta:"தொடங்கும் முன்: வாக்யூம் போர்ட்டைத் திறங்கள், வாக்யூம் வால்வைத் திறங்கள், ஸ்கிம்மர் கட்டுப்பாட்டு வால்வை வழி அட்டையில் காட்டியபடி வையுங்கள் — பொதுவாகப் பாதி திறந்து (வாக்யூம் போர்ட்டில் அதிக உறிஞ்சும் சக்தி). ஒவ்வொன்றுக்கும் புகைப்படம் எடுங்கள்."}},
  {pic:"〰️💧", t:{
    en:"Fill the hose with water first — push it slowly into the pool until no more bubbles come out. Air in the hose = the pump loses suction.",

  {pic:"🫧", t:{
    en:"Look at the pump lid: full of water, no bubbles. Bubbles = air is getting in. Check the hose. At HB, open the balancing tank valve a bit more.",
    ms:"Lihat penutup pam: penuh air, tiada gelembung. Gelembung = udara masuk. Periksa hos. Di HB, buka injap tangki pengimbang sedikit lagi.",
    ta:"பம்ப் மூடியைப் பாருங்கள்: தண்ணீர் நிரம்பி, குமிழ்கள் இல்லாமல். குமிழ்கள் = காற்று உள்ளே வருகிறது. ஹோஸைச் சரிபாருங்கள். HB-இல், பேலன்சிங் டேங்க் வால்வைக் கொஞ்சம் அதிகம் திறங்கள்."}},
  {pic:"🐢", t:{
    en:"Vacuum slowly in straight lines, each line a little over the last. Too fast = dirt clouds up and settles again. Follow the route card and take the photo at each point.",
    ms:"Vakum perlahan dalam garisan lurus, setiap garisan bertindih sedikit. Terlalu laju = kotoran naik dan mendap semula. Ikut kad laluan dan ambil gambar di setiap titik.",
    ta:"மெதுவாக, நேர்க்கோட்டில், ஒவ்வொரு கோடும் முந்தையதின் மேல் கொஞ்சம் பட வாக்யூம் செய்யுங்கள். வேகமாகச் செய்தால் அழுக்கு மேலே கிளம்பி மீண்டும் படியும். வழி அட்டையைப் பின்பற்றி ஒவ்வொரு இடத்திலும் புகைப்படம் எடுங்கள்."}},
  {pic:"✅", t:{
    en:"After: tools kept · skimmer control valve fully open · vacuum valve closed · vacuum port closed. If you forget the skimmer valve, the pool circulates badly all night.",
    ms:"Selepas: alatan disimpan · injap kawalan skimmer dibuka penuh · injap vakum ditutup · port vakum ditutup. Jika terlupa injap skimmer, peredaran kolam lemah sepanjang malam.",
    ta:"முடிந்ததும்: கருவிகள் வைக்கப்பட்டன · ஸ்கிம்மர் கட்டுப்பாட்டு வால்வு முழுதாகத் திறந்தது · வாக்யூம் வால்வு மூடியது · வாக்யூம் போர்ட் மூடியது. ஸ்கிம்மர் வால்வை மறந்தால், இரவு முழுவதும் குளத்தின் நீரோட்டம் மோசமாக இருக்கும்."}},
  {pic:"🚨", t:{

    ta:"குளத்தில் மலம் அல்லது வாந்தி: குளத்தை மூடுங்கள், வலை அல்லது வாளியால் அதை வெளியே எடுங்கள் (வாக்யூம் செய்ய வேண்டாம்), உடனே மேற்பார்வையாளரை அழையுங்கள். சிறப்புக் குளோரின் சிகிச்சை தேவை (NEA: குறைந்தது 8 மணி நேரம் 20 ppm)."}},

/* ---------------- read aloud ---------------- */
let speaking = false;
function voiceFor(lang){
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  return vs.find(v => v.lang && v.lang.toLowerCase().startsWith(lang)) || null;
}
function speak(text){
  if(!window.speechSynthesis) return false;
  speechSynthesis.cancel();
  const v = voiceFor(S.lang);
  if(!v && S.lang !== "en") return false;
  const u = new SpeechSynthesisUtterance(text);
  if(v){ u.voice = v; u.lang = v.lang; }
  u.rate = 0.9;
  u.onend = u.onerror = () => { speaking = false; const b = $("#listen"); if(b){ b.classList.remove("on"); b.innerHTML = "🔊 " + esc(tx(UI.listen)); } };
  speaking = true; speechSynthesis.speak(u); return true;
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} speaking = false; }
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

/* ---------------- screens ---------------- */
function setLang(l){ S.lang = l; try{ localStorage.setItem("learn.lang", l); }catch(e){} stopSpeak(); render(); }
function langBar(){ return `<div class="langs">${LANGS.map(l => `<button data-lang="${l.id}" class="${S.lang === l.id ? "on" : ""}">${esc(l.label)}</button>`).join("")}</div>`; }
function headerHtml(){ return `<header><h1>HF Pools <small>Learn</small></h1><span class="me">${esc(S.me ? S.me.name : "")} · <button id="out">${esc(tx(UI.signout))}</button></span></header>`; }
const statusOf = id => { const r = S.results[id]; return !r ? "new" : r.passed ? "pass" : "try"; };

function homeView(){
  const done = LESSONS.filter(l => statusOf(l.id) === "pass").length;
  return `${headerHtml()}${langBar()}
  <div class="card hello"><b>${esc(tx(UI.hi))} ${esc(S.me.name)} 👋</b><div class="muted" style="margin-top:4px">${esc(tx(UI.intro))}</div>
    <div class="progress"><i style="width:${Math.round(done / LESSONS.length * 100)}%"></i></div>
    <div class="muted" style="font-size:13.5px;margin-top:4px">${done} ${esc(tx(UI.of))} ${LESSONS.length} ${esc(tx(UI.passed))}</div></div>
  <div class="list">${LESSONS.map((l, i) => { const st = statusOf(l.id), r = S.results[l.id];
    return `<button class="lesson" data-open="${l.id}"><span class="ic">${esc(l.icon)}</span>
      <span><span class="num">${i + 1}</span><div class="tt">${esc(tx(l.title))}</div><div class="sub">⏱ ${l.mins} ${esc(tx(UI.mins))}${r ? ` · ${r.best}/${r.total}` : ""}</div></span>
      <span class="st ${st}">${esc(tx(UI["st_" + st]))}</span></button>`; }).join("")}</div>
  ${S.me.role !== "staff" ? `<div class="card team"><h2>${esc(tx(UI.team))}</h2><div id="teamtbl" class="scroll"><span class="muted">…</span></div></div>` : ""}`;
}
function lessonView(){
  const l = S.lesson, c = l.cards[S.card], last = S.card === l.cards.length - 1;
  return `${headerHtml()}${langBar()}
  <div class="top"><button class="btnlink back" id="home">${esc(tx(UI.back))}</button>
    <div class="dots">${l.cards.map((_, i) => `<i class="${i < S.card ? "done" : i === S.card ? "on" : ""}"></i>`).join("")}</div></div>
  <div class="card slide"><div class="num" style="text-align:left">${esc(l.icon)} ${esc(tx(l.title))}</div>
    <div class="pic">${picHtml(c.pic)}</div>
    <p class="say" id="say">${esc(tx(c.t))}</p>
    <div style="text-align:left"><button class="listen" id="listen">🔊 ${esc(tx(UI.listen))}</button><div class="hint" id="vhint"></div></div>
    <div class="nav"><button class="b" id="prev" ${S.card === 0 ? "disabled" : ""}>${esc(tx(UI.prev))}</button>
      <button class="b main" id="next">${esc(tx(last ? UI.toquiz : UI.next))}</button></div></div>`;
}
function quizView(){
  const l = S.lesson, qz = S.quiz, q = l.quiz[qz.i], order = qz.orders[qz.i], ans = qz.answers[qz.i];
  return `${headerHtml()}${langBar()}
  <div class="top"><button class="btnlink back" id="home">${esc(tx(UI.back))}</button>
    <div class="dots">${l.quiz.map((_, i) => `<i class="${i < qz.i ? "done" : i === qz.i ? "on" : ""}"></i>`).join("")}</div></div>
  <div class="card"><div class="num">${esc(tx(UI.question))} ${qz.i + 1} / ${l.quiz.length}</div>
    <div class="q">${esc(tx(q.q))}</div>
    <div class="opts">${order.map((oi, k) => { let cls = "";
      if(ans != null){ if(oi === q.a) cls = "right"; else if(oi === ans) cls = "wrong"; }
      return `<button class="opt ${cls}" data-opt="${oi}" ${ans != null ? "disabled" : ""}><span class="l">${"ABCD"[k]}</span>${esc(tx(q.o[oi]))}</button>`; }).join("")}</div>
    ${ans != null ? `<div class="fb ${ans === q.a ? "ok" : "no"}">${ans === q.a ? esc(tx(UI.right)) : esc(tx(UI.wrong)) + " <b>" + esc(tx(q.o[q.a])) + "</b>"}</div>
      <div class="nav"><button class="b main" id="qnext">${esc(tx(qz.i === l.quiz.length - 1 ? UI.seeres : UI.next))}</button></div>` : ""}
  </div>`;
}
function resultView(){
  const l = S.lesson, qz = S.quiz, score = qz.answers.filter((a, i) => a === l.quiz[i].a).length, pass = l.quiz.length - score <= PASS_WRONG_MAX;
  return `${headerHtml()}${langBar()}
  <div class="card result"><div class="big">${pass ? "🎉" : "💪"}</div>
    <div class="score" style="color:${pass ? "var(--ok)" : "var(--warn)"}">${score} / ${l.quiz.length}</div>
    <div style="font-size:19px">${esc(tx(pass ? UI.pass_t : UI.fail_t))}</div>
    <div class="msg ${qz.saveErr ? "err" : "ok"}" id="savemsg">${qz.saved ? esc(tx(UI.saved)) : qz.saveErr ? esc(tx(UI.notsaved)) : "…"}</div>
    <div class="nav" style="flex-direction:column">
      ${pass ? "" : `<button class="b main" id="again">${esc(tx(UI.again))}</button><button class="b" id="reread">${esc(tx(UI.reread))}</button>`}
      <button class="b ${pass ? "main" : ""}" id="home2">${esc(tx(UI.home))}</button></div></div>`;
}

function render(){
  document.body.className = S.lang === "ta" ? "ta" : "";
  document.documentElement.lang = S.lang;
  const v = S.view;
  $("#app").innerHTML = v === "lesson" ? lessonView() : v === "quiz" ? quizView() : v === "result" ? resultView() : homeView();
  window.scrollTo(0, 0);
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));
  const out = $("#out"); if(out) out.onclick = () => { stopSpeak(); auth.signOut(); };
  const home = $("#home") || $("#home2"); if(home) home.onclick = goHome;
  if(v === "home"){
    document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { S.lesson = LESSONS.find(l => l.id === b.dataset.open); S.card = 0; S.view = "lesson"; stopSpeak(); render(); });
    if(S.me.role !== "staff") loadTeam();
  }
  if(v === "lesson"){
    $("#prev").onclick = () => { stopSpeak(); S.card = Math.max(0, S.card - 1); render(); };
    $("#next").onclick = () => { stopSpeak(); if(S.card < S.lesson.cards.length - 1){ S.card++; render(); } else startQuiz(); };
    $("#listen").onclick = () => { const b = $("#listen");
      if(speaking){ stopSpeak(); b.classList.remove("on"); b.innerHTML = "🔊 " + esc(tx(UI.listen)); return; }
      if(speak($("#say").textContent)){ b.classList.add("on"); b.innerHTML = "■ " + esc(tx(UI.stop)); }
      else $("#vhint").textContent = tx(UI.novoice); };
  }
  if(v === "quiz"){
    document.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => { S.quiz.answers[S.quiz.i] = +b.dataset.opt; render(); });
    const n = $("#qnext"); if(n) n.onclick = () => { if(S.quiz.i < S.lesson.quiz.length - 1){ S.quiz.i++; render(); } else finishQuiz(); };
  }
  if(v === "result"){
    const a = $("#again"); if(a) a.onclick = startQuiz;
    const r = $("#reread"); if(r) r.onclick = () => { S.card = 0; S.view = "lesson"; render(); };
  }
}
function goHome(){ stopSpeak(); S.view = "home"; S.lesson = null; render(); }
function shuffle(n){ const a = [...Array(n).keys()]; for(let i = n - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startQuiz(){ stopSpeak(); S.quiz = {i:0, answers:S.lesson.quiz.map(() => null), orders:S.lesson.quiz.map(q => shuffle(q.o.length)), saved:false, saveErr:false}; S.view = "quiz"; render(); }
async function finishQuiz(){
  const l = S.lesson, qz = S.quiz, score = qz.answers.filter((a, i) => a === l.quiz[i].a).length, total = l.quiz.length;
  const passed = total - score <= PASS_WRONG_MAX, prev = S.results[l.id];
  S.view = "result"; render();
  const rec = {person:S.me.name, login:S.user.email, lesson:l.id, total, last:score, best:Math.max(score, prev ? prev.best || 0 : 0),
    passed:passed || !!(prev && prev.passed), attempts:(prev ? prev.attempts || 0 : 0) + 1, lang:S.lang, at:new Date().toISOString(),
    passedAt:(prev && prev.passedAt) || (passed ? new Date().toISOString() : null)};
  try{ await db.doc("learn_results/" + S.user.uid + "__" + l.id).set(rec); S.results[l.id] = rec; qz.saved = true; }
  catch(e){ qz.saveErr = true; }
  S.team = null;
  if(S.view === "result") render();
}
async function loadMine(){
  S.results = {};
  try{ const q = await db.collection("learn_results").where("login", "==", S.user.email).get(); q.forEach(d => { const r = d.data(); S.results[r.lesson] = r; }); }catch(e){}
}
async function loadTeam(){
  const box = $("#teamtbl"); if(!box) return;
  if(!S.team){ try{ const q = await db.collection("learn_results").get(); S.team = []; q.forEach(d => S.team.push(d.data())); }catch(e){ box.textContent = "—"; return; } }
  const people = [...new Set(S.team.map(r => r.person))].sort();
  if(!people.length){ box.innerHTML = `<span class="muted">—</span>`; return; }
  const cell = (p, l) => { const r = S.team.find(x => x.person === p && x.lesson === l.id);
    return !r ? `<span class="n">·</span>` : r.passed ? `<span class="p" title="${esc(r.best + "/" + r.total)}">✓</span>` : `<span class="f">${esc(r.best + "/" + r.total)}</span>`; };
  box.innerHTML = `<table><tr><th></th>${LESSONS.map((l, i) => `<th title="${esc(tx(l.title))}">${i + 1} ${esc(l.icon)}</th>`).join("")}<th>✓</th></tr>
    ${people.map(p => `<tr><td>${esc(p)}</td>${LESSONS.map(l => `<td>${cell(p, l)}</td>`).join("")}<td>${S.team.filter(r => r.person === p && r.passed).length}/${LESSONS.length}</td></tr>`).join("")}</table>`;
}

/* ---------------- sign-in ---------------- */
function loginView(msg, cls){
  $("#app").innerHTML = `<div class="card login"><h1 style="font-size:24px">HF Pools <small>Learn</small></h1>
    <form id="lf"><label>Email<input id="em" type="email" autocomplete="username" required></label>
      <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
      <button class="b main" style="width:100%;margin-top:16px" id="go" type="submit">Sign in</button></form>
    <div class="msg ${cls || ""}" id="msg">${esc(msg || "")}</div>
    <p style="font-size:13px;color:var(--ink-3);margin:8px 0 0">Same login as hfpools.com/dash. <button class="btnlink" id="forgot" type="button">Forgot password?</button></p></div>`;
  $("#lf").addEventListener("submit", async e => {
    e.preventDefault(); $("#go").disabled = true; $("#msg").textContent = "…"; $("#msg").className = "msg";
    try{ await auth.signInWithEmailAndPassword($("#em").value.trim(), $("#pw").value); }
    catch(err){ $("#go").disabled = false; $("#msg").className = "msg err";
      $("#msg").textContent = /wrong-password|invalid-credential|user-not-found|invalid-login/.test(err.code || err.message) ? "Email or password is not right." : "Couldn't sign in: " + (err.message || err); }
  });
  $("#forgot").addEventListener("click", async () => {
    const em = $("#em").value.trim();
    if(!em){ $("#msg").className = "msg err"; $("#msg").textContent = "Type your email first, then tap Forgot password."; return; }
    try{ await auth.sendPasswordResetEmail(em); }catch(err){}
    $("#msg").className = "msg ok"; $("#msg").textContent = "If that email has an account, a reset link is on its way.";
  });
}
auth.onAuthStateChanged(async u => {
  S.user = u; stopSpeak();
  if(!u){ loginView(); return; }
  S.me = await whoIs(u.email);
  await loadMine();
  S.view = "home"; render();
});
</script>
