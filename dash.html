<script>
/* HF Pools dashboard -- Chun Kay's own view of the facility team.
 * 29 Sep 2026: first version. 30 Sep 2026: split into tabs --
 *   Today (#today)  the 10-second check: needs attention, who's working, a tile per topic
 *   Water (#water)  water tests & dosing: today, last weekend's target check, 7 days, sheet vs app
 *   Work  (#work)   rounds & jobs: live rounds, added jobs, can't finish, vacuum times, Maintenance Board, issues
 *   Team  (#team)   HR: month calendar, MC/leave, app versions, skill cover
 * Sign-in: Firebase email + password (accounts created by Chun Kay in the Firebase
 * console; self sign-up is off). Read-only: nothing here changes any data. */
const firebaseConfig = {
  apiKey: "AIzaSyANFCZbvRGO9aMRtG9MF_qONO3FL85CzSo",
  authDomain: "maintenance-board-f931a.firebaseapp.com",
  projectId: "maintenance-board-f931a",
  storageBucket: "maintenance-board-f931a.firebasestorage.app",
  messagingSenderId: "169864970579",
  appId: "1:169864970579:web:bfb7490d0aebcfed17e1a6"
};
const HISTORY_API = "https://script.google.com/macros/s/AKfycbwYJLfkw5lwKnjwqmEtuRiREzbahnf2l63YhmX_7jMR9uqM9MpeqoxeVTTVw5rc76eZ6g/exec";
const BOARD_PAGE = "/tasklists/index.html";
const POOLS = ["BK","CC","DR","HB","HS","JEIP1","JEIP2","JEOP1","JEOP2","Lentor","Tengah","TPY","WWW"];
const SALT = ["BK","Lentor","Tengah","TPY","DR","HS","WWW"];
// Kay's bands (30 Sep 2026): 2.5–3.5 on target · 1.5–2 average · 1 or below low · above 3.5 high.
const FC_LOW = 2, FC_HIGH = 3.5, TARGET_LO = 2.5, TARGET_HI = 3.5, AVG_LO = 1.5;
const LONG_JOB_MIN = 90, LONG_VAC_MIN = 120, NO_MORNING_TEST_HOUR = 11;
// Maintenance Board: the day each outlet's weekly list is usually done (same as the board page).
const BOARD_DAY = {JE:1, Tengah:1, BK:1, CC:2, WWW:2, HB:3, TPY:3, DR:4, HS:4, Lentor:5};
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const TABS = [{id:"today", label:"Today", short:"Today"}, {id:"water", label:"Water & Dosing", short:"Water"}, {id:"work", label:"Work & Routes", short:"Work"}, {id:"team", label:"Team & HR", short:"Team"}];
// Same starting skills list the tracker's Team tab shows until someone edits it.
const DEFAULT_SKILL_NAMES = ["Water test", "Manual dosing", "Manual vacuum", "Night dosing", "Pressure jet",
  "Pool plumbing", "CCTV", "Wi-Fi", "Repairing", "Fibreglass", "Wallpaper", "Outdoor shades (JEOP1 & JEOP2)",
  "Monthly request delivery", "Replacing lights", "Painting", "Installing pumps, heat pumps & salt chlorinators"];

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const dateKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const clock = iso => { if(!iso) return "–"; const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const mins = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + pad(m % 60) + "m"; };
const cmpBuild = (a, b) => String(a || "").localeCompare(String(b || ""), undefined, {numeric:true});
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const t = parseKey(k); t.setDate(t.getDate() + n); return dateKey(t); };
const yesterday = k => addDays(k, -1);
const shortDate = k => { const d = parseKey(k); return DOW[d.getDay()] + " " + d.getDate(); };
const median = a => { if(!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
// Night rounds keep "yesterday" until 06:30 (they run past midnight); Fik's morning round flips at 04:00.
function nightDay(){ const d = new Date(); if(d.getHours() < 6 || (d.getHours() === 6 && d.getMinutes() < 30)) d.setDate(d.getDate() - 1); return dateKey(d); }
function calDay(){ const d = new Date(); if(d.getHours() < 4) d.setDate(d.getDate() - 1); return dateKey(d); }
const tabNow = () => { const h = (location.hash || "").replace("#", ""); return TABS.some(t => t.id === h) ? h : "today"; };

const S = {user:null, rounds:{}, month:{}, issues:{}, roster:[], leave:{}, versions:{}, cfg:null, team:null,
           hist:{}, histAt:null, histLoading:false, board:null, boardErr:false, boardAct:[], unsubs:[]};

/* ---------------- sign-in ---------------- */
function loginView(msg, cls){
  $("#app").innerHTML = `<div class="card login">
    <h1 style="font-size:24px">HF Pools</h1>
    <div class="date" style="margin-top:4px">Dashboard · sign in</div>
    <form id="lf">
      <label>Email<input id="em" type="email" autocomplete="username" required></label>
      <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
      <button class="btn" id="go" type="submit">Sign in</button>
    </form>
    <div class="msg ${cls || ""}" id="msg">${esc(msg || "")}</div>
    <p style="font-size:13px;color:var(--ink-3);margin:8px 0 0">Stays signed in on this device. <button class="btnlink" id="forgot" type="button">Forgot password?</button></p>
  </div>`;
  $("#lf").addEventListener("submit", async e => {
    e.preventDefault(); $("#go").disabled = true; $("#msg").textContent = "Signing in…"; $("#msg").className = "msg";
    try{ await auth.signInWithEmailAndPassword($("#em").value.trim(), $("#pw").value); }
    catch(err){ $("#go").disabled = false; $("#msg").className = "msg err";
      $("#msg").textContent = /wrong-password|invalid-credential|user-not-found|invalid-login/.test(err.code || err.message) ? "Email or password is not right." : /too-many/.test(err.code || "") ? "Too many tries — wait a few minutes." : "Couldn't sign in: " + (err.message || err); }
  });
  $("#forgot").addEventListener("click", async () => {
    const em = $("#em").value.trim();
    if(!em){ $("#msg").className = "msg err"; $("#msg").textContent = "Type your email first, then tap Forgot password."; return; }
    try{ await auth.sendPasswordResetEmail(em); }catch(err){}
    $("#msg").className = "msg ok"; $("#msg").textContent = "If that email has an account, a reset link is on its way.";
  });
}
/* Who is signed in. Staff get their own page, not this manager dashboard (Kay, 30 Sep 2026).
   Emails are kept out of this public page: only a SHA-256 fingerprint of each is listed.
   Anyone not listed here (Kay) gets the full dashboard; "supervisor" (William) does too. */
const PEOPLE = {
  "dc56ea9e3e3156675058121ac14f4b161da89f2f0fe90231583a2fce2797af32": {name:"Fik", role:"staff"},
  "6df36b3943ca1eea63bdcb152d79273de09030ced956146f0180cc98066f3133": {name:"Sharul", role:"staff"},
  "6ba3ddae7dbb119b31d474b6551b38f271c6df9613b44889fd8cfff6e8c47edf": {name:"William", role:"supervisor"},
  "a5745313e6b3efdd8a6388ca5f0a6e9fa95a9cab20e45ceb28290fcffa5ce05d": {name:"Islam", role:"staff"},
};
async function whoIs(email){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(email || "").trim().toLowerCase()));
    const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    return PEOPLE[hex] || null;

// Portrait: centre-crop to 3:4, 360x480 JPEG, about 30–60 KB, kept inside the record.
function portraitFrom(file){
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const W = 360, H = 480, r = W / H, sr = img.width / img.height;
      let sw = img.width, sh = img.height, sx = 0, sy = 0;
      if(sr > r){ sw = img.height * r; sx = (img.width - sw) / 2; } else { sh = img.width / r; sy = (img.height - sh) / 2; }
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("That file isn't a photo.")); };
    img.src = url;
  });
}

const sgToday = () => { const d = new Date(Date.now() + 8 * 3600e3); return d.toISOString().slice(0, 10); };
function mcDays(from, to){
  const out = []; const [y, m, d] = from.split("-").map(Number);
  for(let dt = new Date(Date.UTC(y, m - 1, d)); out.length < 31; dt.setUTCDate(dt.getUTCDate() + 1)){
    const k = dt.toISOString().slice(0, 10); if(k > to) break; out.push(k); }

}

// MC photo: longest side 1400 px JPEG, made smaller until it fits. PDFs (e-MC) are kept as they are if small enough.
function mcFileFrom(file){
  return new Promise((ok, bad) => {
    if(/pdf/i.test(file.type)){
      if(file.size > 650000) return bad(new Error("That PDF is too big — take a screenshot of the e-MC and upload the picture instead."));
      const r = new FileReader(); r.onload = () => ok({data:r.result, type:"pdf"}); r.onerror = () => bad(new Error("Couldn't read the file.")); r.readAsDataURL(file); return;
    }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let side = 1400, q = 0.72, out = "";
      for(let i = 0; i < 6; i++){
        const k = Math.min(1, side / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q); if(out.length <= MC_MAX) return ok({data:out, type:"jpg"});
        side = Math.round(side * 0.8); q = Math.max(0.5, q - 0.06);
      }
      bad(new Error("That photo is too big even after shrinking. Try again a little further away."));
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("That file isn't a photo or PDF.")); };
    img.src = url;
  });
}

// Rounds from the 1st of the month (Team calendar) or 35 days back (vacuum times), whichever is earlier.
const MONTH_CACHE = "dash.month.v1";
async function loadMonth(){
  const first = nightDay().slice(0, 8) + "01", back = addDays(calDay(), -35);
  const from = first < back ? first : back, fresh = addDays(nightDay(), -2);
  // Rounds from before the last two days don't change any more: keep them on this device and only
  // ask the database for the recent ones (saves most of the reads on every open / refresh).
  let c = null; try{ c = JSON.parse(localStorage.getItem(MONTH_CACHE) || "null"); }catch(e){}
  const useCache = c && c.from && c.from <= from && c.rounds;
  const since = useCache ? (fresh > from ? fresh : from) : from;
  try{
    const s = await db.collection("dosing_rounds").where("date", ">=", since).get();
    const rounds = {};
    if(useCache) Object.values(c.rounds).forEach(r => { if(r.date >= from && r.date < since) rounds[r.id] = r; });
    s.forEach(d => { rounds[d.id] = Object.assign({id:d.id}, d.data()); });
    S.month = rounds; render();
    // Weekend dose on a weekday (asked by a technician, OK'd by Kay or William).
    let topups = useCache ? (c.topups || []).filter(t => t.date >= from && t.date < since) : [];
    try{ const t = await db.collection("dosing_topups").where("date", ">=", since).get(); t.forEach(d => topups.push(Object.assign({id:d.id}, d.data()))); }catch(e){}
    S.topups = topups; render();
    try{ localStorage.setItem(MONTH_CACHE, JSON.stringify({from, rounds, topups})); }
    catch(e){ try{ localStorage.removeItem(MONTH_CACHE); }catch(e2){} }
  }catch(e){ console.warn(e); if(useCache && !Object.keys(S.month || {}).length){ S.month = c.rounds; S.topups = c.topups || []; render(); } }
  loadBoardActivity();
}
// Claims and Dones, each given the work day it belongs to. A Done belongs to the day its job was
// claimed: when someone forgets to close a job and taps Done the next day (Sharul, 2 -> 3 Sep),
// that next day isn't a work day. A Done more than 4 hours after its claim doesn't stretch the hours.
function boardWorkEvents(events){
  const dayOf = ts => { const d = new Date(ts); if(d.getHours() < 4) d.setDate(d.getDate() - 1); return dateKey(d); };
  const claims = {}, out = [];
  events.slice().sort((a, b) => a.ts - b.ts).forEach(e => {
    const k = String(e.who).toLowerCase() + "|" + e.outlet + "|" + (e.text || "");
    if(e.action === "claimed"){ claims[k] = e.ts; out.push(Object.assign({}, e, {day:dayOf(e.ts)})); }
    else if(e.action === "done"){
      const c = claims[k];
      if(c && e.ts - c > 4 * 36e5) out.push(Object.assign({}, e, {day:dayOf(c), ts:c, late:true}));
      else out.push(Object.assign({}, e, {day:dayOf(c || e.ts)}));
      delete claims[k];
    }
  });
  return out;
}

// Two technicians at one outlet each carry a copy of the shared jobs, so doses are
// added up within a round and the largest round's total is taken (never summed across rounds).
function trackerNight(p, day){
  const out = {fc:null, ph:null, clG:null, acidMl:null, visited:false, who:[]};
  const saw = n => { if(n && !out.who.includes(n)) out.who.push(n); };

      if(s.arriveAt) out.visited = true;
      if(t.reading && num(t.reading.fc) !== null) { out.fc = num(t.reading.fc); out.ph = num(t.reading.ph); saw(t.reading.takenBy || t.claimedBy || r.person); }

      if(d && num(d.acidMl) !== null) ac = (ac || 0) + num(d.acidMl);

    else if(sml !== null && a.acidMl !== null && Math.abs(sml - a.acidMl) >= Math.max(100, 0.1 * Math.max(sml, a.acidMl))) add("Acid differs", sAc, fmtMl(a.acidMl), "warn");

// Manual vacuum times per pool over the last 5 weeks, with the time between photo points

// A run's sections: Prep = first to last S photo; P1, P2 ... = minutes from the photo before it to

const VAC_KEY_ORDER = k => { const m = /^([SPE])(\d+)$/.exec(k); return m ? "SPE".indexOf(m[1]) * 100 + Number(m[2]) : 999; };

  allRounds().forEach(r => (r.stops || []).forEach(s => (s.tasks || []).forEach(t => {
    if(!/vacuum/i.test(t.name || "") || !t.doneAt || !t.vac || num(t.vac.minutes) === null) return;
    const ph = t.vac.photos || {}, at = k => new Date(ph[k].takenAt).getTime();

// How a section compares with usual: "slow" (2x and 10+ min over), "bitslow" (1.5x and 5+ over), "quick" (under 40% and 5+ under).
function vacCmp(v, u){

// Every run for one pool, one row each, with a column per section.
function vacPoolDetail(v){

/* ---- Water & Dosing ---- */

/* ---- Dosing review: is each pool's night dose right? (built-in check; a written AI review comes later) ----
   For each pool, the nights in the last 14 that had a dose and a next-morning test, split into weekday and
   weekend (Sat + Sun) nights, because they use different rows of the dosing table. Only nights after the
   pool's latest logged dosing change count, so a new table is judged on its own results.
   Advice: middle (median) morning FC below 2.5 -> raise; above 3.5 -> lower. Size of the change = how many
   grams it took to lift FC by 1 ppm on those nights (dose / (morning FC - night FC before the dose)),
   times the gap to 3, rounded to 50 g and kept within a quarter of the usual dose (change in steps). */
const REVIEW_NIGHTS = 14, MIN_NIGHTS = 3, TARGET_MID = 3;
const dosingChanges = () => Object.entries(S.dchanges || {}).map(([id, e]) => Object.assign({id}, e)).filter(e => e && e.date && e.pool && !e.removed).sort((a, b) => b.date.localeCompare(a.date));
const lastChange = p => dosingChanges().find(e => samePool(e.pool, p)) || null;
const round50 = g => Math.round(g / 50) * 50;
function reviewPool(p){
  const today = calDay(), ch = lastChange(p), since = ch ? ch.date : null;
  const nights = []; for(let i = 1; i <= REVIEW_NIGHTS; i++) nights.push(addDays(today, -i));
  const out = {weekday:[], weekend:[]};
  nights.forEach(n => {
    if(since && n < since) return;                               // judge the table in use now
    const d = nightDose(p, n); if(!d || d.g === null || d.g <= 0) return;
    const next = poolDay(p, addDays(n, 1)), am = next && num(next.fc && next.fc.morning);
    if(am === null || am === undefined) return;
    const rec = poolDay(p, n), before = rec && num(rec.fc && rec.fc.night);
    const bef = before !== null && before !== undefined ? before : trackerNight(p, n).fc;
    (([6, 0].includes(parseKey(n).getDay())) ? out.weekend : out.weekday).push({night:n, g:d.g, am, before:bef});
  });
  const judge = list => {
    if(list.length < MIN_NIGHTS) return {n:list.length, verdict:"wait"};
    const mid = median(list.map(x => x.am)), usual = median(list.map(x => x.g)), hits = list.filter(x => x.am >= TARGET_LO && x.am <= TARGET_HI).length;
    const rates = list.filter(x => x.before !== null && x.before !== undefined && x.am - x.before >= 0.5).map(x => x.g / (x.am - x.before));
    const gPerPpm = rates.length >= 2 ? median(rates) : null;
    let verdict = "keep", change = 0;
    if(mid < TARGET_LO || mid > TARGET_HI){
      verdict = mid < TARGET_LO ? "raise" : "lower";
      const raw = gPerPpm ? gPerPpm * (TARGET_MID - mid) : usual * 0.3 * (TARGET_MID - mid);   // no rate yet: ~30% of the dose per ppm
      change = Math.max(-usual * 0.25, Math.min(usual * 0.25, raw));   // one step at most 25% of the dose, then re-check
      change = round50(change) || (verdict === "raise" ? 50 : -50);
    }
    return {n:list.length, mid, usual, hits, verdict, change, gPerPpm};
  };
  return {pool:p, since, change:ch, weekday:judge(out.weekday), weekend:judge(out.weekend)};
}
function reviewCell(j){
  if(j.verdict === "wait") return `<span class="muted">waiting · ${j.n} of ${MIN_NIGHTS} nights</span>`;
  const head = `<span class="muted">${j.n} nights · AM ${Math.round(j.mid * 10) / 10} · ${j.hits}/${j.n} ✓ · usual ${fmtG(j.usual)}</span>`;
  const chip = j.verdict === "keep" ? '<span class="chip c-ok" style="text-transform:none">Keep</span>'
    : `<span class="chip ${j.verdict === "raise" ? "c-urg" : "c-warn"}" style="text-transform:none">${j.verdict === "raise" ? "Raise" : "Lower"} about ${j.change > 0 ? "+" : "−"}${fmtG(Math.abs(j.change))}</span>`;
  return `<div>${chip}</div><div style="font-size:12px">${head}</div>`;
}

function bindDosingChanges(){
  const f = S.dcForm; if(!f || !$("#dc-add")) return;
  $("#dc-pool").onchange = e => f.pool = e.target.value;
  $("#dc-date").onchange = e => f.date = e.target.value;
  $("#dc-note").oninput = e => f.note = e.target.value;
  $("#dc-add").onclick = async () => {
    if(!f.pool || !f.date || !f.note.trim()){ alert("Pick the pool, the date and say what changed."); return; }
    const id = f.date + "__" + f.pool.toLowerCase() + "__" + Date.now().toString(36);
    const e = {date:f.date, pool:f.pool, note:f.note.trim().slice(0, 120), by:(S.user && S.user.email || "").split("@")[0], at:new Date().toISOString()};
    S.dchanges = Object.assign({}, S.dchanges, {[id]:e}); S.dcForm = {pool:"", date:calDay(), note:""}; render();
    try{ await db.doc("dosing_config/dosing_changes").set({entries:{[id]:e}}, {merge:true}); }catch(err){ alert("Couldn't save — check your connection."); }
  };
  document.querySelectorAll("[data-dcrm]").forEach(b => b.onclick = async () => {
    const id = b.dataset.dcrm, e = (S.dchanges || {})[id]; if(!e || !confirm(`Remove ${e.pool} ${shortDate(e.date)}: ${e.note}?`)) return;
    const upd = Object.assign({}, e, {removed:true, removedAt:new Date().toISOString()});
    S.dchanges = Object.assign({}, S.dchanges, {[id]:upd}); render();
    try{ await db.doc("dosing_config/dosing_changes").set({entries:{[id]:upd}}, {merge:true}); }catch(err){}
  });
}
function drawWater(){
  const today = calDay(), yest = yesterday(today);
  const loadingRow = (p, cols) => S.hist[p] === undefined ? `<tr><td>${p}</td><td colspan="${cols}" class="muted">loading…</td></tr>` : S.hist[p] === false ? `<tr><td>${p}</td><td colspan="${cols}" class="muted">couldn't load</td></tr>` : "";
  const salt = p => SALT.includes(p) ? ' <span class="muted" title="salt chlorinator">⚡</span>' : "";

  const todayRows = POOLS.map(p => {
    const lr = loadingRow(p, 6); if(lr) return lr;
    const rec = poolDay(p, today);
    // Last night's FC: the sheet's night reading, or the tracker's water test if the sheet has none yet.
    const prev = poolDay(p, yest), sheetLn = prev && num(prev.fc && prev.fc.night), appLn = sheetLn === null || sheetLn === undefined ? trackerNight(p, yest).fc : null;
    const lnFc = sheetLn !== null && sheetLn !== undefined ? fcCell(sheetLn) : appLn !== null && appLn !== undefined ? fcCell(appLn) + ` <span class="src" title="From the tracker — not in the sheet yet">app</span>` : fcCell(null);
    const am = rec && num(rec.fc && rec.fc.morning), pm = rec && num(rec.fc && rec.fc.afternoon), ni = rec && num(rec.fc && rec.fc.night);
    const ph = rec && rec.ph && num(rec.ph.night);
    const d = nightDose(p, yest);
    let dose = "–";
    if(d){
      dose = esc(d.text) + (d.from === "app" ? ` <span class="src" title="From the tracker — not in the sheet yet">app</span>` : "");
      if(d.from === "sheet" && d.app.clG !== null && d.g !== null && Math.abs(d.g - d.app.clG) >= 50) dose += ` <span class="src" title="The tracker recorded a different amount">(app ${fmtG(d.app.clG)})</span>`;
      const h = hitMark(am); if(h) dose += " · " + (h === "✓" ? "✓ hit target" : h);
    }
    return `<tr><td>${p}${salt(p)}</td><td>${fcCell(am)}</td><td>${fcCell(pm)}</td><td>${fcCell(ni)}</td><td>${ph ?? "–"}</td><td class="ln">${lnFc}</td><td>${dose}</td></tr>`;
  }).join("");

  // Night dose -> next morning FC for the last 7 nights (oldest first). Weekend nights shaded, since
  // they're the peak; the header counts weekend hits separately. Last night's result waits for this morning's test.
  const nights = []; for(let i = 7; i >= 1; i--) nights.push(addDays(today, -i));
  const isWkNight = k => [6, 0].includes(parseKey(k).getDay());   // Sat + Sun nights
  const tally = {all:[0, 0], wk:[0, 0]};
  const wkRows = POOLS.map(p => {
    const lr = loadingRow(p, nights.length + 1); if(lr) return lr;
    let ph = 0, pc = 0;
    const cell = night => {
      const we = isWkNight(night) ? ' class="we"' : "";
      const d = nightDose(p, night), nextDay = addDays(night, 1), next = poolDay(p, nextDay), am = next && num(next.fc && next.fc.morning);
      const pending = (am === null || am === undefined) && nextDay === today;
      if(!d && (am === null || am === undefined)) return `<td${we}><span class="muted">–</span></td>`;
      if(!d) return `<td${we} title="${esc(p + " · " + shortDate(night) + " night · no dose recorded")}"><div class="dz muted">no dose</div>${fcCell(am)}</td>`;
      const h = hitMark(am);
      if(h){ pc++; tally.all[1]++; if(isWkNight(night)) tally.wk[1]++; if(h === "✓"){ ph++; tally.all[0]++; if(isWkNight(night)) tally.wk[0]++; } }
      const mark = pending ? '<span class="muted" title="Waiting for this morning\'s test">…</span>' : `<b style="color:var(--${h === "✓" ? "ok" : h === "~ average" ? "warn" : h === "✗ high" ? "travel" : "urgent"})">${h === "✓" ? "✓" : h === "~ average" ? "~" : h ? (h === "✗ high" ? "↑" : "↓") : "?"}</b>`;
      const tip = `${p} · ${shortDate(night)} night: ${d.text}${d.from === "app" ? " (from the tracker)" : ""} → ${shortDate(nextDay)} morning ${am ?? (pending ? "not tested yet" : "no test")}${h ? " · " + (h === "✓" ? "hit target" : h.replace("✗ ", "")) : ""}`;
      return `<td${we} title="${esc(tip)}"><div class="dz">${esc(d.text)}${d.from === "app" ? ' <span class="src">app</span>' : ""}</div>${fcCell(am)} ${mark}</td>`;
    };
    const cells = nights.map(cell).join("");
    return `<tr><td>${p}${salt(p)}</td>${cells}<td>${pc ? `<b style="color:var(--${ph / pc >= 0.6 ? "ok" : ph / pc >= 0.3 ? "warn" : "urgent"})">${ph}/${pc}</b>` : "–"}</td></tr>`;
  }).join("");
  const days = []; for(let i = 6; i >= 0; i--) days.push(addDays(today, -i));
  const trendRows = POOLS.map(p => {
    const lr = loadingRow(p, 7); if(lr) return lr;
    return `<tr><td>${p}${salt(p)}</td>${days.map(k => {
      const rec = poolDay(p, k), am = rec && num(rec.fc && rec.fc.morning), prev = nightDose(p, yesterday(k));
      const tip = rec ? `${p} ${shortDate(k)} · AM ${am ?? "–"} · PM ${num(rec.fc && rec.fc.afternoon) ?? "–"} · Night ${num(rec.fc && rec.fc.night) ?? "–"}${prev ? " · dosed " + prev.text + " the night before" : ""}` : `${p} ${shortDate(k)} · no record`;
      return `<td title="${esc(tip)}">${fcCell(am)}</td>`;
    }).join("")}</tr>`;
  }).join("");

  const mmRows = [yest, yesterday(yest)].flatMap(k => mismatches(k));
  const mmHtml = mmRows.length ? `<div class="scroll"><table><thead><tr><th>Night</th><th>Pool</th><th>Staff</th><th>What</th><th>Sheet</th><th>Tracker</th></tr></thead><tbody>${mmRows.map(x =>
      `<tr><td>${shortDate(x.day)}</td><td class="txt"><b>${esc(x.pool)}</b></td><td class="txt">${esc(x.who || "–")}</td><td class="txt"><span class="chip c-${x.lvl === "warn" ? "warn" : "mute"}">${x.lvl === "warn" ? "check" : "note"}</span> ${esc(x.what)}</td><td>${esc(x.sheet)}</td><td>${esc(x.app)}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">✓ The sheet and the tracker agree for the last two nights.</div>`;

  return `
  <div class="grid"><div class="stack">
    <div class="card"><h2>Water quality today <small>${S.histLoading ? (S.histAt ? "showing " + clock(S.histAt) + " · updating…" : "updating…") : S.histAt ? "as of " + clock(S.histAt) : ""} · <button class="btnlink" id="rf">Refresh</button></small></h2>
      <div class="scroll"><table><thead><tr><th>Pool</th><th>AM</th><th>PM</th><th>Night</th><th>pH</th><th class="ln">Last night FC</th><th>Last night dose</th></tr></thead><tbody>${todayRows}</tbody></table></div>
      <div class="legend"><span><span class="fc lo">1</span> low (1 or below)</span><span><span class="fc av">2</span> average (1.5–2)</span><span><span class="fc ok">3</span> on target (2.5–3.5)</span><span><span class="fc hi">4</span> high (above 3.5)</span><span>⚡ salt chlorinator · “hit target” = this morning ${TARGET_LO}–${TARGET_HI} · <span class="src">app</span> = dose from the tracker, not in the sheet yet</span></div></div>
    <div class="card"><h2>Morning FC · last 7 days <small>hover a box for the full day</small></h2>
      <div class="scroll"><table class="trend"><thead><tr><th>Pool</th>${days.map(k => `<th>${shortDate(k)}</th>`).join("")}</tr></thead><tbody>${trendRows}</tbody></table></div>
      <div class="legend">Rows of red mean the night dose for that pool is too small; rows of amber mean too big.</div></div>
  </div><div class="stack">
    <div class="card"><h2>Weekend dose on weekdays <small>this month · asked when a pool turned cloudy</small></h2>${topupHtml()}</div>
    <div class="card"><h2>Sheet vs tracker <small>last two nights</small></h2>
      <p class="lead">The night report sheet and the tracker should say the same thing. "Check" rows are worth a look; "note" rows are usually harmless.</p>
      ${mmHtml}</div>
  </div></div>
    <div class="card" style="margin-top:12px"><h2>Dosing review · does the table need changing? <small>built-in check · AI review coming</small></h2>
      ${reviewHtml()}
      <h3 style="margin:14px 0 6px;font-size:14px">Dosing changes</h3>
      <p class="lead" style="margin-bottom:8px">Log each change to a pool's dosing table. The review then only judges the nights after it.</p>
      ${changesHtml()}</div>
    <div class="card" style="margin-top:12px"><h2>Night dose → next morning · last 7 nights <small>${tally.all[1] ? `all ${tally.all[0]} of ${tally.all[1]} ✓` : ""}${tally.wk[1] ? ` · weekend ${tally.wk[0]} of ${tally.wk[1]} ✓` : ""}</small></h2>
      <p class="lead">Each box: the night's dose, then the next morning's FC. ✓ on target 2.5–3.5 · ~ average 1.5–2 · ↓ low 1 or below · ↑ high above 3.5 · ? no morning test. Shaded = Sat and Sun nights, the peak.</p>
      <div class="scroll"><table class="nd"><thead><tr><th>Pool</th>${nights.map(k => `<th${isWkNight(k) ? ' class="we"' : ""}>${shortDate(k)}</th>`).join("")}<th>Hit</th></tr></thead><tbody>${wkRows}</tbody></table></div></div>
  `;
}

function topupHtml(){
  const list = (S.topups || []).filter(x => x.status !== "cancelled" && x.date >= nightDay().slice(0, 8) + "01").sort((a, b) => String(b.requestedAt).localeCompare(String(a.requestedAt)));
  if(!list.length) return `<div class="empty">✓ None this month.</div>`;
  const byPool = {}; list.filter(x => x.status === "approved").forEach(x => byPool[x.pool] = (byPool[x.pool] || 0) + 1);
  const often = Object.entries(byPool).filter(([p, n]) => n >= 3).map(([p, n]) => `${p} ×${n}`);
  return `<div class="scroll"><table><thead><tr><th>Night</th><th>Pool</th><th>Staff</th><th>Why</th><th>Decision</th></tr></thead><tbody>${list.map(x => `<tr><td>${shortDate(x.date)}</td><td class="txt"><b>${esc(x.pool)}</b></td><td class="txt">${esc(x.person || "")}</td><td class="txt">${esc(x.reason || "")}${x.note ? `<div class="muted" style="font-size:12px">${esc(x.note)}</div>` : ""}</td><td>${x.status === "approved" ? `<span class="chip c-ok">✓ ${esc(x.decidedBy || "")}</span>` : x.status === "declined" ? `<span class="chip c-urg">✗ ${esc(x.decidedBy || "")}</span>` : `<span class="chip c-warn">waiting</span>`}</td></tr>`).join("")}</tbody></table></div>
    ${often.length ? `<div class="legend">Needed 3+ times this month: ${esc(often.join(", "))} — its weekday dose may be too low.</div>` : ""}`;
}

/* ---- Work & Routes ---- */
function drawWork(){
  const tr = todaysRounds(), today = calDay();
  const cant = tr.flatMap(x => x.tasks.filter(t => t.cantFinish && !t.doneAt).map(t => ({who:x.r.person, t})));
  const aj = addedJobs(), standing = standingJobs();
  const stateLabel = x => x.stuck ? `<span class="chip c-warn">can't finish · decide</span>` : x.state === "late" ? `<span class="chip c-urg">since ${esc(shortDate(x.e.fromDate))}</span>` : x.state === "tonight" ? `<span class="chip c-info">tonight</span>` : x.state === "upcoming" ? `<span class="chip c-mute">from ${esc(shortDate(x.e.fromDate))}</span>` : `<span class="chip c-mute">every week</span>`;
  const ajHtml = aj.length ? `<div class="scroll"><table><thead><tr><th>Outlet</th><th>Job</th><th>For</th><th>Status</th></tr></thead><tbody>${aj.map(x => `<tr><td>${esc(x.o)}</td><td class="txt">${esc(x.e.name)}${x.e.kind === "required" ? " ❗" : ""}<div class="muted" style="font-size:12px">${esc([x.e.category, x.e.addedBy ? "added by " + x.e.addedBy : ""].filter(Boolean).join(" · "))}${x.stuck && x.e.stuck.reason ? " · " + esc(x.e.stuck.reason) : ""}</div></td><td class="txt">${esc(x.e.assignee || "anyone")}</td><td>${stateLabel(x)}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">✓ No dated jobs waiting.</div>`;
  const cantHtml = cant.length ? cant.map(x => `<div class="att"><span class="chip c-warn">✕</span><div><b>${esc(x.who)} · ${esc(x.t.name)} at ${esc(x.t.outlet)}</b><div class="m">${esc(x.t.cantFinish.reason || "")}${x.t.cantFinish.note ? " — " + esc(x.t.cantFinish.note) : ""}</div></div><a class="go" href="/tasklists/dosing-round-tracker.html#overview">Decide</a></div>`).join("") : `<div class="empty">✓ Nothing today.</div>`;

  const vt = vacuumTimes(), vp = vacByPerson();
  const vtHtml = vt.length ? `<div class="scroll"><table class="vactab"><thead><tr><th>Pool</th><th>Last vacuum</th><th>Time</th><th>Usual</th><th></th><th></th></tr></thead><tbody>${vt.map(v => {
      const open = S.vtOpen === v.p;
      const extra = v.extra.length ? `<div class="muted" style="font:400 12px 'IBM Plex Sans';white-space:normal">Extra time: ${v.extra.map(o => `${esc(vacSecName(o.k))} ${Math.round(o.v)}m (usual ${Math.round(o.u)})`).join(" · ")}</div>` : "";
      return `<tr class="vrow${open ? " on" : ""}" data-vtpool="${esc(v.p)}"><td>${esc(v.p)}</td><td class="txt">${esc(shortDate(v.last.date))} · ${esc(v.last.who || "")}${v.last.morning ? " ☀" : ""}${extra}</td><td><b>${v.last.min}m</b></td><td>${v.usual !== null ? Math.round(v.usual) + "m" : "–"}<span class="muted" style="font-size:11px"> ×${v.n}</span></td><td>${v.flag ? `<span class="chip ${v.lvl === "urg" ? "c-urg" : "c-warn"}">${esc(v.flag)}</span>` : ""}</td><td class="vtog">${open ? "▾" : "▸"}</td></tr>${open ? `<tr class="vdet"><td colspan="6">${vacPoolDetail(v)}</td></tr>` : ""}`; }).join("")}</tbody></table></div>
      <div class="legend">Time = first to last photo, breaks taken off. Usual = the middle of that pool's other vacuums in the last 5 weeks. Tap a pool for every run, section by section (minutes from one photo point to the next): <span class="fc lo">slow</span> 2× usual · <span class="fc av">slower</span> 1.5× · <span class="fc hi">quick</span> under 40%.</div>`
    : `<div class="muted">No vacuums with photos in the last 5 weeks.</div>`;
  const vpHtml = vp.length ? `<div class="scroll"><table><thead><tr><th>Who</th><th>This week</th><th>Last 5 weeks</th><th>Pace</th></tr></thead><tbody>${vp.map(p => {
      const pace = p.pace === null ? "–" : Math.round(p.pace * 100) + "%", pc = p.pace === null ? "na" : p.pace > 1.3 ? "av" : p.pace < 0.7 ? "hi" : "ok";
      return `<tr><td>${esc(p.who)}</td><td>${p.wkN ? hm(p.wk) + ` <span class="muted" style="font-size:11px">×${p.wkN}</span>` : "–"}</td><td>${hm(p.all)} <span class="muted" style="font-size:11px">×${p.n}</span></td><td><span class="fc ${pc}">${pace}</span></td></tr>`; }).join("")}</tbody></table></div>
      <div class="legend">Pace = their full vacuums against each pool's usual time (100% = usual, above = slower).</div>` : "";
  const bw = boardWeek();
  let boardHtml;
  if(S.boardErr && !bw) boardHtml = `<div class="muted">Couldn't read the Maintenance Board. <a href="/board">Open it</a></div>`;
  else if(!bw) boardHtml = `<div class="muted">Loading…</div>`;
  else {
    const dow = new Date().getDay();
    boardHtml = `<div class="scroll"><table><thead><tr><th>Outlet</th><th>Day</th><th>This week</th><th></th><th>Pool maint.</th><th>Last done</th></tr></thead><tbody>${bw.map(b => {
      const pct = b.total ? Math.round(b.done / b.total * 100) : 0;
      const due = b.day !== undefined && ((dow + 1) % 7) >= ((b.day + 1) % 7); // Sat-based week: its day has come
      return `<tr><td>${esc(b.label)}</td><td>${b.day !== undefined ? DOW[b.day] : "–"}</td><td>${b.done}/${b.total}</td><td><div class="pbar"><i style="width:${pct}%"></i></div></td>
        <td>${b.poolOpen ? `<span class="chip ${due ? "c-warn" : "c-mute"}">${b.poolOpen} open</span>` : `<span class="chip c-ok">✓ done</span>`}</td>
        <td class="txt">${b.last ? esc(shortDate(dateKey(new Date(b.last.lastDoneAt)))) + " · " + esc(b.last.lastDoneBy || "") : "–"}</td></tr>`; }).join("")}</tbody></table></div>
      <div class="legend">Week runs Saturday noon → Saturday 5am (weekend peak). Amber = that outlet's maintenance day has passed with pool jobs still open.</div>`;
  }

  const iss = Object.values(S.issues).filter(i => i.status !== "resolved");
  const pr = {urgent:0, medium:1, low:2};
  iss.sort((a, b) => (pr[a.priority] ?? 1) - (pr[b.priority] ?? 1) || String(b.raisedAt || "").localeCompare(String(a.raisedAt || "")));
  const issHtml = iss.length ? `<div class="scroll"><table><thead><tr><th>Outlet</th><th>Issue</th><th>Status</th></tr></thead><tbody>${iss.slice(0, 12).map(i => `<tr><td>${esc(i.outlet)}</td><td class="txt">${esc((i.description || "").slice(0, 90))}<div class="muted" style="font-size:12px">${esc(i.raisedBy || "")}${i.raisedAt ? " · " + esc(shortDate(dateKey(new Date(i.raisedAt)))) : ""}</div></td><td><span class="chip ${i.priority === "urgent" ? "c-urg" : "c-mute"}">${esc(i.status)}${i.priority === "urgent" ? " · urgent" : ""}</span></td></tr>`).join("")}</tbody></table></div>${iss.length > 12 ? `<div class="legend">+${iss.length - 12} more on the tracker's Overview.</div>` : ""}`
    : `<div class="empty">✓ No open issues.</div>`;

  return `
  <div class="grid"><div class="stack">
    <div class="card"><h2>Rounds today <small>night, afternoon and ☀ morning · live</small></h2>${peopleHtml(true)}${peopleLegend}</div>
    <div class="card"><h2>Can't finish today <small>waiting for your decision</small></h2>${cantHtml}</div>
    <div class="card"><h2>Jobs you added <small>${standing} weekly job${standing === 1 ? "" : "s"} running · <a href="/tasklists/dosing-round-tracker.html#tasks">Task Setting</a></small></h2>${ajHtml}</div>
  </div><div class="stack">
    <div class="card"><h2>Maintenance Board · this week <small><a href="/board">Open the board</a></small></h2>${boardHtml}</div>
    <div class="card"><h2>Open issues <small>${iss.length}</small></h2>${issHtml}</div>
  </div></div>
  <div class="card" id="vacuum" style="margin-top:12px"><h2>Manual vacuum time <small>last 5 weeks · tap a pool</small></h2>${vtHtml}
    ${vpHtml ? `<h2 style="margin-top:16px">Time spent vacuuming <small>per person</small></h2>${vpHtml}` : ""}</div>`;
}

function mcWatch(){
  if(S.mcWatching) return; S.mcWatching = true;
  S.unsubs.push(db.collection("staff_mc").orderBy("at", "desc").limit(40).onSnapshot(q => {
    S.mcs = []; q.forEach(d => S.mcs.push(Object.assign({id:d.id}, d.data()))); render(); }, () => { S.mcs = []; S.mcsErr = true; render(); }));
}

  return `<div class="mc-list">${S.mcs.slice(0, 15).map(x => `<div><b>${esc(x.person)}</b><span>${esc(mcRange(x))} · ${x.days} day${x.days > 1 ? "s" : ""}</span>

    <span class="chip ${x.status === "seen" ? "c-ok" : "c-urg"}">${x.status === "seen" ? "Seen" : "New"}</span>
    <button class="btnlink" data-mcview="${esc(x.id)}">View MC</button>${x.status === "seen" ? "" : `<button class="btnlink" data-mcseen="${esc(x.id)}">Mark seen</button>`}</div>`).join("")}</div>`;
}
document.addEventListener("click", async e => {
  const v = e.target.closest && e.target.closest("[data-mcview]"), sn = e.target.closest && e.target.closest("[data-mcseen]"), cl = e.target.closest && e.target.closest("[data-mcclose]");
  if(cl || (e.target.classList && e.target.classList.contains("mc-ov"))){ const o = document.querySelector(".mc-ov"); if(o) o.remove(); return; }
  if(sn){ sn.disabled = true; try{ await db.doc("staff_mc/" + sn.dataset.mcseen).update({status:"seen", seenBy:(S.person && S.person.name) || S.user.email.split("@")[0], seenAt:new Date().toISOString()}); }catch(err){ alert("Couldn't save: " + err.message); } return; }
  if(!v) return;
  const x = (S.mcs || []).find(m => m.id === v.dataset.mcview) || {};
  const ov = document.createElement("div"); ov.className = "mc-ov";
  ov.innerHTML = `<div class="bar"><span>${esc(x.person || "")} · MC ${esc(x.from ? mcRange(x) : "")}</span><button data-mcclose>Close</button></div><div style="color:#fff">Loading…</div>`;
  document.body.appendChild(ov);
  try{ const d = await db.doc("staff_mc_file/" + v.dataset.mcview).get(); const f = d.exists ? d.data() : null;
    ov.lastElementChild.outerHTML = !f ? `<div style="color:#fff">The photo isn't there.</div>` : f.type === "pdf" ? `<iframe src="${f.data}" title="MC"></iframe>` : `<img src="${f.data}" alt="MC">`;
  }catch(err){ ov.lastElementChild.textContent = "Couldn't open it: " + err.message; }
});
function staffProfilesHtml(){
  if(!S.profilesLoading && !S.profiles){ S.profilesLoading = true;
    db.collection("staff_profiles").get().then(q => { S.profiles = []; q.forEach(d => { if(d.id !== "lock-check") S.profiles.push(Object.assign({id:d.id}, d.data())); }); S.profilesLoading = false; render(); },
      () => { S.profiles = []; S.profilesLoading = false; S.profilesErr = true; render(); }); }
  if(!S.profiles) return `<div class="empty">Loading…</div>`;
  if(S.profilesErr) return `<div class="empty">Couldn't load the staff details.</div>`;
  if(!S.profiles.length) return `<div class="empty">Nobody has filled in their details yet. Staff do it after signing in at hfpools.com/dash.</div>`;
  const row = (l, v) => v ? `<div><span class="muted">${esc(l)}</span> ${esc(v)}</div>` : "";
  return `<div class="sp-list">${S.profiles.sort((a, b) => String(a.person).localeCompare(String(b.person))).map(x => `
    <details class="sp"><summary>${x.photo ? `<img src="${x.photo}" alt="">` : `<span class="sp-nop">${esc(String(x.person || "?")[0])}</span>`}
      <span><b>${esc(x.preferredName || x.person || x.fullName)}</b><br><span class="muted">${esc(x.mobile || "")}</span></span></summary>
      <div class="sp-body">${row("Full name", x.fullName)}${x.nric ? `<div><span class="muted">NRIC / FIN</span> <button class="btnlink sp-id" data-id="${esc(x.nric)}" type="button">•••••${esc(String(x.nric).slice(-4))} · tap to show</button></div>` : ""}${row("Mobile", x.mobile)}${row("Email", x.email)}${row("Date of birth", x.dob)}${row("Nationality", x.nationality)}${row("Address", x.address)}
        ${row("Emergency", [x.emName, x.emRelation && "(" + x.emRelation + ")", x.emPhone].filter(Boolean).join(" "))}${row("Language", x.language)}${row("Uniform size", x.shirt)}
        <div class="muted" style="font-size:11.5px">Updated ${esc(x.updatedAt ? new Date(x.updatedAt).toLocaleDateString("en-SG") : "–")}</div></div></details>`).join("")}</div>`;
}
function drawTeam(){
  const today = calDay(), month = nightDay().slice(0, 7);
  const [y, m] = month.split("-").map(Number), nDays = new Date(y, m, 0).getDate();
  const days = []; for(let d = 1; d <= nDays; d++) days.push(month + "-" + pad(d));
  const people = teamNames();
  // per person per day: what they worked (night round / morning round / Maintenance Board) + time spans
  const work = {}, W = (n, day) => work[n + "|" + day] = work[n + "|" + day] || {night:false, morning:false, board:false, jobs:0, outlets:[], spans:[]};
  allRounds().filter(r => r.date && r.date.startsWith(month) && (r.stops || []).some(s => s.arriveAt || (s.tasks || []).some(t => t.doneAt || t.startedAt))).forEach(r => {
    const w = W(canonName(r.person), r.date);
    if(r.kind === "vacuum") w.morning = true; else w.night = true;
    const arr = (r.stops || []).map(s => s.arriveAt).filter(Boolean).sort(), dep = (r.stops || []).map(s => s.departAt).filter(Boolean).sort();
    if(arr.length && dep.length){ const a = new Date(arr[0]).getTime(), b = new Date(dep[dep.length - 1]).getTime(); if(b > a && b - a < 16 * 36e5) w.spans.push([a, b]); }
  });
  // Board jobs: a day counts if someone claimed or finished a job. Before 4am belongs to the day before (night work).
  const visits = {};
  boardWorkEvents(S.boardAct).forEach(e => {
    const day = e.day; if(!day.startsWith(month)) return;
    const n = canonName(e.who), w = W(n, day); w.board = true; if(e.action === "done") w.jobs++;
    w.bA = Math.min(w.bA || Infinity, e.ts); w.bB = Math.max(w.bB || 0, e.ts);
    if(!w.outlets.includes(e.outlet)) w.outlets.push(e.outlet);
    const v = visits[n + "|" + day + "|" + e.outlet] = visits[n + "|" + day + "|" + e.outlet] || {w, a:e.ts, b:e.ts};
    v.a = Math.min(v.a, e.ts); v.b = Math.max(v.b, e.ts);
  });
  Object.values(visits).forEach(v => { if(v.b > v.a && v.b - v.a < 12 * 36e5) v.w.spans.push([v.a, v.b]); });
  // Hours = time covered by rounds and board visits, overlaps counted once.
  const spanMs = spans => { let tot = 0, end = -Infinity; spans.slice().sort((x, y) => x[0] - y[0]).forEach(([a, b]) => { if(a > end){ tot += b - a; end = b; } else if(b > end){ tot += b - end; end = b; } }); return tot; };
  const lv = {}; leaveEntries().filter(e => e.date.startsWith(month)).forEach(e => lv[canonName(e.person) + "|" + e.date] = e.type);
  workEntries().filter(e => e.date.startsWith(month)).forEach(e => { const w = W(canonName(e.person), e.date); w.manual = e.note || "worked"; });
  const calRows = people.map(n => {
    let daysWorked = 0, ms = 0, mc = 0, al = 0, ul = 0, offWork = 0;
    const cells = days.map(k => {
      const w = work[n + "|" + k], l = lv[n + "|" + k], fixedOff = isFixedOff(n, k), we = [0, 6].includes(parseKey(k).getDay()) ? "we" : "";
      const t = w ? spanMs(w.spans) : 0;
      const away = l === "mc" || l === "al" || l === "ul";
      if(w && !away){ daysWorked++; ms += t; }
      if(l === "mc") mc++; if(l === "al") al++; if(l === "ul") ul++;
      const onOff = w && !away && fixedOff && k <= today;          // worked on a weekly off day = swap or OT
      if(onOff) offWork++;
      const marks = w ? `${w.night ? '<span class="w">●</span>' : ""}${w.morning ? '<span class="m">☀</span>' : ""}${w.board ? '<span class="b">◆</span>' : ""}${w.manual ? '<span class="mw">✎</span>' : ""}` : "";
      const inner = l ? `<span class="lv ${l === "mc" ? "mc" : l === "al" ? "al" : l === "ul" ? "ul" : "off"}">${l === "mc" ? "MC" : l === "al" ? "AL" : l === "ul" ? "UL" : "OFF"}</span>`
        : w ? marks : fixedOff ? '<span class="fo">off</span>' : "";
      const what = w ? [w.night && "night round", w.morning && "morning round", w.manual && `worked (added by hand: ${w.manual})`, w.board && `Tasklists ${clock(new Date(w.bA).toISOString())}–${clock(new Date(w.bB).toISOString())} (${w.jobs} job${w.jobs === 1 ? "" : "s"} done · ${w.outlets.join(", ")})`].filter(Boolean).join(" + ") : "";
      const tip = `${n} · ${shortDate(k)}${what ? " · " + what : ""}${t ? " · " + mins(t) : ""}${l ? " · " + leaveType(l) : ""}${onOff ? " · worked on off day: swap or OT" : !w && fixedOff && !l ? " · off day" : ""}`;
      return `<td class="${[we, onOff ? "ot" : ""].filter(Boolean).join(" ")}" title="${esc(tip)}">${inner}</td>`;
    }).join("");
    return `<tr><td>${esc(n)}</td>${cells}<td>${daysWorked}</td><td>${ms ? Math.round(ms / 36e5) + "h" : "–"}</td><td>${offWork ? `<span class="chip c-warn">${offWork}</span>` : "–"}</td><td>${mc || "–"}</td><td>${al || "–"}</td><td>${ul || "–"}</td></tr>`;
  }).join("");

  const upcoming = leaveEntries().filter(e => e.date >= today && e.date <= addDays(today, 21)).sort((a, b) => a.date.localeCompare(b.date));
  const upHtml = upcoming.length ? `<div class="mini">${upcoming.map(e => `<div><span>${esc(shortDate(e.date))} · <b>${esc(e.person)}</b>${e.note ? ` <span class="muted">${esc(e.note)}</span>` : ""}</span><span class="chip ${e.type === "mc" ? "c-urg" : e.type === "al" ? "c-info" : e.type === "ul" ? "c-warn" : "c-mute"}">${esc(leaveType(e.type))}</span></div>`).join("")}</div>` : `<div class="empty">✓ Nobody off in the next 3 weeks.</div>`;

  const {rows:vr} = versionRows();
  const verHtml = `<div class="scroll"><table><thead><tr><th>Person</th><th>Version</th><th>Last opened</th><th></th></tr></thead><tbody>${vr.map(x => `<tr><td>${esc(x.n)}</td><td>${esc(x.v ? x.v.build : "–")}</td><td class="txt">${x.v && x.v.at ? esc(shortDate(dateKey(new Date(x.v.at)))) + " " + clock(x.v.at) + (x.v.device ? " · " + esc(x.v.device) : "") : "never"}</td><td>${x.old ? '<span class="chip c-info">⟳ old</span>' : '<span class="chip c-ok">latest</span>'}</td></tr>`).join("")}</tbody></table></div>`;

  const td = teamData(), offNow = offToday().map(o => o.name);
  const can = sk => td.staff.filter(p => p.skills && p.skills[sk.id] && ["can", "train"].includes(p.skills[sk.id].level)).map(p => p.name);
  const skRows = td.skills.map(sk => ({sk, who:can(sk)})).map(x => ({...x, here:x.who.filter(n => !offNow.includes(n))}))
    .filter(x => x.who.length <= 1 || x.here.length < x.who.length && x.here.length <= 1)
    .sort((a, b) => a.here.length - b.here.length || a.who.length - b.who.length);
  // Group skills with the same people, so "William, Islam" isn't repeated eleven times.
  const groups = [];
  skRows.forEach(x => { const k = x.who.join(",") + "|" + x.here.join(","); let g = groups.find(g => g.k === k); if(!g) groups.push(g = {k, who:x.who, here:x.here, names:[]}); g.names.push(x.sk.name); });
  const skHtml = groups.length ? `<div class="mini">${groups.map(g => {
      const off = g.who.filter(n => !g.here.includes(n));
      const chip = g.who.length === 0 ? '<span class="chip c-urg">nobody</span>' : g.here.length === 0 ? '<span class="chip c-urg">nobody in today</span>' : g.who.length === 1 ? '<span class="chip c-warn">only 1 person</span>' : '<span class="chip c-warn">1 in today</span>';
      return `<div style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;border:0;padding:0"><b>${g.who.length ? esc(g.who.join(" & ")) : "No one"}${off.length ? ` <span class="muted" style="font-weight:400">(${esc(off.join(", "))} off today)</span>` : ""}</b>${chip}</div><div class="muted" style="display:block;border:0;padding:2px 0 0">${esc(g.names.join(" · "))}</div></div>`; }).join("")}</div>`
    : `<div class="empty">✓ Every skill has at least two people.</div>`;

  return `
  <div class="card" style="margin-bottom:12px"><h2>${esc(new Date(y, m - 1, 1).toLocaleDateString("en-SG", {month:"long", year:"numeric"}))} · who worked which day <small><a href="/tasklists/dosing-round-tracker.html#calendar">Tracker calendar</a></small></h2>
    <div class="scroll" id="calscroll"><table class="cal"><thead><tr><th>Person</th>${days.map(k => `<th class="${[0, 6].includes(parseKey(k).getDay()) ? "we" : ""}${k === today ? " today" : ""}">${Number(k.slice(8))}<br><span class="muted" style="font-weight:400">${DOW[parseKey(k).getDay()][0]}</span></th>`).join("")}<th>Days</th><th>Hours</th><th title="Worked on a weekly off day: swap or OT">Off-day work</th><th>MC</th><th>AL</th><th title="Unpaid leave">UL</th></tr></thead><tbody>${calRows}</tbody></table></div>
    <div class="legend"><span><span class="w">●</span> night round</span><span><span class="m">☀</span> morning round</span><span><span class="b">◆</span> Tasklists jobs (Maintenance Board)</span><span><span style="background:var(--warn-soft);box-shadow:inset 0 0 0 1.5px var(--warn);padding:0 4px;border-radius:3px">&nbsp;</span> worked on off day (swap or OT)</span><span><span class="fo">off</span> weekly off day</span><span><span class="mw" style="font-weight:600">✎</span> worked, added by hand</span><span><span class="lv mc" style="font:700 10px/1.4 'Barlow Condensed';padding:0 2px;border-radius:3px;background:var(--urgent-soft);color:var(--urgent)">MC</span> MC</span><span>AL annual leave · UL unpaid leave · OFF off day · hover a day for hours</span></div></div>
  <div class="grid"><div class="stack">
    <div class="card"><h2>Off · today and next 3 weeks</h2>${upHtml}</div>
    <div class="card"><h2>Skill cover <small><a href="/tasklists/dosing-round-tracker.html#team">Team tab</a></small></h2><p class="lead">Skills only one person can do, or with cover gone because someone is off today.</p>${skHtml}</div>
  </div><div class="stack">
    <div class="card"><h2>App version on each phone</h2>${verHtml}</div>
    <div class="card"><h2>MC sent by staff <small>only you and William · <a href="#staff">👁 see the staff page</a></small></h2>${mcUploadsHtml()}</div>
    <div class="card"><h2>Staff details <small>from each person's page · <a href="#staff">👁 see what they see</a></small></h2>${staffProfilesHtml()}</div>
    <div class="card"><h2>Coming later</h2><p class="lead" style="margin:0">Leave applications to approve and the conduct log will sit here once the HR app is built.</p></div>
  </div></div>`;
}
</script>
</body></html>
