<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water test</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#EEF3F3;--surface:#fff;--line:#C7D6D6;--ink:#0A1417;--ink-2:#33474D;--ink-3:#5B7378;--accent:#00676F;--ok:#256B4C;--ok-soft:#DDEEE5;--warn:#8A590D;--warn-soft:#F6EAD4;--urgent:#B23A2E;--urgent-soft:#F8DEDA}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font:700 26px/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px}
h2{font:700 15px/1.2 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.card.done{border-color:#9cc9b2}.card.done h2::after{content:" ✓";color:var(--ok)}
.card.locked{opacity:.45;pointer-events:none}
.note{color:var(--ink-3);font-size:13px}
.num{display:inline-block;min-width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;font:700 13px/22px "IBM Plex Sans";margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.opts.two{grid-template-columns:1fr 1fr}.opts.four{grid-template-columns:repeat(4,1fr)}
.opts button{font:600 15px "IBM Plex Sans",sans-serif;padding:12px 6px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-2);cursor:pointer}
.opts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
label{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 4px}
input[type=text],input[type=number],input:not([type]){width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.shot{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:10px}
.shot img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#ddd}
.shot .t{flex:1;font-size:14px}.shot .t b{display:block}
.shot .st{font-size:12px;color:var(--ink-3)}.shot .st.ok{color:var(--ok);font-weight:600}.shot .st.bad{color:var(--urgent);font-weight:600}
.cam{position:relative;overflow:hidden;font:600 14px "IBM Plex Sans";background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.cam.redo{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.cam input{position:absolute;inset:0;opacity:0;cursor:pointer}
.go{font:600 17px "IBM Plex Sans",sans-serif;border:0;border-radius:12px;padding:16px;width:100%;margin-top:14px;background:var(--accent);color:#fff;cursor:pointer}
.go:disabled{opacity:.45}
.fc{margin-top:8px;font-size:15px}.fc b{font-size:20px;color:var(--accent)}
pre{white-space:pre-wrap;background:#F6F9F9;border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.45 "IBM Plex Mono",ui-monospace,monospace;margin:8px 0 0}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:600;font-size:14px}
.err{background:var(--urgent-soft);color:var(--urgent);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:12px;margin-top:10px;font-weight:600}
.hist div{padding:7px 0;border-top:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.ghost{background:none;border:0;color:var(--ink-3);font:14px "IBM Plex Sans";cursor:pointer;padding:8px;margin-top:6px;width:100%}
</style></head>
<body><main>
<h1 id="title">Water test</h1>
<div class="note">Do each step in order and take the photo when asked. When every step is done, tap <b>Send report</b> — the report goes to the branch Telegram group and into the records by itself.</div>
<div id="app"><div class="card note">Loading…</div></div>
<div class="card hist"><h2>Recent water tests</h2><div id="hist" class="note">Loading…</div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* Morning / afternoon water test form (Kay, 5 Nov 2026). hfpools.com/wt-form.html?outlet=BK  (add &test=1 to try it).
 * No login: the tester types their name (remembered on the phone). Each photo is stamped (outlet · session · step ·
 * name · time) and uploaded through the tracker's photo relay (dosing_config/tasks.photo, kind "job") to Drive.
 * Send writes water_tests/{OUTLET}_{yyyymmdd}_{Session}_{HHMMSS}: {outlet, pool, date, session, clarity, fcDrops, fc, ph,
 * temp, chlorinator, pump, heatPump, filters[], waterMeter, tester, photos{step:{fileId,url,at}}, startedAt, submittedAt,
 * reportText, status:"submitted", test}. The Pool Telegram Logger (DayReports.gs, appDayReports_) posts reportText to the
 * branch topic, logs FC/pH/temp into the Pool Water Test Records sheet and sets status "posted" (+ messageId) or "error".
 * Night tests stay in the tracker's "Water Test and Night Report" job. Only outlets in OUTLETS can use the form. */
firebase.initializeApp({
  apiKey: "AIzaSyANFCZbvRGO9aMRtG9MF_qONO3FL85CzSo", authDomain: "maintenance-board-f931a.firebaseapp.com",
  projectId: "maintenance-board-f931a", storageBucket: "maintenance-board-f931a.firebasestorage.app",
  messagingSenderId: "169864970579", appId: "1:169864970579:web:bfb7490d0aebcfed17e1a6"
});
const db = firebase.firestore();
// Outlet set-up. BK first (Kay, 5 Nov 2026); add others once their format is agreed.
const OUTLETS = {
  BK: {title: "BK", filters: 3}
};
const PH_VALUES = ["6.8", "7.0", "7.2", "7.4", "7.6", "7.8", "8.0", "8.2"];
const P = new URLSearchParams(location.search);
const OUT = (P.get("outlet") || "BK").toUpperCase(), CFG = OUTLETS[OUT], TEST = P.get("test") === "1";
const PHOTO_MAX_PX = 1600, MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} } };
const sgNow = () => new Date(Date.now() + 8 * 3600e3);              // Singapore wall clock in UTC fields
const todayKey = () => sgNow().toISOString().slice(0, 10);
const app = document.getElementById("app");
document.getElementById("title").textContent = (CFG ? CFG.title + " · " : "") + "Water test";

const STEPS = [
  {id: "clarity", t: "Water clarity", kind: "clarity"},
  {id: "sample", t: "Take the water sample at the sample point", d: "Elbow deep, at the marked sample point — not near a skimmer or return jet.", photos: [["sample", "Water sample"]]},
  {id: "tubes", t: "Fill the comparator tubes", d: "25 ml tube (FC) and 44 ml tube (pH).", photos: [["tubes", "Tubes filled 25 ml + 44 ml"]]},
  {id: "fcpink", t: "FC test: add the powder", d: "2 dips of R-0870 into the 25 ml tube, swirl. It turns pink.", photos: [["fcPink", "FC pink after R-0870"]]},
  {id: "fcdrops", t: "FC test: count the drops", d: "Add R-0871 one drop at a time, swirling, until the water turns clear. Key in how many drops.", kind: "drops", photos: [["fcClear", "FC clear result"]]},
  {id: "ph", t: "pH test", d: "5 drops of R-0004 into the 44 ml tube, swirl, then compare the colour.", kind: "ph", photos: [["ph", "pH colour"]]},
  {id: "temp", t: "Pool temperature", d: "Thermometer in the pool water.", kind: "temp"},
  {id: "panel", t: "Control panel", d: "Photo of the control panel, then say what is ON.", kind: "panel", photos: [["panel", "Control panel"]]},
  {id: "heat", t: "Heat pump", d: "Photo of the heat pump display and key in the reading.", kind: "heat", photos: [["heatPump", "Heat pump display"]]},
  {id: "filters", t: "Filter gauges", d: "One photo per gauge and key in each reading.", kind: "filters"},
  {id: "meter", t: "Water meter", d: "Photo of the water meter and key in the reading.", kind: "meter", photos: [["meter", "Water meter"]]}
];
const filterPhotos = () => Array.from({length: CFG.filters}, (_, i) => ["filter" + (i + 1), "Filter gauge " + (i + 1)]);

let S = null, relayCfg = null, posting = null;
function newDraft(){
  const h = sgNow().getUTCHours();
  return {date: todayKey(), session: h < 12 ? "Morning" : "Afternoon", name: store.get("wtFormName") || "", clarity: "", fcDrops: "", ph: "", temp: "",
          chlorinator: "", pump: "", heatPump: "", filters: Array(CFG ? CFG.filters : 0).fill(""), waterMeter: "", photos: {}, startedAt: null};
}
const DKEY = () => "wtForm_" + OUT + (TEST ? "_test" : "");
function load(){ try{ const d = JSON.parse(store.get(DKEY()) || "null"); if(d && d.date === todayKey()) return d; }catch(e){} return newDraft(); }
function save(){ store.set(DKEY(), JSON.stringify(S, (k, v) => k === "dataUrl" ? undefined : v)); }

/* ---------- photos (same relay as the tracker) ---------- */
async function loadImg(file){
  try{ return await createImageBitmap(file, {imageOrientation: "from-image"}); }
  catch(e){ return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); }); }
}
async function prepare(file, lines){
  const img = await loadImg(file);
  const sc = Math.min(1, PHOTO_MAX_PX / Math.max(img.width, img.height)), W = Math.round(img.width * sc), H = Math.round(img.height * sc);
  const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d"); g.drawImage(img, 0, 0, W, H);
  const fs = Math.max(14, Math.round(W / 40)), p = Math.round(fs * .6), bandH = p * 2 + lines.length * Math.round(fs * 1.3);
  g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(0, H - bandH, W, bandH); g.fillStyle = "#fff"; g.font = `600 ${fs}px monospace`; g.textBaseline = "top";
  lines.forEach((ln, i) => g.fillText(ln, p, H - bandH + p + i * Math.round(fs * 1.3)));
  const dataUrl = c.toDataURL("image/jpeg", 0.82);
  return {dataUrl, base64: dataUrl.split(",")[1]};
}
let chain = Promise.resolve();
function upload(payload){ const run = () => tryUpload(payload); const nx = chain.then(run, run); chain = nx.catch(() => {}); return nx; }
async function tryUpload(payload){
  let last;
  for(let i = 0; i < 3; i++){
    try{
      if(!relayCfg) throw Object.assign(new Error("The photo relay isn't set up. Tell Kay."), {fatal: true});
      const res = await fetch(relayCfg.relayUrl, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({key: relayCfg.key || ""}, payload))});
      if(!res.ok) throw new Error("The photo relay was busy (HTTP " + res.status + ").");
      const j = await res.json(); if(!j || !j.ok) throw Object.assign(new Error(String((j && j.error) || "The photo relay refused the photo.")), {fatal: true});
      return j;
    }catch(e){ last = e; if(e.fatal) throw e; if(i < 2) await new Promise(r => setTimeout(r, 900 * Math.pow(2, i))); }
  }
  throw last;
}
async function takePhoto(file, pid, label){
  if(!S.name.trim()){ alertBox("Type your name at the top first."); return; }
  const n = sgNow(), takenAt = new Date().toISOString();
  if(!S.startedAt) S.startedAt = takenAt;
  const ph = S.photos[pid] = {status: "preparing", at: takenAt}; render();
  let prep;
  try{ prep = await prepare(file, [`${OUT} · ${S.session} water test · ${label}`.slice(0, 60), `${S.name.trim()} · ${n.getUTCDate()} ${MONTH[n.getUTCMonth()]} ${n.getUTCFullYear()} ${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())}`]); }
  catch(e){ delete S.photos[pid]; alertBox("Couldn't read that photo. Try again."); render(); return; }
  ph.status = "uploading"; ph.dataUrl = prep.dataUrl; render();
  try{
    const r = await upload({kind: "job", outlet: OUT, pool: OUT, job: `Water test (${S.session}) · ${label}`, person: S.name.trim() + (TEST ? " (test)" : ""), takenAt, date: S.date, tool: "none", wantReading: false, imageBase64: prep.base64, photoNo: Object.keys(S.photos).length});
    Object.assign(ph, {status: "done", fileId: r.fileId, url: r.url, thumb: r.thumb || null});
  }catch(e){ ph.status = "failed"; ph.error = e.message; }
  save(); render();
}

/* ---------- step completion ---------- */
const num = v => v !== "" && v != null && isFinite(Number(v));
const photoOk = pid => S.photos[pid] && S.photos[pid].status === "done";
function stepDone(st){
  const photos = st.kind === "filters" ? filterPhotos() : (st.photos || []);
  if(!photos.every(p => photoOk(p[0]))) return false;
  switch(st.kind){
    case "clarity": return !!S.clarity;
    case "drops": return num(S.fcDrops) && Number(S.fcDrops) >= 0 && Number(S.fcDrops) <= 30;
    case "ph": return !!S.ph;
    case "temp": return num(S.temp) && Number(S.temp) >= 20 && Number(S.temp) <= 40;
    case "panel": return !!S.chlorinator && !!S.pump;
    case "heat": return num(S.heatPump);
    case "filters": return S.filters.every(num);
    case "meter": return num(S.waterMeter);
    default: return true;
  }
}
const fcOf = () => num(S.fcDrops) ? Number(S.fcDrops) * 0.5 : null;
const fmt = v => { const n = Number(v); return Number.isInteger(n) ? String(n) : String(n); };
function reportText(){
  const onoff = v => String(v).toUpperCase();
  return [`${CFG.title} Report`, `${S.session} Report`, "",
    `Water Clarity: ${S.clarity}`,
    `Free Chlorine: ${fmt(fcOf())}ppm`,
    `PH: ${S.ph}`,
    `Salt Chlorinator: ${onoff(S.chlorinator)}`,
    `Circulation pump: ${onoff(S.pump)}`,
    `Heat pump: ${Number(S.heatPump).toFixed(1)}`,
    `Pool Temperature: ${Number(S.temp).toFixed(1)}`,
    `Filters: ${S.filters.map(x => fmt(x)).join("/")}`,
    `Water Meter: ${S.waterMeter}`,
    `Tester: ${S.name.trim().toUpperCase()}`].join("\n");
}

/* ---------- render ---------- */
function shotRow(pid, label){
  const p = S.photos[pid];
  const img = p && (p.dataUrl || p.thumb) ? `<img src="${esc(p.dataUrl || p.thumb)}" alt="">` : `<img alt="">`;
  const st = !p ? `<span class="st">No photo yet</span>` : p.status === "done" ? `<span class="st ok">Saved ✓</span>` :
             p.status === "failed" ? `<span class="st bad">Not saved — ${esc(p.error || "")} Take it again.</span>` : `<span class="st">Saving…</span>`;
  return `<div class="shot">${img}<div class="t"><b>📷 ${esc(label)}</b>${st}</div>
    <label class="cam ${p && p.status === "done" ? "redo" : ""}">${p ? "Retake" : "Take photo"}<input type="file" accept="image/*" capture="environment" data-pid="${pid}" data-label="${esc(label)}"></label></div>`;
}
function opts(field, values, cls, labels){
  return `<div class="opts ${cls || ""}">` + values.map((v, i) => `<button type="button" data-f="${field}" data-v="${esc(v)}" class="${String(S[field]) === String(v) ? "on" : ""}">${esc(labels ? labels[i] : v)}</button>`).join("") + `</div>`;
}
function body(st){
  const photos = st.kind === "filters" ? [] : (st.photos || []).map(p => shotRow(p[0], p[1])).join("");
  switch(st.kind){
    case "clarity": return opts("clarity", ["Crystal Clear", "Clear", "Cloudy"]);
    case "drops": return `<label>Drops of R-0871 until clear</label><input type="number" inputmode="numeric" min="0" max="30" step="1" data-in="fcDrops" value="${esc(S.fcDrops)}">
      <div class="fc">Free chlorine = drops × 0.5 = <b>${fcOf() == null ? "—" : fmt(fcOf()) + " ppm"}</b></div>` + photos;
    case "ph": return opts("ph", PH_VALUES, "four") + photos;
    case "temp": return `<label>Pool temperature (°C)</label><input type="number" inputmode="decimal" step="0.1" data-in="temp" value="${esc(S.temp)}">`;
    case "panel": return photos + `<label>Salt chlorinator</label>` + opts("chlorinator", ["on", "off"], "two", ["ON", "OFF"]) + `<label>Circulation pump</label>` + opts("pump", ["on", "off"], "two", ["ON", "OFF"]);
    case "heat": return photos + `<label>Heat pump reading (°C)</label><input type="number" inputmode="decimal" step="0.1" data-in="heatPump" value="${esc(S.heatPump)}">`;
    case "filters": return filterPhotos().map(([pid, label], i) => shotRow(pid, label) + `<label>Filter ${i + 1} reading</label><input type="number" inputmode="decimal" step="0.1" data-filter="${i}" value="${esc(S.filters[i])}">`).join("");
    case "meter": return photos + `<label>Water meter reading</label><input type="number" inputmode="numeric" step="1" data-in="waterMeter" value="${esc(S.waterMeter)}">`;
    default: return photos;
  }
}
let msg = "";
function alertBox(t){ msg = t; render(); }
function render(){
  if(!CFG){ app.innerHTML = `<div class="card">This form isn't set up for ${esc(OUT)} yet.</div>`; return; }
  if(posting){ return renderPosting(); }
  const firstOpen = STEPS.findIndex(st => !stepDone(st));
  const allDone = firstOpen < 0 && S.name.trim();
  let h = (TEST ? `<div class="banner">TEST MODE — the report is posted with a TEST line and is not written to the records.</div>` : "") +
    `<div class="card"><label style="margin-top:0">Your name</label><input data-name value="${esc(S.name)}" placeholder="e.g. Cessy" autocomplete="name">
     <label>Which test?</label>${opts("session", ["Morning", "Afternoon"], "two")}</div>` +
    (msg ? `<div class="err">${esc(msg)}</div>` : "");
  STEPS.forEach((st, i) => {
    const done = stepDone(st), locked = firstOpen >= 0 && i > firstOpen;
    h += `<div class="card ${done ? "done" : ""} ${locked ? "locked" : ""}"><h2><span class="num">${i + 1}</span>${esc(st.t)}</h2>${st.d ? `<div class="note">${esc(st.d)}</div>` : ""}${body(st)}</div>`;
  });
  h += `<div class="card ${allDone ? "" : "locked"}"><h2>Report preview</h2>${allDone ? `<pre>${esc(reportText())}</pre>` : `<div class="note">Finish every step to see the report.</div>`}
    <button class="go" id="send" ${allDone ? "" : "disabled"}>Send report to the ${esc(CFG.title)} group</button></div>
    <button class="ghost" id="reset">Start again (clears this test)</button>`;
  app.innerHTML = h;
  app.querySelector("[data-name]").oninput = e => { S.name = e.target.value; store.set("wtFormName", S.name.trim()); save(); };
  app.querySelector("[data-name]").onchange = () => render();
  app.querySelectorAll("button[data-f]").forEach(b => b.onclick = () => { S[b.dataset.f] = b.dataset.v; msg = ""; save(); render(); });
  app.querySelectorAll("input[data-in]").forEach(inp => { inp.oninput = () => { S[inp.dataset.in] = inp.value.trim(); save(); refreshSoft(inp); }; inp.onchange = () => render(); });
  app.querySelectorAll("input[data-filter]").forEach(inp => { inp.oninput = () => { S.filters[+inp.dataset.filter] = inp.value.trim(); save(); }; inp.onchange = () => render(); });
  app.querySelectorAll("input[type=file]").forEach(inp => inp.onchange = () => { const f = inp.files && inp.files[0]; if(f){ msg = ""; takePhoto(f, inp.dataset.pid, inp.dataset.label); } });
  const send = document.getElementById("send"); if(send) send.onclick = submit;
  document.getElementById("reset").onclick = () => { if(confirm("Clear this water test and start again?")){ S = newDraft(); save(); msg = ""; render(); } };
}
function refreshSoft(inp){ if(inp.dataset.in === "fcDrops"){ const b = inp.parentElement.querySelector(".fc b"); if(b) b.textContent = fcOf() == null ? "—" : fmt(fcOf()) + " ppm"; } }

/* ---------- send ---------- */
async function submit(){
  const btn = document.getElementById("send"); btn.disabled = true; btn.textContent = "Sending…";
  const now = sgNow(), id = `${OUT}_${S.date.replace(/-/g, "")}_${S.session}_${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}`;
  const photos = {}; Object.keys(S.photos).forEach(k => { const p = S.photos[k]; photos[k] = {fileId: p.fileId, url: p.url, at: p.at}; });
  const doc = {outlet: OUT, pool: OUT, date: S.date, session: S.session, clarity: S.clarity, fcDrops: Number(S.fcDrops), fc: fcOf(), ph: Number(S.ph),
    temp: Number(S.temp), chlorinator: S.chlorinator, pump: S.pump, heatPump: Number(S.heatPump), filters: S.filters.map(Number), waterMeter: S.waterMeter,
    tester: S.name.trim(), photos, startedAt: S.startedAt, submittedAt: new Date().toISOString(), reportText: reportText(), status: "submitted",
    src: "wt-form v1", ...(TEST ? {test: true} : {})};
  try{ await db.collection("water_tests").doc(id).set(doc); }
  catch(e){ btn.disabled = false; btn.textContent = "Send report"; alertBox("Couldn't send — check the signal and try again. (" + e.message + ")"); return; }
  posting = {id, text: doc.reportText, status: "submitted"};
  S = newDraft(); save(); render(); history();
  db.collection("water_tests").doc(id).onSnapshot(s => { const d = s.data() || {}; posting.status = d.status; posting.err = d.postError; render(); });
}
function renderPosting(){
  const st = posting.status;
  app.innerHTML = `<div class="card">${st === "posted" ? `<div class="okbox">✓ Posted to the ${esc(CFG.title)} Telegram group${TEST ? " (test)" : ""} and saved.</div>` :
    st === "error" ? `<div class="err">Saved, but it couldn't be posted to Telegram: ${esc(posting.err || "")}. Tell Kay.</div>` :
    `<div class="banner">✓ Saved. Posting to the ${esc(CFG.title)} group… (usually within a minute)</div>`}
    <pre>${esc(posting.text)}</pre><button class="go" id="again">Start a new water test</button></div>`;
  document.getElementById("again").onclick = () => { posting = null; render(); };
}
async function history(){
  try{
    const q = await db.collection("water_tests").where("outlet", "==", OUT).get();
    const rows = q.docs.map(d => d.data()).filter(d => TEST || !d.test).sort((a, b) => a.submittedAt < b.submittedAt ? 1 : -1).slice(0, 8);
    document.getElementById("hist").innerHTML = rows.length ? rows.map(d => {
      const t = new Date(d.submittedAt), sg = new Date(t.getTime() + 8 * 3600e3);
      return `<div><span>${sg.getUTCDate()} ${MONTH[sg.getUTCMonth()]} · ${esc(d.session)}${d.test ? " (test)" : ""} · ${esc(d.tester)}</span><span>FC ${esc(d.fc)} · pH ${esc(d.ph)} · ${d.status === "posted" ? "✓ posted" : d.status === "error" ? "⚠ not posted" : "posting…"}</span></div>`;
    }).join("") : "None yet.";
  }catch(e){ document.getElementById("hist").textContent = "Couldn't load: " + e.message; }
}
(async () => {
  try{ const d = await db.doc("dosing_config/tasks").get(); const c = (d.exists && d.data()) || {}; relayCfg = c.photo && c.photo.relayUrl ? c.photo : null; }catch(e){}
  S = load(); if(CFG && S.filters.length !== CFG.filters) S.filters = Array(CFG.filters).fill("");
  Object.values(S.photos).forEach(p => { if(p.status !== "done") { p.status = "failed"; p.error = "page was closed"; } });
  render(); history();
})();
</script>
