async function vacMapImage(card, doneIds, skipIds, partial, width){
  const html = vacMapHtml(card, null, doneIds, skipIds, partial); if(!html) return null;
  const box = document.createElement("div"); box.innerHTML = html; const svg = box.firstElementChild; if(!svg) return null;
  svg.setAttribute("xmlns", "http://www.w3.org/2000/svg"); svg.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
  const vb = (svg.getAttribute("viewBox") || "0 0 800 600").split(/[\s,]+/).map(Number);
  const W = width || 900, H = Math.max(100, Math.round(W * vb[3] / vb[2]));
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const st = document.createElementNS("http://www.w3.org/2000/svg", "style"); st.textContent = "text{font-family:Helvetica,Arial,sans-serif}"; svg.insertBefore(st, svg.firstChild);
  const xml = new XMLSerializer().serializeToString(svg);
  const url = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(xml)));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("map draw failed")); img.src = url; });
  const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H);
  const dataUrl = c.toDataURL("image/jpeg", 0.85);
  return dataUrl.split(",")[1];
}
// Which sections were vacuumed and which were not, in words, for the branch message.
// Sections come from the route card's Play steps (vacSecPhotos); if the card isn't
// loaded on this phone, the photo-point labels stand in.
function vacSectionSummary(spec, doneIds, skipped){
  const skipIds = Object.keys(skipped || {});
  const secs = spec.card ? vacSecPhotos(spec.card) : {}, titles = ((vacMap.secTitles || {})[spec.card] || {});
  const out = {total:0, done:[], skipped:[], notDone:[]};
  const keys = Object.keys(secs);
  if(keys.length){
    keys.forEach(n => {
      const ids = secs[n], title = titles[n] || ("Section " + n);
      const sk = ids.every(id => skipIds.includes(id));
      const dn = !sk && ids.every(id => doneIds.includes(id) || skipIds.includes(id));
      out.total++;
      if(sk) out.skipped.push({sec:n, title, reason:(skipped[ids[0]] || {}).reason || ""});
      else if(dn) out.done.push(title);
      else out.notDone.push(title);
    });
  } else {
    spec.list.filter(x => x.when === "start" && /^P\d+$/.test(x.id)).forEach(x => {
      out.total++;
      if(skipIds.includes(x.id)) out.skipped.push({sec:x.id, title:x.label, reason:(skipped[x.id] || {}).reason || ""});
      else if(doneIds.includes(x.id)) out.done.push(x.label);
      else out.notDone.push(x.label);
    });
  }
  return out;
}

  const v = t.vac || {}, outlet = stop.outlet || "", poolKey = v.poolKey || dosingKeyFor(outlet, t.pool || null);
  const spec = VAC_PHOTOS[poolKey] || null;
  const photos = v.photos || {}, doneIds = Object.keys(photos).filter(id => photos[id] && (photos[id].url || photos[id].fileId || photos[id].takenAt));
  const skipped = v.skipped || t.vacSkipped || {}, skipIds = Object.keys(skipped);

  const who = v.by || t.claimedBy || r.person || "";

  const status = !t.doneAt ? `<span class="tag run">In progress</span>` : partly ? `<span class="tag warn">Partly done</span>` : `<span class="tag ok">Done</span>`;

  const labelOf = id => (spec && (spec.list.find(x => x.id === id) || {}).label) || id;
  const order = spec ? spec.list.map(x => x.id) : Object.keys(photos);
  const photoHtml = order.filter(id => photos[id] && photos[id].url).map(id => { const p = photos[id];
    return `<a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.thumb || p.url)}" alt="${esc(id)}" loading="lazy"><span><b>${esc(id)}</b> ${esc(labelOf(id))}${p.takenAt ? " · " + esc(clock(p.takenAt)) : ""}</span></a>`; }).join("");
  app.innerHTML = `
    <h1>Manual vacuum <small style="color:var(--accent)">${esc(poolKey)}${t.pool && t.pool !== poolKey ? " · " + esc(t.pool) : ""}</small></h1>
    <div class="meta">${status} <b>${esc(who)}</b> · ${esc(day(t.doneAt || t.startedAt))}${first ? ` · ${esc(clock(first))}${last ? "–" + esc(clock(last)) : ""}` : ""}${mins != null ? ` · ${esc(dur(mins))}` : ""}${v.breakMin ? ` (${esc(dur(v.breakMin))} break)` : ""}</div>
    ${mapHtml ? `<div class="card"><h2>Area covered</h2><div class="map">${mapHtml}</div><div class="legend"><span><i style="background:#16A34A;opacity:.6"></i>vacuumed</span><span><i style="background:#6B7280;opacity:.8"></i>skipped / not done</span><span>P = photo point · S = before starting · E = after vacuuming</span></div></div>`
      : `<div class="card"><div class="note">${spec ? "The route map couldn't be loaded right now." : "No route map is set up for this pool yet."}</div></div>`}
    ${sec && sec.total ? `<div class="card"><h2>Sections</h2>
      ${sec.done.length ? `<div><b style="color:var(--ok)">Vacuumed (${sec.done.length} of ${sec.total})</b><ul>${sec.done.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      ${sec.skipped.length ? `<div style="margin-top:8px"><b style="color:var(--urgent)">Skipped</b><ul>${sec.skipped.map(x => `<li>${esc(x.title)}${x.reason ? ` — ${esc(x.reason)}` : ""}</li>`).join("")}</ul></div>` : ""}
      ${sec.notDone.length ? `<div style="margin-top:8px"><b style="color:var(--warn)">Not done</b><ul>${sec.notDone.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      ${!sec.done.length && !sec.skipped.length && !sec.notDone.length ? `<div class="note">All ${sec.total} sections vacuumed.</div>` : ""}</div>` : ""}
    ${photoHtml ? `<div class="card"><h2>Photos <small style="font:400 12px 'IBM Plex Sans';text-transform:none;letter-spacing:0;color:var(--ink-3)">${doneIds.length} taken</small></h2><div class="photos">${photoHtml}</div></div>` : `<div class="card"><div class="note">No photos on this job.</div></div>`}
    <div class="note">From the HF Pools tracker · ${esc(outlet)}</div>`;
}
main();
</script></body></html>
