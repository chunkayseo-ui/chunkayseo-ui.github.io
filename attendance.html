<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HF Pools · Expected vs Came</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#EEF3F3;--surface:#fff;--surface-2:#F6F9F9;--line:#C7D6D6;--line-soft:#DCE6E6;--ink:#0A1417;--ink-2:#33474D;--ink-3:#5B7378;
--came:#0090a0;--missed:#e0692e;--missed-soft:#FBE7DC;--came-soft:#D9F0F2}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
h1{font:700 26px/1.05 "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
.sub{color:var(--ink-3);font-size:13px;margin-top:4px}
h2{font:700 15px/1.1 "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:0 0 4px}
.lead{font-size:13.5px;color:var(--ink-3);margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);margin:14px 0 12px}
.seg button{border:0;background:none;padding:9px 14px;font:600 13px "IBM Plex Sans",system-ui,sans-serif;color:var(--ink-3);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:center}
.hero .big{font:700 64px/1 "IBM Plex Mono",monospace;color:var(--missed);letter-spacing:-.02em}
.hero .what{font-size:17px;font-weight:600;margin-top:6px}
.hero .ctx{font-size:14px;color:var(--ink-3);margin-top:6px}
.oneinn{font:700 34px/1 "IBM Plex Mono",monospace}
.oneinn small{font:600 13px "IBM Plex Sans",system-ui,sans-serif;color:var(--ink-3);display:block;margin-top:6px}
.mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.mini div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.mini b{display:block;font:700 20px/1.1 "IBM Plex Mono",monospace}
.mini span{font-size:12px;color:var(--ink-3)}
.why{background:var(--missed-soft);border:0}
.why p{margin:0 0 8px;font-size:14.5px}
.why p:last-child{margin:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin:0 0 10px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
/* horizontal stacked bars: came + missed = expected */
.hb{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-soft)}
.hb:first-of-type{border-top:0}
.hb .name{font-weight:600;font-size:14px}
.hb .track{display:flex;height:18px;gap:2px;min-width:0}
.hb .track i{display:block;height:100%}
.hb .track i.c{background:var(--came);border-radius:4px 0 0 4px}
.hb .track i.m{background:var(--missed);border-radius:0 4px 4px 0}
.hb .val{text-align:right;font:600 13px "IBM Plex Mono",monospace;white-space:nowrap}
.hb .val small{display:block;font:400 11.5px "IBM Plex Sans",system-ui,sans-serif;color:var(--ink-3)}
/* vertical stacked columns */
.cols{display:flex;align-items:flex-end;gap:3px;height:190px;padding-top:18px;position:relative}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;position:relative;cursor:default}
.col i{display:block;width:100%}
.col i.m{background:var(--missed);border-radius:3px 3px 0 0;margin-bottom:2px}
.col i.c{background:var(--came)}
.col .top{position:absolute;left:50%;transform:translateX(-50%);font:600 10.5px "IBM Plex Mono",monospace;color:var(--ink-2);white-space:nowrap}
.axis{display:flex;gap:3px;margin-top:4px}
.axis span{flex:1;text-align:center;font-size:10.5px;color:var(--ink-3);min-width:0;overflow:hidden;white-space:nowrap}
.axis span.we{color:var(--ink);font-weight:600}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scrollx .inner{min-width:560px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:600 11.5px "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;padding:6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line-soft);font:13px "IBM Plex Mono",monospace}
td.t{font:600 13px "IBM Plex Sans",system-ui,sans-serif}
td.n,th.n{text-align:right}
.pct{display:inline-block;min-width:44px;text-align:center;border-radius:4px;padding:0 5px;background:var(--missed-soft);color:#9a3d0e;font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.35;padding:7px 9px;border-radius:7px;z-index:9;max-width:240px;display:none}
.muted{color:var(--ink-3)}
.foot{font-size:12px;color:var(--ink-3);margin:14px 2px 30px}
.err{color:#9a3d0e}
@media(max-width:820px){.grid,.hero{grid-template-columns:1fr}.hero .big{font-size:54px}.hb{grid-template-columns:62px 1fr 84px}}
</style></head><body>
<div class="wrap" id="app"><p class="muted">Loading attendance from the water test sheet…</p></div>
<div class="tip" id="tip"></div>
<script>
/* Expected vs Came -- hfpools.com/attendance (30 Sep 2026).
 * For the team: every morning at 7am the sheet records how many swimmers are
 * EXPECTED at each pool that day; at 8pm it records how many actually CAME.
 * The gap = swimmers who changed their mind on the day. The pool, coaches and
 * chemicals were already set up for the 7am number. Chun Kay's choice: swimmer
 * counts only, no money. Source: the pool-history web app (Pool Water Test
 * Records sheet: "expected7am" and "attended8pm"). Read-only. */
const HISTORY_API = "https://script.google.com/macros/s/AKfycbwYJLfkw5lwKnjwqmEtuRiREzbahnf2l63YhmX_7jMR9uqM9MpeqoxeVTTVw5rc76eZ6g/exec";
const POOLS = ["BK","CC","DR","HB","HS","JEIP1","JEIP2","JEOP1","JEOP2","Lentor","Tengah","TPY","WWW"];
const BRANCH_OF = p => /^JE/.test(p) ? "JE" : p;          // JE's four pools count as one branch
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], DOW_ORDER = [1,2,3,4,5,6,0];
const CACHE_KEY = "att.rows.v1";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const dateKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDay = k => { const d = parseKey(k); return DOW[d.getDay()] + " " + d.getDate() + " " + d.toLocaleDateString("en-SG", {month:"short"}); };
const fmtN = n => Number(n).toLocaleString("en-SG");
const pctOf = (m, e) => e ? Math.round(m / e * 1000) / 10 : 0;
const num = v => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? null : Number(v);

let ROWS = null, loadErr = null, period = "month";
try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if(c && Array.isArray(c.rows)) ROWS = c.rows; }catch(e){}
try{ const p = localStorage.getItem("att.period"); if(p) period = p; }catch(e){}

async function load(){
  const out = []; let fails = 0;
  await Promise.all(POOLS.map(p => fetch(HISTORY_API + "?pool=" + encodeURIComponent(p)).then(r => r.json()).then(j => {
    (j[p] || []).forEach(r => {
      const e = num(r.expected7am), a = num(r.attended8pm ?? r.attended);
      if(e === null || a === null || e <= 0) return;           // no count, or pool closed that day
      out.push({pool:p, branch:BRANCH_OF(p), date:r.date, exp:e, came:Math.min(a, e), extra:Math.max(0, a - e)});
    });
  }).catch(() => { fails++; })));
  if(out.length){ ROWS = out; try{ localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(), rows:out})); }catch(e){} }
  loadErr = fails ? `${fails} pool${fails > 1 ? "s" : ""} couldn't load — showing what came through.` : null;
  if(!out.length && !ROWS) loadErr = "Couldn't reach the sheet. Check your signal and reload.";
  draw();
}

function inPeriod(rows){
  // Today only counts once the 8pm number is in (after 9pm); before that "came" is still filling up.
  const now = new Date(), today = now.getHours() >= 21 ? dateKey(now) : dateKey(new Date(now.getTime() - 864e5));
  if(period === "month"){ const m = today.slice(0, 7); return rows.filter(r => r.date.startsWith(m) && r.date <= today); }
  if(period === "last"){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); const m = dateKey(d).slice(0, 7); return rows.filter(r => r.date.startsWith(m)); }
  if(period === "30"){ const d = new Date(); d.setDate(d.getDate() - 30); const from = dateKey(d); return rows.filter(r => r.date > from && r.date <= today); }
  return rows.filter(r => r.date <= today);
}
function sum(rows){ const e = rows.reduce((a, r) => a + r.exp, 0), c = rows.reduce((a, r) => a + r.came, 0); return {exp:e, came:c, missed:e - c}; }
function groupBy(rows, key){ const g = {}; rows.forEach(r => (g[key(r)] = g[key(r)] || []).push(r)); return g; }

function hbar(name, s, max, tip){
  const wc = s.exp ? s.came / max * 100 : 0, wm = s.exp ? s.missed / max * 100 : 0;
  return `<div class="hb" data-tip="${esc(tip)}"><span class="name">${esc(name)}</span>
    <div class="track"><i class="c" style="width:${wc}%"></i><i class="m" style="width:${wm}%"></i></div>
    <span class="val">${fmtN(s.missed)} missed<small>${pctOf(s.missed, s.exp)}% of ${fmtN(s.exp)}</small></span></div>`;
}
function columns(items, labelOf, weekendOf){
  const max = Math.max(1, ...items.map(x => x.s.exp));
  return `<div class="cols">${items.map(x => {
      const hc = x.s.came / max * 100, hm = x.s.missed / max * 100;
      return `<div class="col" data-tip="${esc(x.tip)}"><span class="top" style="bottom:calc(${hc + hm}% + 4px)">${x.s.missed ? fmtN(x.s.missed) : ""}</span><i class="m" style="height:${hm}%"></i><i class="c" style="height:${hc}%"></i></div>`;
    }).join("")}</div>
    <div class="axis">${items.map(x => `<span class="${weekendOf && weekendOf(x) ? "we" : ""}">${esc(labelOf(x))}</span>`).join("")}</div>`;
}

function draw(){
  const app = $("#app");
  if(!ROWS){ app.innerHTML = `<p class="${loadErr ? "err" : "muted"}">${esc(loadErr || "Loading attendance from the water test sheet…")}</p>`; return; }
  const rows = inPeriod(ROWS);
  const periods = [["month", "This month"], ["last", "Last month"], ["30", "Last 30 days"], ["all", "All"]];
  const tot = sum(rows);
  const first = rows.map(r => r.date).sort()[0], last = rows.map(r => r.date).sort().pop();
  const oneIn = tot.missed ? Math.round(tot.exp / tot.missed) : null;
  const days = [...new Set(rows.map(r => r.date))];
  const perDay = days.length ? Math.round(tot.missed / days.length) : 0;

  const byBranch = Object.entries(groupBy(rows, r => r.branch)).map(([b, rs]) => ({b, s:sum(rs), pools:[...new Set(rs.map(r => r.pool))]})).sort((a, b) => b.s.missed - a.s.missed);
  const maxB = Math.max(1, ...byBranch.map(x => x.s.exp));
  const byDow = DOW_ORDER.map(d => { const rs = rows.filter(r => parseKey(r.date).getDay() === d); return {d, s:sum(rs), n:new Set(rs.map(r => r.date)).size}; });
  const worstDow = byDow.filter(x => x.s.exp).sort((a, b) => b.s.missed / Math.max(1, b.n) - a.s.missed / Math.max(1, a.n))[0];
  const byDate = days.sort().map(k => ({k, s:sum(rows.filter(r => r.date === k))}));
  const worst = Object.values(groupBy(rows, r => r.branch + "|" + r.date)).map(rs => ({b:rs[0].branch, date:rs[0].date, s:sum(rs)})).filter(x => x.s.missed > 0)
    .sort((a, b) => b.s.missed - a.s.missed).slice(0, 10);

  app.innerHTML = `
    <h1>Expected vs Came</h1>
    <div class="sub">All branches · swimmers expected at 7am vs swimmers who came (8pm count)${first ? ` · ${fmtDay(first)} – ${fmtDay(last)}` : ""}</div>
    <div class="seg" role="group" aria-label="Period">${periods.map(([id, l]) => `<button aria-pressed="${period === id}" data-p="${id}">${l}</button>`).join("")}</div>
    ${loadErr ? `<p class="err" style="margin:0 0 10px">${esc(loadErr)}</p>` : ""}
    ${!rows.length ? `<div class="card"><p class="muted" style="margin:0">No counts in the sheet for this period yet.</p></div>` : `
    <div class="stack">
      <div class="card hero">
        <div>
          <div class="big">${fmtN(tot.missed)}</div>
          <div class="what">swimmers were expected but didn't come</div>
          <div class="ctx">${fmtN(tot.exp)} expected at 7am · ${fmtN(tot.came)} came · about ${fmtN(perDay)} a day across all branches</div>
        </div>
        <div>
          <div class="oneinn">1 in ${oneIn || "–"}<small>expected swimmers changed their mind on the day (${pctOf(tot.missed, tot.exp)}%)</small></div>
          <div class="mini">
            <div><b>${byBranch[0] ? esc(byBranch[0].b) : "–"}</b><span>most missed</span></div>
            <div><b>${worstDow ? DOW[worstDow.d] : "–"}</b><span>worst day of the week</span></div>
            <div><b>${days.length}</b><span>days counted</span></div>
          </div>
        </div>
      </div>

      <div class="card why">
        <h2>Why this matters</h2>
        <p>By 7am each branch is set up for the swimmers <b>expected</b> that day: coaches rostered, lanes and pool time booked, the water tested and dosed for that many people.</p>
        <p>When a swimmer changes their mind on the day, that set-up is already paid for — but the lesson doesn't happen. ${fmtN(tot.missed)} times in this period.</p>
      </div>

      <div class="grid">
        <div class="card">
          <h2>By branch</h2>
          <p class="lead">Whole bar = expected at 7am. Most missed first.</p>
          <div class="legend"><span><i class="sw" style="background:var(--came)"></i>Came</span><span><i class="sw" style="background:var(--missed)"></i>Expected, didn't come</span></div>
          ${byBranch.map(x => hbar(x.b, x.s, maxB, `${x.b}${x.pools.length > 1 ? " (" + x.pools.join(", ") + ")" : ""}: ${fmtN(x.s.exp)} expected, ${fmtN(x.s.came)} came, ${fmtN(x.s.missed)} missed (${pctOf(x.s.missed, x.s.exp)}%)`)).join("")}
        </div>
        <div class="card">
          <h2>By day of the week</h2>
          <p class="lead">All branches added up. Number on top = missed.</p>
          <div class="legend"><span><i class="sw" style="background:var(--came)"></i>Came</span><span><i class="sw" style="background:var(--missed)"></i>Expected, didn't come</span></div>
          ${columns(byDow.map(x => ({s:x.s, d:x.d, tip:`${DOW[x.d]} (${x.n} day${x.n === 1 ? "" : "s"}): ${fmtN(x.s.exp)} expected, ${fmtN(x.s.came)} came, ${fmtN(x.s.missed)} missed (${pctOf(x.s.missed, x.s.exp)}%)`})), x => DOW[x.d], x => x.d === 0 || x.d === 6)}
          <p class="lead" style="margin:10px 0 0">Missed as a share of expected: ${byDow.filter(x => x.s.exp).map(x => `${DOW[x.d]} ${pctOf(x.s.missed, x.s.exp)}%`).join(" · ")}</p>
        </div>
      </div>

      <div class="card">
        <h2>Day by day</h2>
        <p class="lead">Every day in the period, all branches added up. Hover or tap a bar for the numbers.</p>
        <div class="legend"><span><i class="sw" style="background:var(--came)"></i>Came</span><span><i class="sw" style="background:var(--missed)"></i>Expected, didn't come</span></div>
        <div class="scrollx"><div class="inner">${columns(byDate.map(x => ({s:x.s, k:x.k, tip:`${fmtDay(x.k)}: ${fmtN(x.s.exp)} expected, ${fmtN(x.s.came)} came, ${fmtN(x.s.missed)} missed (${pctOf(x.s.missed, x.s.exp)}%)`})), x => String(parseKey(x.k).getDate()), x => [0, 6].includes(parseKey(x.k).getDay()))}</div></div>
      </div>

      <div class="card">
        <h2>Biggest gaps · one branch, one day</h2>
        <div class="scrollx"><table><thead><tr><th>Day</th><th>Branch</th><th class="n">Expected</th><th class="n">Came</th><th class="n">Missed</th><th class="n">%</th></tr></thead><tbody>
          ${worst.map(x => `<tr><td class="t">${esc(fmtDay(x.date))}</td><td class="t">${esc(x.b)}</td><td class="n">${fmtN(x.s.exp)}</td><td class="n">${fmtN(x.s.came)}</td><td class="n"><b>${fmtN(x.s.missed)}</b></td><td class="n"><span class="pct">${pctOf(x.s.missed, x.s.exp)}%</span></td></tr>`).join("")}
        </tbody></table></div>
      </div>
    </div>`}
    <p class="foot">From the Pool Water Test Records sheet: "Expected" is the 7am count, "Came" is the 8pm attended count, per pool per day (JE = its four pools added up). Days with nothing expected are left out. Updates each time you open the page.</p>`;
  app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { period = b.dataset.p; try{ localStorage.setItem("att.period", period); }catch(e){} draw(); });
}

// Tooltip for bars (hover on a computer, tap on a phone).
const tip = $("#tip");
function showTip(el, x, y){ tip.textContent = el.dataset.tip; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + "px"; tip.style.top = Math.max(8, y - h - 12) + "px"; }
document.addEventListener("mousemove", e => { const el = e.target.closest("[data-tip]"); if(el) showTip(el, e.clientX, e.clientY); else tip.style.display = "none"; });
document.addEventListener("click", e => { const el = e.target.closest("[data-tip]"); if(el){ const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } else tip.style.display = "none"; });

draw(); load();
</script>
</body></html>
