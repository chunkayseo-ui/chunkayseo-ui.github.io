<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HF Pools · Spot vacuum</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#EEF3F3;--surface:#fff;--surface-2:#F6F9F9;--line:#C7D6D6;--line-soft:#DCE6E6;--ink:#0A1417;--ink-2:#33474D;--ink-3:#5B7378;
--accent:#00676F;--accent-soft:#DCEEEE;--ok:#256B4C;--ok-soft:#DDEEE5;--warn:#8A590D;--warn-soft:#F6EAD4;--urgent:#B23A2E;--urgent-soft:#F8DEDA}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{font:700 26px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0}
h1 small{font-size:15px;color:var(--accent);margin-left:6px}
h2{font:700 15px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:0 0 10px}
.me{margin-left:auto;font-size:13px;color:var(--ink-3)}
.me button,.link{border:0;background:none;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.note{font-size:13.5px;color:var(--ink-3)}
.b{display:block;width:100%;padding:14px;border-radius:10px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font:600 16px "IBM Plex Sans";cursor:pointer;margin-top:10px}
.b.main{background:var(--accent);color:#fff}
.b.sm{display:inline-block;width:auto;padding:8px 12px;font-size:14px;border-width:1px;margin-top:6px}
.b:disabled{opacity:.45;cursor:default}
.b.danger{border-color:var(--urgent);color:var(--urgent)}
.stage{display:flex;gap:6px;margin-bottom:12px}
.stage span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stage span.done{background:var(--ok)} .stage span.on{background:var(--accent)}
.stepno{font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.steptitle{font:700 22px/1.15 "Barlow Condensed",sans-serif;margin:0 0 8px}
.steptext{font-size:16px;margin:0 0 10px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 11px;font-size:14px;margin:8px 0}
.danger{background:var(--urgent-soft);color:var(--urgent);border-radius:8px;padding:9px 11px;font-size:14px;margin:8px 0}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:9px 11px;font-size:14px;margin:8px 0}
.photo{margin-top:10px;border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center}
.photo img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin:0 auto 8px}
.photo .st{font-size:13px;color:var(--ink-3)}
.photo .st.err{color:var(--urgent)}
.photo .st.ok{color:var(--ok)}
.cam{display:inline-block;padding:12px 18px;border-radius:10px;background:var(--accent);color:#fff;font:600 16px "IBM Plex Sans";cursor:pointer}
.cam input{display:none}
.clock{font:600 40px/1 "IBM Plex Mono",monospace;text-align:center;margin:10px 0 4px;color:var(--ink)}
.clock small{display:block;font:400 13px "IBM Plex Sans";color:var(--ink-3);margin-top:4px}
.done-list{margin:0;padding-left:20px;font-size:14.5px}.done-list li{margin:4px 0}
.tag{display:inline-block;font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.no{background:var(--urgent-soft);color:var(--urgent)}
.login{max-width:380px;margin:12vh auto 0}
.login input{width:100%;margin-top:4px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:7px}
.login label{display:block;font-size:13px;color:var(--ink-3);margin-top:12px}
.msg{font-size:13px;margin-top:8px;min-height:18px}.msg.err{color:var(--urgent)}.msg.ok{color:var(--ok)}
.motto{text-align:center;font:600 13px "IBM Plex Sans";color:var(--ink-3);margin-top:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .b{width:auto;flex:1;margin-top:0}
.hist{font-size:14px}.hist div{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line-soft)}.hist div:first-child{border-top:0}
.hist .t{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);flex:none;width:92px;font-size:13px}
</style></head><body>
<div class="wrap" id="app"><p class="note">Loading…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* HF Pools — Spot vacuum for the operations team (Kay, 9 Oct 2026).
 * BK's operations staff do a quick daily vacuum of the visible dirt (5–10 min). This page walks them
 * through the same BEFORE (S1…) and AFTER (E1…) steps as the facility team's route card, one photo per
 * step, with one "vacuum done" photo in between. No route sections.
 * Who may use it: people in dosing_config/ops_staff with "Practical passed" ticked by Kay/William AND a
 * pass on the "Spot vacuum" lesson at hfpools.com/learn (learn_results). Steps come live from the route
 * card (dosing-app/vacuum-route-maps.html, data-steps S and E steps). Photos go up through the tracker's photo
 * relay (dosing_config/tasks.photo). The job is saved as a dosing_rounds doc (kind "ops-vacuum") so the
 * branch Telegram message, hfpools.com/vacuum and the dashboard pick it up like any manual vacuum. */
firebase.initializeApp({
  apiKey: "AIzaSyANFCZbvRGO9aMRtG9MF_qONO3FL85CzSo", authDomain: "maintenance-board-f931a.firebaseapp.com",
  projectId: "maintenance-board-f931a", storageBucket: "maintenance-board-f931a.firebasestorage.app",
  messagingSenderId: "169864970579", appId: "1:169864970579:web:bfb7490d0aebcfed17e1a6"
});
const auth = firebase.auth(), db = firebase.firestore();
const ROUTE_URL = "https://hfpools.com/dosing-app/vacuum-route-maps.html";
const LESSON_ID = "opsvac";
const OUTLET_NAMES = {BK:"Buangkok", TENGAH:"Tengah", DR:"DR (Bukit Timah)", HS:"Home@Steven", HB:"Home@Bedok", CC:"Chai Chee", TPY:"Toa Payoh", WWW:"Downtown East", LENTOR:"Lentor"};
const PHOTO_MAX_PX = 1280, EXPECTED_MIN = 10;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const uid = () => Math.random().toString(36).slice(2, 9);
const clock = iso => new Date(iso).toLocaleTimeString("en-SG", {hour:"2-digit", minute:"2-digit", hour12:false});
const emailKey = e => String(e || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "_");
// Kay and William may open the page to check it without being certified (same email hashes as /learn).
const BOSSES = {"d05dba20d3700faa4e379cb3efaf38d69ea2e16a6eb31ddbf8166facafde882d":"Kay", "6ba3ddae7dbb119b31d474b6551b38f271c6df9613b44889fd8cfff6e8c47edf":"William"};
async function bossName(email){
  try{ const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(email || "").trim().toLowerCase()));
    return BOSSES[Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join("")] || null; }catch(e){ return null; }
}

// Extra rules for people who are not pool technicians — added on top of the route card's own step text.
const EXTRA = {
  setup: {
    title: "Set up — fill the hose with water first",
    text: "Fix the vacuum head to the pole and the hose. Put the head in the pool. Push the hose under the water a bit at a time until the whole hose is full and no more bubbles come out. Only then connect the hose end to the vacuum port.",
    why: "Air in the hose goes into the pump. The pump loses its water and can be damaged."
  },
  vacuum: {
    title: "Vacuum the visible dirt",
    text: "Move the head slowly along the floor, like mopping. Overlap each stroke a little. You only need to clean the dirty spots, not the whole pool.",
    keep: "Keep the vacuum head ON THE FLOOR the whole time. Lifting it out of the water, even for a second, sucks air into the pump. To move to another spot, slide it along the floor.",
    stop: "STOP and call the facility team if: the pump gets loud, the suction stops, bubbles keep coming in the pump cover, or something is stuck."
  },
  E1: "Disconnect the hose at the VACUUM PORT first. Keep the hose end up so the water stays in. Only then take the hose off the vacuum head. Never the other way round — an open hose on the port sucks air into the pump.",
  E2: "Do this BEFORE closing anything. If the vacuum port or valve is closed while the skimmer control valve is still half closed, the pump has almost no water coming in and can run dry.",
  order: "After vacuuming the order is always: open the skimmer control valve → close the vacuum valve → close the vacuum port."
};

const S = {user:null, me:null, cert:null, cfg:{}, steps:null, pool:"", job:null, busy:false, err:"", history:[]};
const DRAFT_KEY = "hf-ops-job";
try{ const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); if(d && d.date === todayKey()) S.job = d; }catch(e){}
function saveDraft(){ try{ S.job ? localStorage.setItem(DRAFT_KEY, JSON.stringify(S.job)) : localStorage.removeItem(DRAFT_KEY); }catch(e){} }

/* ---------- who is allowed ---------- */
async function loadMe(){
  const email = (S.user.email || "").toLowerCase();
  let rec = null;
  try{ const d = await db.doc("dosing_config/ops_staff").get(); const people = (d.exists && d.data().people) || {}; rec = people[emailKey(email)] || Object.values(people).find(p => String(p.email || "").toLowerCase() === email) || null; }catch(e){ S.err = "Couldn't read the staff list: " + e.message; }
  let quiz = null;
  try{ const q = await db.collection("learn_results").where("login", "==", email).where("lesson", "==", LESSON_ID).get(); q.forEach(x => quiz = x.data()); }catch(e){}
  const boss = await bossName(email);
  S.me = rec ? {name: rec.name || email.split("@")[0], outlet: rec.outlet || "BK", listed:true} : {name: boss || email.split("@")[0], outlet:"BK", listed:false};
  S.me.boss = !!boss;
  S.cert = {quiz: !!(quiz && quiz.passed), practical: !!(rec && rec.practical), listed: !!rec};
  S.pool = S.me.outlet;
}
const certified = () => !!(S.cert && ((S.cert.listed && S.cert.quiz && S.cert.practical) || (S.me && S.me.boss)));

/* ---------- steps from the route card ---------- */
async function loadSteps(pool){
  const t = await fetch(ROUTE_URL + "?v=" + Math.floor(Date.now() / 3600e3), {cache:"no-cache"}).then(r => r.ok ? r.text() : "");
  const doc = new DOMParser().parseFromString(t, "text/html");
  const card = Array.from(doc.querySelectorAll(".card")).find(c => { const k = c.querySelector(".code"); return k && k.textContent.trim().toUpperCase() === pool.toUpperCase(); });
  const svg = card && card.querySelector(".plan svg[data-steps]");
  if(!svg) throw new Error("no route card for " + pool);
  const steps = JSON.parse(svg.getAttribute("data-steps"));
  const pick = p => steps.filter(s => (s.photos || []).some(x => x[0] === p)).map(s => ({id: s.photos.find(x => x[0] === p), title: String(s.t || "").replace(/^.*?·\s*/, ""), text: s.d || "", photo: s.sayP || "Take a photo."}));
  return {before: pick("S"), after: pick("E")};
}
async function loadCfg(){ try{ const d = await db.doc("dosing_config/tasks").get(); S.cfg = (d.exists && d.data()) || {}; }catch(e){} }
const relayCfg = () => (S.cfg.photo && S.cfg.photo.relayUrl) ? S.cfg.photo : null;

/* ---------- photos (same relay as the tracker) ---------- */
async function loadPhoto(file){
  try{ return await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){ return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); }); }
}
async function preparePhoto(file, lines){
  const img = await loadPhoto(file);
  const sc = Math.min(1, PHOTO_MAX_PX / Math.max(img.width, img.height)), W = Math.round(img.width * sc), H = Math.round(img.height * sc);
  const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d"); g.drawImage(img, 0, 0, W, H);
  const fs = Math.max(14, Math.round(W / 40)), p = Math.round(fs * .6), bandH = p * 2 + lines.length * Math.round(fs * 1.3);
  g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(0, H - bandH, W, bandH); g.fillStyle = "#fff"; g.font = `600 ${fs}px "IBM Plex Mono", monospace`; g.textBaseline = "top";
  lines.forEach((ln, i) => g.fillText(ln, p, H - bandH + p + i * Math.round(fs * 1.3)));
  const dataUrl = c.toDataURL("image/jpeg", 0.82);
  return {dataUrl, base64: dataUrl.split(",")[1]};
}
let relayChain = Promise.resolve();
function relayUpload(payload){ const run = () => relayTry(payload); const next = relayChain.then(run, run); relayChain = next.catch(() => {}); return next; }
async function relayTry(payload){
  let last;
  for(let i = 0; i < 3; i++){
    try{ return await relayPost(payload); }
    catch(e){ last = e; if(e && e.relay && !e.transient) throw e; if(i < 2) await new Promise(r => setTimeout(r, 900 * Math.pow(2, i))); }
  }
  throw last;
}
async function relayPost(payload){
  const rc = relayCfg(); if(!rc) throw new Error("The photo relay isn't set up.");
  let res;
  try{ res = await fetch(rc.relayUrl, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({key: rc.key || ""}, payload))}); }
  catch(e){ const err = new Error("No answer from the photo relay — check the signal."); err.network = true; throw err; }
  if(!res.ok){ const transient = res.status === 404 || res.status === 429 || res.status >= 500; const err = new Error(transient ? "The relay was busy (HTTP " + res.status + ")." : "The photo relay answered HTTP " + res.status + "."); err.relay = true; err.transient = transient; throw err; }
  let j = null; try{ j = await res.json(); }catch(e){ const err = new Error("The photo relay sent something unexpected back."); err.relay = true; err.transient = true; throw err; }
  if(!j || !j.ok){ const err = new Error(String((j && j.error) || "The photo relay refused the upload.")); err.relay = true; throw err; }
  return j;
}
function stampLines(stepId, label){
  const n = new Date();
  return [`${S.pool} · Spot vacuum (Ops) · ${stepId} ${label}`.slice(0, 60), `${S.me.name} · ${n.getDate()} ${MONTH_ABBR[n.getMonth()]} ${n.getFullYear()} ${pad(n.getHours())}:${pad(n.getMinutes())}`];
}
async function takePhoto(file, stepId, label){
  const j = S.job; j.photos = j.photos || {};
  const ph = j.photos[stepId] = {status:"preparing", takenAt: new Date().toISOString()}; render();
  let prepared;
  try{ prepared = await preparePhoto(file, stampLines(stepId, label)); }
  catch(e){ delete j.photos[stepId]; S.err = "Couldn't read that photo. Try again."; render(); return; }
  ph.status = "uploading"; ph.dataUrl = prepared.dataUrl; render();
  try{
    const n = Object.keys(j.photos).length;
    const r = await relayUpload({kind:"job", outlet:S.pool, pool:S.pool, job:`Spot vacuum (Ops team) · ${stepId} ${label}`, person:S.me.name + (S.me.boss ? " (Ops test)" : " (Ops)"), takenAt:ph.takenAt, date:todayKey(), tool:"none", wantReading:false, imageBase64:prepared.base64, photoNo:n});
    Object.assign(ph, {status:"done", fileId:r.fileId, url:r.url, thumb:r.thumb || null}); delete ph.dataUrl; ph.preview = r.thumb || r.url;
  }catch(e){ ph.status = "failed"; ph.error = e.message; }
  saveDraft(); render();
}

/* ---------- the job ---------- */
// stages: before (S steps) → setup → vacuum → after (E steps) → done
function stepList(){ const st = S.steps; return [].concat(st.before.map(s => Object.assign({stage:"before"}, s)), [{id:"V1", stage:"setup", title:EXTRA.setup.title, text:EXTRA.setup.text, why:EXTRA.setup.why, photo:"Take a photo of the hose connected at the vacuum port, full of water."}], [{id:"V2", stage:"vacuum", title:EXTRA.vacuum.title, text:EXTRA.vacuum.text, photo:"Take a photo of the pool floor you vacuumed."}], st.after.map(s => Object.assign({stage:"after"}, s))); }
function startJob(){
  S.job = {id:uid(), date:todayKey(), pool:S.pool, startedAt:new Date().toISOString(), step:0, photos:{}, vacStart:null, vacEnd:null, doneAt:null, saved:false};
  saveDraft(); render();
}
function photoOk(id){ const p = S.job.photos[id]; return p && p.status === "done"; }
async function nextStep(){
  const steps = stepList(), cur = steps[S.job.step];
  if(cur.stage === "setup" && !S.job.vacStart) S.job.vacStart = new Date().toISOString();
  if(cur.stage === "vacuum" && !S.job.vacEnd) S.job.vacEnd = new Date().toISOString();
  if(S.job.step < steps.length - 1){ S.job.step++; saveDraft(); render(); return; }
  await finishJob();
}
async function finishJob(){
  const j = S.job; j.doneAt = new Date().toISOString(); S.busy = true; render();
  const photos = {}; Object.keys(j.photos).forEach(id => { const p = j.photos[id]; if(p.status === "done") photos[id] = {fileId:p.fileId || null, url:p.url || null, thumb:p.thumb || null, takenAt:p.takenAt}; });
  const ids = Object.keys(photos), ts = ids.map(id => photos[id].takenAt).sort();
  const minutes = j.vacStart && j.vacEnd ? Math.max(0, Math.round((new Date(j.vacEnd) - new Date(j.vacStart)) / 60000)) : null;
  const testRun = !!(S.me.boss && !(S.cert.listed && S.cert.quiz && S.cert.practical));
  const person = S.me.name + (testRun ? " (Ops test)" : " (Ops)"), docId = j.date + "__ops-" + slug(S.me.name) + (testRun ? "-test" : "");
  const task = {id:"opsvac-" + j.id, name:"Spot vacuum (Ops team)", pool:S.pool, claimedBy:person, startedAt:j.startedAt, doneAt:j.doneAt, ops:true,
    vac:{spot:true, poolKey:S.pool, by:person, photos, firstAt:j.startedAt, lastAt:j.doneAt, minutes, vacuumMin:minutes, sections:{total:0, done:[], skipped:[], notDone:[]}}};
  try{
    const ref = db.doc("dosing_rounds/" + docId);
    await db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      const r = snap.exists ? snap.data() : {date:j.date, person, personSlug:slug(person), kind:"ops-vacuum", createdAt:j.startedAt, stops:[], ...(testRun ? {test:true} : {})};
      let stop = (r.stops || []).find(s => s.outlet === S.pool);
      if(!stop){ stop = {outlet:S.pool, arriveAt:j.startedAt, departAt:null, tasks:[]}; r.stops = (r.stops || []).concat([stop]); }
      stop.tasks = (stop.tasks || []).filter(t => t.id !== task.id).concat([task]); stop.departAt = j.doneAt;
      tx.set(ref, r);
    });
    j.saved = true; j.roundId = docId; j.taskId = task.id; j.test = testRun;
    S.history.unshift({at:j.doneAt, by:person, minutes, photos:ids.length, link:`https://hfpools.com/vacuum?r=${encodeURIComponent(docId)}&t=${encodeURIComponent(task.id)}`});
  }catch(e){ S.err = "Couldn't save the job: " + e.message + " — check the signal and press Save again."; j.doneAt = null; }
  S.busy = false; saveDraft(); render();
}
async function loadHistory(){
  try{
    const from = new Date(Date.now() - 14 * 86400000); const fk = from.getFullYear() + "-" + pad(from.getMonth() + 1) + "-" + pad(from.getDate());
    const q = await db.collection("dosing_rounds").where("kind", "==", "ops-vacuum").where("date", ">=", fk).get();
    const out = [];
    q.forEach(d => { const r = d.data(); if(r.test || /test/i.test(String(r.person || ""))) return; (r.stops || []).forEach(s => { if(s.outlet !== S.pool) return; (s.tasks || []).forEach(t => { if(!t.doneAt) return; const v = t.vac || {}; out.push({at:t.doneAt, by:t.claimedBy || r.person, minutes:v.minutes, photos:Object.keys(v.photos || {}).length, link:`https://hfpools.com/vacuum?r=${encodeURIComponent(d.id)}&t=${encodeURIComponent(t.id)}`}); }); }); });
    S.history = out.sort((a, b) => b.at < a.at ? -1 : 1);
  }catch(e){ /* a missing index just means no list */ }
}

/* ---------- views ---------- */
function header(){ return `<header><h1>HF Pools <small>Spot vacuum · ${esc(S.pool)}</small></h1><span class="me">${esc(S.me.name)} · <button id="out">Sign out</button></span></header>`; }
function gateView(){
  const c = S.cert, row = (ok, text, hint) => `<li><span class="tag ${ok ? "ok" : "no"}">${ok ? "Done" : "Not yet"}</span> ${text}${!ok && hint ? ` <span class="note">— ${hint}</span>` : ""}</li>`;
  return `${header()}<div class="card"><h2>Before you can vacuum</h2>
    <p class="steptext">This job is for certified staff only. Three things are needed:</p>
    <ol class="done-list">
      ${row(c.listed, "You are on the operations team list.", "ask Kay or William to add your email")}
      ${row(c.quiz, `You passed the <a class="link" href="https://hfpools.com/learn" target="_blank" rel="noopener">Spot vacuum lesson</a>.`, "open hfpools.com/learn and pass the quiz")}
      ${row(c.practical, "William watched you do it once and ticked “Practical passed”.", "ask William")}
    </ol>
    <button class="b" id="recheck">Check again</button></div>
    <p class="motto">Test right, dose right, let little swimmers thrive.</p>`;
}
function homeView(){
  const h = S.history.slice(0, 10);
  return `${header()}<div class="card"><h2>Today</h2>
    <p class="steptext">Quick vacuum of the visible dirt at ${esc(OUTLET_NAMES[S.pool] || S.pool)}. About 5–10 minutes. One photo at every step.</p>
    ${S.me.boss && !(S.cert.listed && S.cert.quiz && S.cert.practical) ? `<div class="warn">Supervisor check: you can go through the whole job. Your run is saved as a TEST — no message goes to the BK group and it stays off the dashboard.</div>` : ""}
    ${relayCfg() ? "" : `<div class="danger">The photo relay isn't set up, so photos can't be saved. Tell Kay.</div>`}
    <button class="b main" id="start" ${relayCfg() ? "" : "disabled"}>Start spot vacuum</button></div>
    <div class="card"><h2>Last 14 days</h2>${h.length ? `<div class="hist">${h.map(x => `<div><span class="t">${esc(new Date(x.at).toLocaleDateString("en-SG", {day:"numeric", month:"short"}))} ${esc(clock(x.at))}</span><span><b>${esc(String(x.by).replace(/ \(Ops\)$/, ""))}</b>${x.minutes != null ? ` · ${x.minutes} min` : ""} · ${x.photos} photos · <a class="link" href="${esc(x.link)}" target="_blank" rel="noopener">view</a></span></div>`).join("")}</div>` : `<span class="note">No spot vacuum recorded yet.</span>`}</div>
    <p class="note">Rule reminder: ${esc(EXTRA.order)}</p>
    <p class="motto">Test right, dose right, let little swimmers thrive.</p>`;
}
function stepView(){
  const steps = stepList(), i = S.job.step, s = steps[i], ph = S.job.photos[s.id], ok = photoOk(s.id), last = i === steps.length - 1;
  const stageName = {before:"Before starting", setup:"Set up", vacuum:"Vacuum", after:"After vacuuming"}[s.stage];
  const bar = steps.map((x, k) => `<span class="${k < i ? "done" : k === i ? "on" : ""}"></span>`).join("");
  let extra = "";
  if(s.stage === "before" && s.id === steps[0].id) extra = `<div class="warn">Do the steps in this order. Take the photo only after the step is really done.</div>`;
  if(s.why) extra += `<div class="warn">${esc(s.why)}</div>`;
  if(s.stage === "vacuum") extra += `<div class="danger">${esc(EXTRA.vacuum.keep)}</div><div class="warn">${esc(EXTRA.vacuum.stop)}</div>`;
  if(s.stage === "after" && EXTRA[s.id]) extra += `<div class="${s.id === "E2" ? "danger" : "warn"}">${esc(EXTRA[s.id])}</div>`;
  if(s.stage === "after" && s.id === (S.steps.after[0] || {}).id) extra += `<div class="okbox">${esc(EXTRA.order)}</div>`;
  const timer = s.stage === "vacuum" && S.job.vacStart ? `<div class="clock" id="clock">${elapsed(S.job.vacStart)}<small>vacuuming time · about 5–10 min is normal</small></div>` : "";
  return `${header()}<div class="stage">${bar}</div>
    <div class="card"><div class="stepno">${esc(stageName)} · step ${i + 1} of ${steps.length}</div>
      <h3 class="steptitle">${esc(s.id)} · ${esc(s.title)}</h3>
      <p class="steptext">${esc(s.text)}</p>${extra}${timer}
      <div class="photo">${ph && (ph.preview || ph.dataUrl) ? `<img src="${esc(ph.preview || ph.dataUrl)}" alt="">` : ""}
        ${ph ? `<div class="st ${ph.status === "done" ? "ok" : ph.status === "failed" ? "err" : ""}">${ph.status === "done" ? "Photo saved ✓" : ph.status === "failed" ? "Upload failed: " + esc(ph.error || "") : ph.status === "uploading" ? "Uploading…" : "Preparing…"}</div>` : `<div class="st">${esc(s.photo)}</div>`}
        <label class="cam">${ph ? "Retake photo" : "📷 Take photo"}<input type="file" accept="image/*" capture="environment" id="cam"></label></div>
      <button class="b main" id="next" ${ok && !S.busy ? "" : "disabled"}>${last ? (S.busy ? "Saving…" : "Finish — save the job") : "Next step"}</button>
      ${i > 0 ? `<button class="b sm" id="prev">‹ Back</button>` : ""}
      <button class="b sm danger" id="cancel">Cancel this job</button></div>
    ${S.err ? `<div class="msg err">${esc(S.err)}</div>` : ""}`;
}
function doneView(){
  const j = S.job, n = Object.keys(j.photos).filter(photoOk).length, mins = j.vacStart && j.vacEnd ? Math.round((new Date(j.vacEnd) - new Date(j.vacStart)) / 60000) : null;
  return `${header()}<div class="card"><h2>Spot vacuum saved ✓</h2>
    <p class="steptext">${esc(OUTLET_NAMES[S.pool] || S.pool)} · ${esc(clock(j.startedAt))}–${esc(clock(j.doneAt))}${mins != null ? ` · ${mins} min vacuuming` : ""} · ${n} photos</p>
    ${j.test ? `<div class="warn">Saved as a test run — nothing was sent to the BK group.</div>` : `<div class="okbox">The BK group gets a message with the photos. Thank you!</div>`}
    ${j.roundId ? `<a class="b" href="https://hfpools.com/vacuum?r=${encodeURIComponent(j.roundId)}&t=${encodeURIComponent(j.taskId)}" target="_blank" rel="noopener">See the record</a>` : ""}
    <button class="b main" id="home">Done</button></div>
    <p class="motto">Test right, dose right, let little swimmers thrive.</p>`;
}
function elapsed(iso){ const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000)); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); }
function render(){
  if(!S.user) return;
  const v = !certified() ? "gate" : !S.job ? "home" : S.job.saved ? "done" : "step";
  $("#app").innerHTML = v === "gate" ? gateView() : v === "home" ? homeView() : v === "done" ? doneView() : stepView();
  $("#out").onclick = () => auth.signOut();
  if(v === "gate"){ $("#recheck").onclick = async () => { await loadMe(); render(); }; }
  if(v === "home"){ $("#start").onclick = startJob; }
  if(v === "done"){ $("#home").onclick = () => { S.job = null; saveDraft(); render(); }; }
  if(v === "step"){
    const steps = stepList(), s = steps[S.job.step];
    $("#cam").onchange = e => { const f = e.target.files && e.target.files[0]; if(f){ S.err = ""; takePhoto(f, s.id, s.title); } };
    $("#next").onclick = nextStep;
    const p = $("#prev"); if(p) p.onclick = () => { S.job.step--; saveDraft(); render(); };
    $("#cancel").onclick = () => { if(confirm("Cancel this spot vacuum? The photos taken so far are not recorded as a job.")) { S.job = null; saveDraft(); render(); } };
  }
}
setInterval(() => { const c = $("#clock"); if(c && S.job && S.job.vacStart && !S.job.vacEnd){ c.firstChild.textContent = elapsed(S.job.vacStart); } }, 1000);

function loginView(msg){
  $("#app").innerHTML = `<div class="card login"><h1 style="font-size:24px">HF Pools <small>Spot vacuum</small></h1>
    <form id="lf"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
    <button class="b main" style="width:100%;margin-top:16px">Sign in</button></form><div class="msg err">${esc(msg || "")}</div>
    <p class="note" style="margin-top:8px">Same login as hfpools.com/learn.</p></div>`;
  $("#lf").onsubmit = async e => { e.preventDefault(); try{ await auth.signInWithEmailAndPassword($("#em").value.trim(), $("#pw").value); }catch(err){ loginView("Email or password is not right."); } };
}
auth.onAuthStateChanged(async u => {
  S.user = u; if(!u){ loginView(); return; }
  $("#app").innerHTML = `<p class="note">Checking your certification…</p>`;
  await loadMe();
  if(certified()){
    await loadCfg();
    try{ S.steps = await loadSteps(S.pool); }catch(e){ S.steps = {before:[], after:[]}; S.err = "Couldn't load the steps for " + S.pool + ": " + e.message; }
    loadHistory().then(render);
  }
  render();
});
</script>
<script src="https://hfpools.com/nav.js" defer></script>
</body></html>
